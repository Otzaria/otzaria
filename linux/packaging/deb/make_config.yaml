display_name: Otzaria
package_name: otzaria

maintainer:
  name: Sivan22
  email: sivan.ratson@gmail.com

priority: optional

section: x11

installed_size: 50000

# ספריות המארח שנדרשות לקישור או לטעינה דינמית ואינן נארזות בחבילה.
dependencies:
  - libgtk-3-0
  - libsecret-1-0
  - libharfbuzz-icu0
  - libwayland-server0
  - libegl1
  - libgles2
  - libgl1
  - libgbm1
  - libx11-xcb1
  - libcurl4
  - libxmu6

essential: false

icon: assets/icon/icon_256.png

keywords:
  - Hebrew
  - Books
  - Library
  - Jewish
  - Text

generic_name: Hebrew Library

categories:
  - Education
  - Utility

startup_notify: true

# רישום סכימת otzaria:// — בלעדיו קישורי deep-link (התקנת תוסף מהדפדפן)
# לא מגיעים לאפליקציה. ה-runner מעביר את ה-URI כארגומנט ל-Dart דרך %U.
# קובצי .otzplugin: את סוג ה-MIME עצמו האפליקציה רושמת אצל המשתמש.
supported_mime_type:
  - x-scheme-handler/otzaria
  - application/x-otzaria-plugin
