name: DOM-free runtime experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tool/perf_probe/domless_runtime/**'
      - 'test/tool/perf_probe/domless_runtime_test.dart'
      - 'integration_test/domless_webview_reference_test.dart'
      - 'lib/plugins/bridge/plugin_bridge_handler.dart'
      - 'lib/plugins/view/plugin_sdk_scripts.dart'
      - '.github/workflows/domless-runtime-experiment.yml'

permissions:
  contents: read

concurrency:
  group: domless-experiment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OTZARIA_DOMLESS_MEASURE: '1'
    steps:
      - name: Enable long Git paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7.0.1
      - name: Checkout the pinned audited plugin source
        uses: actions/checkout@v7.0.1
        env:
          # Preserve the audited bytes on Windows as well as Unix hosts.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
        with:
          repository: Otzaria/otzaria-plugins-store
          ref: 33a3b218b81ac6f51393a243e6002ddd04c9c2b8
          path: .domless-plugin-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /background.html
            /manifest.json
            /i18n/en.js
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Unicode preparation and archive integrity contract
        run: python -m unittest discover -s tool/perf_probe/domless_runtime -p prepare_test.py -v
      - name: Build pinned experimental engine and verify pinned plugin source
        env:
          OTZARIA_DOMLESS_CACHE: ${{ runner.temp }}/otzaria-domless-experiment
          OTZARIA_DOMLESS_PLUGIN_SOURCE: ${{ github.workspace }}/.domless-plugin-source
        shell: bash
        run: python tool/perf_probe/domless_runtime/prepare.py --cache "$OTZARIA_DOMLESS_CACHE" --plugin-source "$OTZARIA_DOMLESS_PLUGIN_SOURCE"
      - name: Resolve unchanged application dependencies
        run: flutter pub get --enforce-lockfile
      - name: Native SDK, permission, lifecycle and resource contract
        env:
          OTZARIA_DOMLESS_CACHE: ${{ runner.temp }}/otzaria-domless-experiment
        run: flutter test --no-pub --reporter expanded test/tool/perf_probe/domless_runtime_test.dart
      - name: Preserve native-only observations
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: domless-native-observations-${{ matrix.os }}
          path: ${{ runner.temp }}/otzaria-domless-experiment/native-measurements.json
          if-no-files-found: warn
