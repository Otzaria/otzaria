name: Automerge

# ממזג בשם Otzaria Bot, בקומיט מיזוג, PR עם תווית automerge כשכל הבדיקות עברו על ה-head שלו.
# ענף שמאחורי הבסיס עובר קודם ריבייס ודחיפה בכוח, וה-CI רץ עליו שוב לפני המיזוג.
# אין כאן הרצה של קוד מה-PR: רק git rebase ו-push.
on:
  pull_request_target:
    types: [labeled, ready_for_review]
  workflow_run:
    workflows: ['**', '!Automerge']
    types: [completed]

permissions: {}

jobs:
  find:
    name: Find PRs to check
    if: >-
      (github.event_name == 'pull_request_target' &&
       contains(github.event.pull_request.labels.*.name, 'automerge')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'pull_request' ||
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'dev' &&
         github.event.workflow_run.name == 'Flutter Tests')))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    outputs:
      prs: ${{ steps.find.outputs.prs }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          R=$GITHUB_REPOSITORY
          # dev אדום (dev_health.yml) עוצר מיזוגים; dev שחזר לירוק בודק מחדש את כל הממתינים.
          dev=$(gh api "repos/$R/actions/workflows/flutter_tests.yml/runs?branch=dev&event=push&status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')
          if [ "$dev" = failure ]; then
            echo "dev is red; merges wait until it is green again"
            echo 'prs=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$PR" ]; then
            prs="[$PR]"
          elif [ "$RUN_EVENT" = push ]; then
            prs=$(gh pr list -R "$R" --state open --label automerge --json number --jq 'map(.number)')
          else
            prs=$(gh pr list -R "$R" --state open --label automerge --search "$SHA" --json number,headRefOid \
              --jq "map(select(.headRefOid == \"$SHA\") | .number)")
          fi
          echo "prs=$prs" | tee -a "$GITHUB_OUTPUT"

  merge:
    name: 'Automerge #${{ matrix.pr }}'
    needs: find
    if: needs.find.outputs.prs != '' && needs.find.outputs.prs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.find.outputs.prs) }}
    # בדיקה אחת בכל פעם לכל PR, וכל אירוע נכנס לתור במקום להחליף את הממתין.
    concurrency:
      group: automerge-${{ matrix.pr }}
      cancel-in-progress: false
      queue: max
    steps:
      - id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BOT_SLUG: ${{ steps.token.outputs.app-slug }}
          PR: ${{ matrix.pr }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          R=$GITHUB_REPOSITORY

          comment() {
            local f="$RUNNER_TEMP/comment.md"
            printf '<div dir="rtl">\n\n### %s\n\n%s\n\n</div>\n' "$1" "$2" > "$f"
            gh pr comment "$PR" -R "$R" --body-file "$f"
          }
          give_up() {
            gh api -X DELETE "repos/$R/issues/$PR/labels/automerge" > /dev/null 2>&1 || true
            comment "⚠️ המיזוג האוטומטי בוטל" "$1"$'\n\n'"אחרי הטיפול, הוסיפו שוב את התווית \`automerge\`."
            exit 0
          }

          pr=$(gh api "repos/$R/pulls/$PR")
          [ "$(jq -r .state <<< "$pr")" = open ] || { echo "PR is $(jq -r .state <<< "$pr")"; exit 0; }
          jq -e '.labels | map(.name) | index("automerge") != null' <<< "$pr" > /dev/null \
            || { echo "No automerge label"; exit 0; }
          [ "$(jq -r .draft <<< "$pr")" = false ] || { echo "Draft"; exit 0; }
          head=$(jq -r .head.sha <<< "$pr")
          base=$(jq -r .base.ref <<< "$pr")

          # תווית מכל מי שיש לו triage הייתה מאפשרת לו למזג; נבדק בכל ריצה, לא רק בהוספה.
          if [ "$ACTION" = labeled ] && [ "$ADDED_LABEL" = automerge ]; then
            labeler=$SENDER
          else
            labeler=$(gh api --paginate "repos/$R/issues/$PR/events" \
              --jq '.[] | select(.event == "labeled" and .label.name == "automerge") | .actor.login' | tail -n 1)
          fi
          perm=$(gh api "repos/$R/collaborators/$labeler/permission" --jq .permission 2> /dev/null || echo none)
          case "$perm" in
            admin|write) ;;
            *) give_up "את התווית הוסיף \`$labeler\`, שאין לו הרשאת כתיבה בריפו." ;;
          esac

          # אותו check יכול להופיע בכמה check suites (ריצות שהתוויות הפעילו); קובע האחרון לכל שם.
          runs=$(gh api --paginate "repos/$R/commits/$head/check-runs?per_page=100" \
            --jq '.check_runs[] | {name, status, conclusion, started_at}' \
            | jq -s 'group_by(.name) | map(max_by(.started_at))')
          pending=$(jq -r 'map(select(.status != "completed")) | .[].name' <<< "$runs")
          [ -z "$pending" ] || { echo "Still running:"; echo "$pending"; exit 0; }
          # כשל מטופל ב-auto-draft-failed-ci.yml (הרצה חוזרת או טיוטה); כאן רק לא ממזגים.
          bad=$(jq -r 'map(select(.conclusion | IN("success", "skipped", "neutral") | not)) | .[].name' <<< "$runs")
          [ -z "$bad" ] || { echo "Not passing:"; echo "$bad"; exit 0; }
          if ! jq -e 'any(.[]; .name == "CI result" and .conclusion == "success")' <<< "$runs" > /dev/null; then
            echo "No successful CI result on $head"
            if [ "$ADDED_LABEL" = automerge ] && \
               ! jq -e '.labels | map(.name) | index("run-ci") != null' <<< "$pr" > /dev/null; then
              comment "⏳ המיזוג האוטומטי ממתין" "ה-CI המלא לא רץ על הקומיט \`${head:0:7}\`. הוסיפו את התווית \`run-ci\`, והמיזוג יתבצע כשהבדיקות יעברו."
            fi
            exit 0
          fi
          statuses=$(gh api "repos/$R/commits/$head/status")
          if [ "$(jq .total_count <<< "$statuses")" -gt 0 ] && [ "$(jq -r .state <<< "$statuses")" != success ]; then
            echo "Commit statuses are $(jq -r .state <<< "$statuses")"
            exit 0
          fi

          behind=$(gh api "repos/$R/compare/$base...$head" --jq .behind_by)
          if [ "$behind" -gt 0 ]; then
            head_repo=$(jq -r .head.repo.full_name <<< "$pr")
            head_ref=$(jq -r .head.ref <<< "$pr")
            if [ "$head_repo" != "$R" ] && [ "$(jq -r .maintainer_can_modify <<< "$pr")" != true ]; then
              give_up "הענף נמצא ב-fork שלא מאפשר עריכה למתחזקים (Allow edits by maintainers), ולכן אי אפשר לבצע עליו ריבייס. בצעו ריבייס על \`$base\` בעצמכם."
            fi
            echo "$behind commits behind $base; rebasing"
            bot_id=$(gh api "users/${BOT_SLUG}%5Bbot%5D" --jq .id)
            dir="$RUNNER_TEMP/repo"
            git clone -q --no-tags --filter=blob:none --branch "$head_ref" \
              "https://x-access-token:$GH_TOKEN@github.com/$head_repo.git" "$dir" \
              || give_up "לא ניתן היה לשכפל את הענף \`$head_ref\` לצורך ריבייס."
            cd "$dir"
            [ "$(git rev-parse HEAD)" = "$head" ] || { echo "Branch moved; a new run will follow"; exit 0; }
            git fetch -q --no-tags "https://x-access-token:$GH_TOKEN@github.com/$R.git" "$base"
            git config user.name "${BOT_SLUG}[bot]"
            git config user.email "${bot_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
            if ! git rebase -q FETCH_HEAD; then
              git rebase --abort
              give_up "יש קונפליקט מול \`$base\`, ולכן הריבייס האוטומטי נכשל."
            fi
            git push -q --force-with-lease="$head_ref:$head" origin "HEAD:$head_ref" \
              || give_up "הדחיפה אחרי הריבייס נכשלה."
            echo "Rebased and pushed; merge waits for CI on the new head"
            exit 0
          fi

          if ! gh pr merge "$PR" -R "$R" --merge --match-head-commit "$head"; then
            [ "$(gh api "repos/$R/pulls/$PR" --jq .merged)" = true ] && { echo "Already merged"; exit 0; }
            give_up "המיזוג של הקומיט \`${head:0:7}\` נדחה ב-GitHub."
          fi
          echo "Merged #$PR"
