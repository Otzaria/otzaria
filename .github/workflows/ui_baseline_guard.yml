name: UI Baseline Guard

# tool/ui_lint/baseline.json הוא החוב הקיים מול תקן הממשק
# (docs/design-system/CI_ENFORCEMENT.md §3.4, DD-23). הוא יכול רק לקטון:
# `dart tool/ui_lint_cli.dart --update-baseline` מוחק רשומות שתוקנו. PR שמוסיף
# מופע לכלל באותו קובץ ובאותו scope צריך את התווית ui-baseline, שמתחזק מוסיף.
# גם החרגת נתיב חדשה או מורחבת ב־tool/ui_lint/config.yaml משתיקה חריגות בלי
# baseline, ולכן גם היא צריכה את אותה תווית. כך גם העלאה של max_allows (תקרת
# הערות allow לכלל, §3.5; הכרעת בעל הפרויקט 10.11.2026). וגם שינוי במנגנון
# האכיפה עצמו (כללי ה־lint, מנוע ה־lint, ה־fixtures, ה־workflows של ה־guards)
# והסרת strict מכלל נעול: כל אלה מחלישים את האכיפה בלי להיראות כחוב, ולכן
# דורשים את אותה תווית.

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ui-baseline-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: ui_lint baseline growth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check baseline growth
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASELINE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ui-baseline') }}
        run: |
          set -euo pipefail
          path=tool/ui_lint/baseline.json
          # ה־PR שמכניס את ui_lint: ב־base אין baseline ואין config, ולכן אין
          # מול מה למדוד גידול. ה־baseline הראשון הוא רישום החוב (§3.4).
          if ! git cat-file -e "$BASE_SHA:$path" 2>/dev/null; then
            echo "The base has no $path: this pull request introduces the ui_lint baseline, so there is no growth to check."
            exit 0
          fi
          git show "$BASE_SHA:$path" > /tmp/base.json
          python3 - /tmp/base.json "$path" > /tmp/growth.txt <<'PY'
          import json, sys

          # Per rule, file and scope: a fingerprint change (an edited
          # expression, or a new engine version) is not growth.
          def counts(path):
              data = json.load(open(path, encoding="utf-8"))
              totals = {}
              for rule, files in data["rules"].items():
                  for file, entries in files.items():
                      for entry in entries:
                          key = (rule, file, entry["scope"])
                          totals[key] = totals.get(key, 0) + entry["n"]
              return totals

          base, head = counts(sys.argv[1]), counts(sys.argv[2])
          for key, n in sorted(head.items()):
              added = n - base.get(key, 0)
              if added > 0:
                  print(f"+{added} {key[0]} {key[1]} ({key[2]})")
          PY
          # A new or edited path exclusion silences findings without a baseline
          # entry. A changed glob shows up as an added line too.
          config=tool/ui_lint/config.yaml
          git diff --unified=0 "$BASE_SHA" HEAD -- "$config" \
            | { grep -E '^\+[[:space:]]*(-[[:space:]]*)?path:' || true; } \
            | sed -E 's/^\+[[:space:]]*(-[[:space:]]*)?/exclude /' > /tmp/excludes.txt
          # A raised max_allows cap lets more allow comments in. A rule that is
          # not listed has a cap of 0. A base without max_allows predates the
          # caps, so the pull request that introduces them is not growth.
          git show "$BASE_SHA:$config" > /tmp/base_config.yaml 2>/dev/null || : > /tmp/base_config.yaml
          python3 - /tmp/base_config.yaml "$config" > /tmp/allows.txt <<'PY'
          import re, sys

          def caps(path):
              text = open(path, encoding="utf-8").read()
              block = re.search(r"^max_allows:[ \t]*\n((?:[ \t]+.*\n?)*)", text, re.M)
              if block is None:
                  return None
              return {rule: int(n) for rule, n in re.findall(r"^[ \t]+(UIL-\d{3}):[ \t]*(\d+)", block.group(1), re.M)}

          base, head = caps(sys.argv[1]), caps(sys.argv[2])
          if base is not None:
              for rule, n in sorted((head or {}).items()):
                  if n > base.get(rule, 0):
                      print(f"max_allows {rule}: {base.get(rule, 0)} -> {n}")
          PY
          # A rule that loses strict can take new findings into the baseline
          # again. A base without the rule block predates it, so only rules
          # that were strict in the base count.
          python3 - /tmp/base_config.yaml "$config" > /tmp/unlocked.txt <<'PY'
          import re, sys

          def strict(path):
              text = open(path, encoding="utf-8").read()
              rules = set()
              for rule, body in re.findall(r"^  (UIL-\d{3}):[ \t]*\n((?:(?:    .*)?\n)*)", text, re.M):
                  if re.search(r"^    strict:[ \t]*true", body, re.M):
                      rules.add(rule)
              return rules

          for rule in sorted(strict(sys.argv[1]) - strict(sys.argv[2])):
              print(f"strict removed: {rule}")
          PY
          # The enforcement itself: the rules and the engine, the fixtures that
          # pin them, the CLI gate, and the workflows of the guards. A change
          # there can weaken what every other pull request is checked against.
          git diff --name-only "$BASE_SHA" HEAD \
            | { grep -E '^(tool/ui_lint/(rules/|ui_lint\.dart|ast_helpers\.dart)|tool/ui_lint_cli\.dart|test/design_system/(ui_lint_test\.dart|ui_lint_pending_test\.dart|fixtures/)|\.github/workflows/(ui_baseline_guard|goldens_guard|flutter_tests|pr_labels)\.yml$)' || true; } \
            > /tmp/enforcement.txt
          if [ ! -s /tmp/growth.txt ] && [ ! -s /tmp/excludes.txt ] && [ ! -s /tmp/allows.txt ] \
             && [ ! -s /tmp/unlocked.txt ] && [ ! -s /tmp/enforcement.txt ]; then
            echo "The ui_lint baseline did not grow, no path exclusion was added, no max_allows cap was raised, no rule lost strict, and the enforcement code did not change."
            exit 0
          fi
          if [ -s /tmp/growth.txt ]; then
            echo "Baseline additions:"
            cat /tmp/growth.txt
          fi
          if [ -s /tmp/excludes.txt ]; then
            echo "Path exclusions added or changed in $config:"
            cat /tmp/excludes.txt
          fi
          if [ -s /tmp/allows.txt ]; then
            echo "Allow-comment caps raised in $config:"
            cat /tmp/allows.txt
          fi
          if [ -s /tmp/unlocked.txt ]; then
            echo "Locked rules in $config:"
            cat /tmp/unlocked.txt
          fi
          if [ -s /tmp/enforcement.txt ]; then
            echo "Enforcement files changed:"
            cat /tmp/enforcement.txt
          fi
          if [ "$BASELINE_LABEL" = "true" ]; then
            echo "Baseline growth, exclusions, raised caps, unlocked rules and enforcement changes approved with the 'ui-baseline' label."
            exit 0
          fi
          if [ -s /tmp/growth.txt ]; then
            echo "::error file=$path::This pull request adds entries to the ui_lint baseline. Fix the new violations, or mark a justified one with '// ui-lint: allow UIL-xxx — reason'. If the debt is intended, ask a maintainer to add the 'ui-baseline' label."
          fi
          if [ -s /tmp/excludes.txt ]; then
            echo "::error file=$config::This pull request adds or widens a path exclusion in the ui_lint config, which silences findings without a baseline entry. Prefer '// ui-lint: allow UIL-xxx — reason' on the single node, or ask a maintainer to add the 'ui-baseline' label."
          fi
          if [ -s /tmp/allows.txt ]; then
            echo "::error file=$config::This pull request raises a max_allows cap, so more '// ui-lint: allow' comments are accepted for that rule. Fix the violation instead, or ask a maintainer to add the 'ui-baseline' label."
          fi
          if [ -s /tmp/unlocked.txt ]; then
            echo "::error file=$config::This pull request removes 'strict: true' from a locked rule, so new violations could enter the baseline again. Ask a maintainer to add the 'ui-baseline' label."
          fi
          if [ -s /tmp/enforcement.txt ]; then
            echo "::error::This pull request changes the ui_lint rules or engine, their fixtures, or the guard workflows (listed above). The checks every other pull request runs against are defined there, so a maintainer reviews the change and adds the 'ui-baseline' label."
          fi
          exit 1
