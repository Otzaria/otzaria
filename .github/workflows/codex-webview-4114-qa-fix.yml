name: Apply prewarm QA fix (temporary)
on:
  push:
    branches: [codex/webview-4114-android-prewarm]
    paths: [.github/workflows/codex-webview-4114-qa-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Otzaria/otzaria'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply the fixed preconditioned patch from the previous commit
        run: |
          python3 - <<'PY'
          import subprocess
          # Reuse only our immutable, reviewed patch text, not current branch input.
          old = subprocess.check_output(['git', 'show', 'e206c6f58e4f57d7fa0370ff896093c5e90cf0b3:.github/workflows/codex-webview-4114-qa-fix.yml'], text=True)
          start = old.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = old.index('\n          PY\n', start)
          lines = old[start:end].splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('Unexpected patch indentation')
          script = '\n'.join(line[10:] if line else '' for line in lines)
          # YAML already removed its common indentation. Applying dedent again
          # incorrectly changed the exact-match source precondition.
          for line in [
              "before = textwrap.dedent('          ' + before).lstrip()",
              "before = '    ' + before",
              "after = '    ' + textwrap.dedent('          ' + after).lstrip()",
          ]:
              if script.count(line) != 1:
                  raise SystemExit('Patch correction precondition failed')
              script = script.replace(line, '', 1)
          exec(compile(script, '<guarded-prewarm-patch>', 'exec'))
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Format only the holder and its new tests
        run: dart format lib/plugins/view/webview_environment_holder.dart test/plugins/view/webview_android_prewarm_test.dart
      - name: Commit reviewed edits on the same branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib/main.dart lib/plugins/view/plugin_tab_page.dart lib/plugins/view/webview_environment_holder.dart test/plugins/view/webview_android_prewarm_test.dart
          git commit -m 'fix(webview): gate Android creation during prewarm eligibility checks'
          git push origin HEAD:refs/heads/codex/webview-4114-android-prewarm
