name: Apply shared prewarm timeout (temporary)
on:
  push:
    branches: [codex/webview-4114-android-prewarm]
    paths: [.github/workflows/codex-webview-4114-shared-wait.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Otzaria/otzaria'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Apply guarded shared-wait change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def one(text, before, after):
              if text.count(before) != 1:
                  raise SystemExit('Replacement is not unique: ' + before[:80])
              return text.replace(before, after, 1)
          name = 'lib/plugins/view/webview_environment_holder.dart'
          if subprocess.check_output(['git', 'hash-object', name], text=True).strip() != '54cf46081691ecce95478e9142a350cdd1676afa':
              raise SystemExit('Holder changed concurrently')
          source = Path(name).read_text(encoding='utf-8')
          source = one(source, '  static Future<void>? _prewarmInFlight;\n', '  static Future<void>? _prewarmInFlight;\n  static Future<void>? _waitedPrewarm;\n  static Future<void>? _prewarmWait;\n')
          before = '  static Future<void> _awaitPrewarm() async {\n    final prewarm = _prewarmInFlight;\n    if (prewarm == null) return;\n'
          after = '''  static Future<void> _awaitPrewarm() {
              final prewarm = _prewarmInFlight;
              if (prewarm == null) return Future<void>.value();
              // Every consumer of this operation shares the same bounded wait.
              // A later consumer must not keep waiting after the first timeout.
              if (identical(_waitedPrewarm, prewarm)) return _prewarmWait!;
              _waitedPrewarm = prewarm;
              return _prewarmWait = _waitForPrewarm(prewarm);
            }

            static Future<void> _waitForPrewarm(Future<void> prewarm) async {
          '''
          source = one(source, before, after)
          Path(name).write_text(source, encoding='utf-8')
          name = 'test/plugins/view/webview_android_prewarm_test.dart'
          source = Path(name).read_text(encoding='utf-8')
          source = one(source, "import 'dart:async';\n", "import 'dart:async';\nimport 'package:fake_async/fake_async.dart';\n")
          tests = '''
            test('a timeout releases an existing late consumer too', () {
              fakeAsync((time) {
                pending = Completer<WebViewEnvironmentPrewarmResult?>();
                startPrewarm();
                time.flushMicrotasks();
                var firstReady = false;
                var secondReady = false;
                try {
                  WebViewEnvironmentHolder.initialize().then((_) => firstReady = true);
                  time.flushMicrotasks();
                  time.elapse(const Duration(seconds: 29));
                  WebViewEnvironmentHolder.initialize().then((_) => secondReady = true);
                  time.flushMicrotasks();
                  expect(firstReady, false);
                  expect(secondReady, false);
                  time.elapse(const Duration(seconds: 1));
                  time.flushMicrotasks();
                  expect(firstReady, true);
                  expect(secondReady, true);
                } finally {
                  if (!pending!.isCompleted) pending!.complete(_ok);
                  time.flushMicrotasks();
                }
              });
            });

            test('the supported platform set is explicit', () {
              for (final platform in TargetPlatform.values) {
                debugDefaultTargetPlatformOverride = platform;
                WebViewEnvironmentHolder.debugIsWindowsOverride = platform == TargetPlatform.windows;
                expect(WebViewEnvironmentHolder.supportsPrewarm,
                  platform == TargetPlatform.windows || platform == TargetPlatform.android,
                  reason: platform.name);
              }
            });
          '''
          source = one(source, "  test('no enabled plugin means no Android startup work', () async {", tests + "\n  test('no enabled plugin means no Android startup work', () async {")
          Path(name).write_text(source, encoding='utf-8')
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Format modified files
        run: dart format lib/plugins/view/webview_environment_holder.dart test/plugins/view/webview_android_prewarm_test.dart test/core/webview_prewarm_startup_order_test.dart
      - name: Commit only the shared wait and tests
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib/plugins/view/webview_environment_holder.dart test/plugins/view/webview_android_prewarm_test.dart test/core/webview_prewarm_startup_order_test.dart
          git commit -m 'fix(webview): share prewarm timeout completion across all consumers'
          git push origin HEAD:refs/heads/codex/webview-4114-android-prewarm
