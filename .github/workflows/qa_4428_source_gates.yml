name: QA 4428 canonical Android source and merge gates
on:
  push:
    branches: ['y-ploni/qa-4428-canonical-source-20261107-a']
permissions:
  contents: read
jobs:
  source-hook:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      BOT: 'true'
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native test hook prerequisite
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Exact source, original hook and Store-enabled controls
        env:
          QA_EVIDENCE_DIR: ${{ runner.temp }}/qa-4428-source-hook
        run: python3 tool/perf_probe/qa_4428_source_gates.py hook
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: qa-4428-source-hook-${{ github.sha }}
          path: ${{ runner.temp }}/qa-4428-source-hook
          if-no-files-found: error
  merge-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fresh full PR map and actual merge stage and hunk proofs
        env:
          QA_EVIDENCE_DIR: ${{ runner.temp }}/qa-4428-merge
          QA_GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tool/perf_probe/qa_4428_source_gates.py merge
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: qa-4428-merge-${{ github.sha }}
          path: ${{ runner.temp }}/qa-4428-merge
          if-no-files-found: error
