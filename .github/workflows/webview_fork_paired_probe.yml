name: WebView fork pinned A/B on one Windows runner

# Exploratory only: same machine, same synthetic fixture, ABBA order.
# Compare a known old pin with the upgrade under review. This workflow
# never changes a product default or converts missing metrics into zero.
on:
  pull_request:
    paths:
      - '.github/workflows/webview_fork_paired_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webview-paired-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired-windows:
    name: ABBA native WebView2 / Windows profile
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      BOT: 'true'
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      AB_OLD_COMMIT: ea1f00d20edb723d69cd099c95e5db4304b9394b
      AB_OLD_PIN: ab6953a7d69016bcfcd6d47c301ded0d2a6d5400
      AB_NEW_PIN: ca04f1e7139f03e39577d940aa0fd33b2e59b664
      AB_OUT: ${{ github.workspace }}/build/webview-paired-probe
      FLUTTER_INAPPWEBVIEW_WINDOWS_FORCE_HWND: '0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'

      - name: Create baseline only from its exact approved Git commit
        run: |
          $ErrorActionPreference='Stop'
          git config --global core.longpaths true
          New-Item -ItemType Directory -Force $env:AB_OUT | Out-Null
          $base = Join-Path $env:RUNNER_TEMP "webview-ab-baseline-$env:GITHUB_RUN_ID"
          if (Test-Path -LiteralPath $base) { throw 'Refusing to overwrite pre-existing baseline' }
          git cat-file -e "$env:AB_OLD_COMMIT^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'The original pinned app commit is missing' }
          git worktree add --detach "$base" "$env:AB_OLD_COMMIT"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create isolated baseline' }
          "AB_BASE_DIR=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git rev-parse HEAD | Out-File (Join-Path $env:AB_OUT 'candidate-head.txt') -Encoding utf8
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber |
            ConvertTo-Json | Out-File (Join-Path $env:AB_OUT 'windows.json') -Encoding utf8
          Get-CimInstance Win32_VideoController | Select-Object Name,DriverVersion,AdapterRAM |
            ConvertTo-Json | Out-File (Join-Path $env:AB_OUT 'gpu-adapter-metadata.json') -Encoding utf8
          flutter --version --machine | Out-File (Join-Path $env:AB_OUT 'flutter.json') -Encoding utf8

      - name: Verify identical probe workloads and isolated source pins
        run: |
          $ErrorActionPreference='Stop'
          foreach ($path in @('integration_test/webview_resource_probe_test.dart',
              'integration_test/support/webview_probe_fixture.dart',
              'integration_test/support/webview_probe_metrics.dart',
              'integration_test/support/webview_probe_window.dart',
              'test_driver/webview_resource_probe.dart')) {
            $old = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:AB_BASE_DIR $path)).Hash
            $new = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash
            if ($old -ne $new) { throw "Cannot compare different workload source: $path" }
          }
          foreach ($entry in @(@{root=$env:AB_BASE_DIR;pin=$env:AB_OLD_PIN},
                               @{root=$env:GITHUB_WORKSPACE;pin=$env:AB_NEW_PIN})) {
            $lock = Get-Content -LiteralPath (Join-Path $entry.root 'pubspec.lock') -Raw
            $manifest = Get-Content -LiteralPath (Join-Path $entry.root 'pubspec.yaml') -Raw
            if (([regex]::Matches($lock,[regex]::Escape($entry.pin))).Count -ne 16 -or
                ([regex]::Matches($manifest,[regex]::Escape($entry.pin))).Count -ne 7) {
              throw 'Each of the eight WebView packages must resolve to the expected pin'
            }
            Push-Location $entry.root
            try {
              if (git status --porcelain --untracked-files=no) { throw 'Tracked source is dirty' }
              flutter pub get --enforce-lockfile
              if ($LASTEXITCODE -ne 0) { throw 'Strict dependency resolution failed' }
              $modified = @(git status --porcelain --untracked-files=no)
              if ($modified.Count -gt 0) {
                $label = if ($entry.pin -eq $env:AB_OLD_PIN) { 'baseline' } else { 'candidate' }
                $modified | Out-File -LiteralPath (Join-Path $env:AB_OUT "$label-after-pub-status.txt") -Encoding utf8
                git diff --name-status | Out-File -LiteralPath (Join-Path $env:AB_OUT "$label-after-pub-files.txt") -Encoding utf8
                throw "Dependency resolution changed tracked source in $label (see uploaded status)"
              }
            } finally { Pop-Location }
          }

      - name: Warm builds without using the output as performance evidence
        run: |
          $ErrorActionPreference='Stop'
          foreach ($label in @('baseline','candidate')) {
            $source = if ($label -eq 'baseline') { $env:AB_BASE_DIR } else { $env:GITHUB_WORKSPACE }
            Push-Location $source
            try {
              flutter build windows --profile --no-pub --target=integration_test/webview_resource_probe_test.dart
              if ($LASTEXITCODE -ne 0) { throw "Profile build failed: $label" }
            } finally { Pop-Location }
          }

      - name: Collect four fresh ABBA native executions
        timeout-minutes: 85
        run: |
          $ErrorActionPreference='Stop'
          $modes = @('baseline','candidate','candidate','baseline')
          for ($index=0; $index -lt $modes.Count; $index++) {
            $label = $modes[$index]
            $trial = ('{0:D2}-{1}' -f ($index + 1), $label)
            $source = if ($label -eq 'baseline') { $env:AB_BASE_DIR } else { $env:GITHUB_WORKSPACE }
            $commit = (git -C $source rev-parse HEAD).Trim()
            $root = Join-Path $env:AB_OUT $trial
            if (Test-Path $root) { throw "Duplicate trial output $trial" }
            New-Item -ItemType Directory -Force $root | Out-Null
            $env:WEBVIEW_PROBE_REPORTS = Join-Path $root 'host'
            $env:WEBVIEW_PROBE_DEVICE_OUTPUT = Join-Path $root 'device'
            $existing = @(Get-Process -Name otzaria -ErrorAction SilentlyContinue)
            foreach ($process in $existing) { $process.Dispose() }
            if ($existing.Count -gt 0) { throw "An unrelated or leftover Otzaria process exists before $trial" }
            Push-Location $source
            try {
              flutter drive --profile -d windows --no-pub `
                --driver=test_driver/webview_resource_probe.dart `
                --target=integration_test/webview_resource_probe_test.dart `
                "--dart-define=WEBVIEW_PROBE_COMMIT=$commit" `
                --dart-define=WEBVIEW_PROBE_FLUTTER_VERSION=3.47.7 `
                --dart-define=WEBVIEW_PROBE_TABS=3 `
                --dart-define=WEBVIEW_PROBE_IDLE_MS=3000 `
                2>&1 | Tee-Object -FilePath (Join-Path $root 'drive.log')
              if ($LASTEXITCODE -ne 0) { throw "Native WebView workload failed: $trial" }
            } finally { Pop-Location }
            Start-Sleep -Seconds 5
          }

      - name: Verify each native report and write descriptive comparisons
        run: |
          $ErrorActionPreference='Stop'
          python tool/perf_probe/compare_webview_fork_ab.py --root "$env:AB_OUT" `
            --baseline "$env:AB_OLD_COMMIT" --candidate (git rev-parse HEAD) `
            2>&1 | Tee-Object -FilePath (Join-Path $env:AB_OUT 'validation.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve all native reports and failures without claiming savings
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: paired-webview-fork-windows-profile
          if-no-files-found: warn
          retention-days: 14
          path: ${{ env.AB_OUT }}/
