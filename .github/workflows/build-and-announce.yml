name: "Build, Release and Announce"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build Windows artifacts
        type: boolean
        default: true
      build_windows_arm64:
        description: Build Windows ARM64 artifacts
        type: boolean
        default: true
      build_linux:
        description: Build Linux artifacts
        type: boolean
        default: true
      build_android:
        description: Build Android artifacts
        type: boolean
        default: true
      build_macos:
        description: Build macOS artifacts
        type: boolean
        default: true
      create_release:
        description: Create a GitHub release
        type: boolean
        default: true
      announce_release:
        description: Publish the forum post and Yemot notification
        type: boolean
        default: true

  # טריגר לפרסום בלבד. published נשלח גם על prerelease —
  # הוספת prereleased לרשימה גורמת להרצה כפולה (שני פוסטים בפורום)
  release:
    types: [published]

jobs:
  check_version:
    if: github.event_name != 'release' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      is_version: ${{ steps.check.outputs.is_version }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Check if commit message is a version tag
        id: check
        run: |
          COMMIT_MESSAGE='${{ github.event.head_commit.message }}'
          if [ -z "$COMMIT_MESSAGE" ]; then
            COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          fi
          COMMIT_MESSAGE=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "Commit message: $COMMIT_MESSAGE"
          if printf '%s' "$COMMIT_MESSAGE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_version=false" >> "$GITHUB_OUTPUT"
          fi

  build_windows:
    if: github.event_name != 'release' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_windows)
    runs-on: windows-2022
    env:
      # VC++ Redistributable מקובע ב-URL ישיר של מיקרוסופט (לא aka.ms שזז),
      # עם אימות SHA-256 אחרי ההורדה. VC_REDIST_MIN_VERSION הוא *רף תחתון*:
      # ה-runner של GitHub מגיע לרוב עם MSVC חדש מכל redist ציבורי, אז /install
      # מחזיר 1638 (no-op) ו-System32 נשארת עם גרסת הראנר — לכן דורשים
      # System32 >= MIN ולא שוויון, אחרת כל עדכון runner image שובר בנייה.
      # לעדכון: לפתור aka.ms/vc14/vc_redist.x64.exe, ולהעתיק URL סופי, SHA-256
      # (מופיע בנתיב), והגרסה (Get-Item ...VersionInfo.FileVersionRaw).
      VC_REDIST_URL: 'https://download.visualstudio.microsoft.com/download/pr/ebdab8e5-1d7b-4d9f-a11b-cbb1720c3b12/843068991DAAA1F73AD9F6239BCE4D0F6A07A51F18C37EA2A867E9BECA71295C/VC_redist.x64.exe'
      VC_REDIST_SHA256: '843068991DAAA1F73AD9F6239BCE4D0F6A07A51F18C37EA2A867E9BECA71295C'
      VC_REDIST_MIN_VERSION: '14.51.36247.0'
    # env:
    #   RUSTUP_HOME: ${{ github.workspace }}\.rustup
    #   CARGO_HOME:  ${{ github.workspace }}\.cargo
    steps:
      - name: Clone repository
        uses: actions/checkout@v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Create Google Calendar Credentials
        shell: pwsh
        run: |
          $clientId = '${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}'
          $clientSecret = '${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}'
          if ([string]::IsNullOrWhiteSpace($clientId) -or [string]::IsNullOrWhiteSpace($clientSecret)) {
            throw "Google Calendar secrets are missing. Please set GOOGLE_CALENDAR_CLIENT_ID and GOOGLE_CALENDAR_CLIENT_SECRET."
          }
          $credentialsContent = @"
          class GoogleCalendarCredentials {
            static const String clientId = '$clientId';
            static const String clientSecret = '$clientSecret';
          }
          "@
          $credentialsContent | Out-File -FilePath "lib/tools/calendar/services/google_calendar_credentials.dart" -Encoding UTF8
          Write-Host "Google Calendar credentials file created"

      # - name: Install Rust (stable)
      #   uses: dtolnay/rust-toolchain@stable

      # - name: Cache cargo registry and git
      #   uses: actions/cache@v4.2.3
      #   with:
      #     path: |
      #       ${{ env.CARGO_HOME }}\registry
      #       ${{ env.CARGO_HOME }}\git
      #     key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      #     restore-keys: |
      #       ${{ runner.os }}-cargo-

      # - name: Add cargo to PATH & verify toolchain
      #   shell: pwsh
      #   run: |
      #     "$env:CARGO_HOME\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      #     rustc -Vv
      #     cargo -V
      #     rustup show

      - name: Install Inno Setup (project script + fallback)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path .\installer\install_inno_setup.ps1) {
            Write-Host "Running local installer script..."
            .\installer\install_inno_setup.ps1
          } else {
            Write-Host "Local installer script not found, skipping."
          }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              Write-Host "Installing Inno Setup via winget..."
              winget install -e --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements
            } else {
              Write-Host "winget not found, installing via Chocolatey..."
              choco install innosetup -y --no-progress
            }
          }
          $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName)
          if (-not $iscc) { throw "ISCC.exe not found after installation" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "ISCC resolved to: $iscc"

      - name: Prepare Flutter dependencies for Windows release
        shell: pwsh
        run: |
          flutter pub get
          # Generate the settings .g.dart files: search index + translation catalog.
          dart run tool/generate_search_index.dart
          dart run tool/generate_settings_l10n.dart

      - name: Bundle latest VC++ Redistributable runtime DLLs (app-local)
        shell: pwsh
        run: |
          # מטרה: לארוז את ה-DLLs של MSVC runtime (MSVCP140 וחבריו) ליד
          # otzaria.exe כך שיינטענו ע"י סדר חיפוש ה-DLL של ויינדוס במקום
          # הגרסה שמותקנת ב-System32 אצל המשתמש. רקע: גרסה ספציפית של
          # MSVCP140.dll (14.36.32532.0 שהגיעה עם VS 2022 17.6, יוני 2023)
          # מכילה NULL-deref ב-+0x12f58 שמקריס כל std::string concat
          # בקוד החם של flutter_inappwebview, ובלי שדרוג מבחוץ הוא נשאר
          # תקוע במכונת המשתמש. בנדול app-local פותר את זה לכל מסלולי
          # ההפצה (regular installer, full installer, ו-portable ZIP) —
          # אף אחד מהם כבר לא מריץ vc_redist.x64.exe בהתקנה
          # (גם FULL הוסר אחרי שהוכח שה-bundling app-local מספיק).
          #
          # הגרסה מקובעת ב-env (VC_REDIST_URL + VC_REDIST_SHA256 + VC_REDIST_MIN_VERSION)
          # ולא מוורדת מ-aka.ms הזז, כך שאותו vc_redist.x64.exe יורד בכל
          # בנייה. אחרי ההורדה מתבצע אימות SHA-256. מתקינים אותו על ה-runner
          # (שהוא VM זמני) ואז מעתיקים את ה-DLLs מ-System32 ל-installer\vcredist\x64.
          # ה-install(DIRECTORY) ב-CMakeLists קולט אותם משם וממקם ליד otzaria.exe
          # בתיקיית Release; כל מסלולי ההפצה אחר כך מורידים מאותה Release\*.
          #
          # windows-2022 מגיעה עם VC Redist חדש מכל redist ציבורי, אז /install
          # מחזיר 1638 (no-op) ו-System32 נשארת עם גרסת הראנר. לכן לא דורשים
          # שוויון אלא רף תחתון: System32 >= VC_REDIST_MIN_VERSION. ה-DLLs
          # שמועתקים הם של הראנר (>= הרף), וזה בטוח.
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "installer\vc_redist.x64.exe")) {
            Write-Host "Downloading pinned vc_redist.x64.exe ($env:VC_REDIST_URL)..."
            Invoke-WebRequest -Uri $env:VC_REDIST_URL -OutFile "installer\vc_redist.x64.exe"
          } else {
            Write-Host "vc_redist.x64.exe already present, reusing"
          }
          $actualHash = (Get-FileHash "installer\vc_redist.x64.exe" -Algorithm SHA256).Hash
          if ($actualHash -ne $env:VC_REDIST_SHA256) {
            throw "vc_redist.x64.exe SHA-256 mismatch — expected $env:VC_REDIST_SHA256 but got $actualHash"
          }
          Write-Host "vc_redist.x64.exe SHA-256 verified: $actualHash"
          Write-Host "Installing vc_redist.x64.exe on the runner..."
          $proc = Start-Process -FilePath "installer\vc_redist.x64.exe" `
            -ArgumentList '/install','/quiet','/norestart' -Wait -PassThru
          # exit codes: 0=success, 1638=newer-version-already-installed, 3010=ok-needs-reboot
          if ($proc.ExitCode -notin @(0, 1638, 3010)) {
            throw "vc_redist.x64.exe install failed with exit code $($proc.ExitCode)"
          }
          Write-Host "vc_redist exit code: $($proc.ExitCode)"
          # רף תחתון: ודא ש-System32 לא ישן מ-VC_REDIST_MIN_VERSION. אם זה
          # נכשל — או שה-/install נכשל בשקט, או שה-runner image ישן באופן
          # בלתי צפוי — ואז עוצרים במקום לשלוח DLLs מתחת לרף.
          $msvcpPath = Join-Path $env:SystemRoot 'System32\msvcp140.dll'
          if (-not (Test-Path $msvcpPath)) {
            throw "msvcp140.dll missing from $msvcpPath after vc_redist install — something is wrong with the runner image"
          }
          $actualMsvcpVersion = (Get-Item $msvcpPath).VersionInfo.FileVersionRaw
          if ($actualMsvcpVersion -lt [version]$env:VC_REDIST_MIN_VERSION) {
            $msg = @(
              'VC++ runtime on runner is OLDER than the pinned minimum.',
              "  System32\msvcp140.dll:          $actualMsvcpVersion",
              "  required VC_REDIST_MIN_VERSION:  $env:VC_REDIST_MIN_VERSION",
              '',
              'The pinned vc_redist.x64.exe should have raised System32 to at least',
              'this version. If this fires, the download/install step likely failed,',
              'or the runner image is unexpectedly old.',
              '',
              'To raise the floor: resolve aka.ms/vc14/vc_redist.x64.exe, then update',
              'VC_REDIST_URL / VC_REDIST_SHA256 / VC_REDIST_MIN_VERSION together.'
            ) -join "`n"
            throw $msg
          }
          Write-Host "System32 msvcp140.dll ($actualMsvcpVersion) meets minimum $env:VC_REDIST_MIN_VERSION"
          $destDir = "installer\vcredist\x64"
          New-Item -ItemType Directory -Path $destDir -Force | Out-Null
          $dlls = @(
            'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll',
            'msvcp140_atomic_wait.dll', 'msvcp140_codecvt_ids.dll',
            'vcruntime140.dll', 'vcruntime140_1.dll', 'vcruntime140_threads.dll',
            'concrt140.dll', 'vccorlib140.dll'
          )
          foreach ($d in $dlls) {
            $src = Join-Path $env:SystemRoot "System32\$d"
            if (Test-Path $src) {
              Copy-Item -Path $src -Destination (Join-Path $destDir $d) -Force
              $ver = (Get-Item $src).VersionInfo.FileVersion
              Write-Host "  copied $d (v$ver)"
            } else {
              Write-Host "::warning::$d not found in System32 — skipping"
            }
          }
          Write-Host "VC++ runtime DLLs staged in $destDir"

      - name: Build Flutter Windows app
        shell: pwsh
        env:
          # מאלץ את MSBuild לקמפל קבצי C++ במקביל גם בתוך אותו פרויקט
          # (ברירת המחדל מקבילה רק בין פרויקטים, וב-Flutter Windows יש רק אחד)
          UseMultiToolTask: 'true'
          EnforceProcessCountAcrossBuilds: 'true'
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          flutter build windows --release --verbose

      - name: Zip Windows build
        shell: pwsh
        run: |
          $relDir = Get-ChildItem -Directory build\windows |
                    Where-Object { Test-Path "$($_.FullName)\runner\Release" } |
                    Select-Object -First 1 -ExpandProperty FullName
          if (-not $relDir) { throw 'Release directory not found' }
          Compress-Archive -Path "$relDir\runner\Release\*" -DestinationPath otzaria-windows.zip
          # portable.marker הופך את ה-ZIP לנייד באמת: כל הנתונים נשמרים
          # בתיקיית otzaria_data ליד ה-EXE (ראה lib/core/app_paths.dart →
          # isPortable). ה-marker מתווסף ל-ZIP בלבד ולא לתיקיית Release —
          # המתקינים (regular/full) נבנים מאותה תיקייה בהמשך ואסור
          # שההתקנות הרגילות יהפכו לניידות.
          $marker = Join-Path $env:RUNNER_TEMP 'portable.marker'
          New-Item -ItemType File -Path $marker -Force | Out-Null
          Compress-Archive -Path $marker -Update -DestinationPath otzaria-windows.zip

      - name: Check if commit message is a version tag
        id: check_version
        shell: pwsh
        run: |
          $commitMessage = "${{ github.event.head_commit.message }}"
          if ([string]::IsNullOrWhiteSpace($commitMessage)) {
            Write-Host "Commit message not available in event payload; using checked-out HEAD commit message instead"
            $commitMessage = git log -1 --pretty=%B
          }
          $commitMessage = $commitMessage.Split([Environment]::NewLine)[0].Trim()
          Write-Host "Commit message: $commitMessage"
          
          # בדיקה אם ההודעה היא גרסה במבנה X.Y.Z (מספרים בלבד עם נקודות)
          if ($commitMessage -match '^\d+\.\d+\.\d+$') {
            Write-Host "✓ Commit message is a version tag: $commitMessage"
            echo "is_version=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "✗ Commit message is not a version tag"
            echo "is_version=false" >> $env:GITHUB_OUTPUT
          }

      - name: Download library assets for full installer
        if: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "Downloading bundled library assets for full installer..."
          $ErrorActionPreference = "Stop"
          # אימות מונע רייט-לימיט של api.github.com (ה-IP של ה-runner משותף עם משתמשים אחרים)
          $apiHeaders = @{ Authorization = "Bearer $env:GH_TOKEN" }

          try {
            # הורדת מסד הספרייה הראשי
            $latestRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/Otzaria/SeforimLibrary/releases/latest" -Headers $apiHeaders
            $dbAsset = $latestRelease.assets | Where-Object { $_.name -eq "seforim.db.zst" }
            
            if (-not $dbAsset) {
              Write-Host "::error::Could not find seforim.db.zst in latest release"
              exit 1
            }
            
            Write-Host "Library version: $($latestRelease.tag_name)"
            Write-Host "Downloading from: $($dbAsset.browser_download_url)"
            Write-Host "Size: $([math]::Round($dbAsset.size / 1MB, 2)) MB"
            
            if (Test-Path "installer\library_db") {
              Remove-Item -Path "installer\library_db" -Recurse -Force
            }
            New-Item -ItemType Directory -Path "installer\library_db" -Force | Out-Null

            # הורדת ה-DB הדחוס שה-installer יחלץ בזמן ההתקנה
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest -Uri $dbAsset.browser_download_url -OutFile "installer\library_db\seforim.db.zst" -UseBasicParsing
            Write-Host "Compressed library DB downloaded successfully"

            # הורדת מסד הקטלוגים החיצוני
            Write-Host "Downloading external catalog DB for full installer from Otzaria/otzar-HB_catalog..."
            $catalogRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/Otzaria/otzar-HB_catalog/releases/latest" -Headers $apiHeaders
            $catalogAsset = $catalogRelease.assets | Where-Object { $_.name -eq "otzar-HB_catalog.db.zst" }

            if (-not $catalogAsset) {
              Write-Host "::error::Could not find otzar-HB_catalog.db.zst in latest release"
              exit 1
            }

            Write-Host "Catalog version: $($catalogRelease.tag_name)"
            Write-Host "Downloading from: $($catalogAsset.browser_download_url)"
            Write-Host "Size: $([math]::Round($catalogAsset.size / 1MB, 2)) MB"
            Invoke-WebRequest -Uri $catalogAsset.browser_download_url -OutFile "installer\library_db\otzar-HB_catalog.db.zst" -UseBasicParsing
            Write-Host "Compressed external catalog DB downloaded successfully"

            # הורדת ארכיון ה-PDFים של תלמוד בבלי
            $talmudArchiveUrl = "https://github.com/Otzaria/otzaria-library/releases/latest/download/talmud_bavli_latest.tar.zst"
            Write-Host "Downloading bundled Talmud Bavli PDFs for full installer..."
            Write-Host "Downloading from: $talmudArchiveUrl"
            Invoke-WebRequest -Uri $talmudArchiveUrl -OutFile "installer\library_db\talmud_bavli_latest.tar.zst" -UseBasicParsing
            Write-Host "Compressed Talmud Bavli PDFs downloaded successfully"

            # הורדת כלי החילוץ כדי שה-installer יוכל לחלץ את קבצי הספרייה בזמן ההתקנה
            $zstdRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/facebook/zstd/releases/latest" -Headers $apiHeaders
            $zstdAsset = $zstdRelease.assets | Where-Object { $_.name -like "zstd-*-win64.zip" } | Select-Object -First 1
            $sevenZipRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/ip7z/7zip/releases/latest" -Headers $apiHeaders
            $sevenZipBootstrap = $sevenZipRelease.assets | Where-Object { $_.name -eq "7zr.exe" } | Select-Object -First 1
            $sevenZipExtra = $sevenZipRelease.assets | Where-Object { $_.name -like "7z*-extra.7z" } | Select-Object -First 1

            if (-not $zstdAsset) {
              Write-Host "::error::Could not find win64 zstd asset in latest release"
              exit 1
            }

            if ((-not $sevenZipBootstrap) -or (-not $sevenZipExtra)) {
              Write-Host "::error::Could not find 7-Zip bootstrap assets in latest release"
              exit 1
            }

            Write-Host "Downloading zstd from: $($zstdAsset.browser_download_url)"
            Invoke-WebRequest -Uri $zstdAsset.browser_download_url -OutFile "installer\zstd-win64.zip" -UseBasicParsing

            if (Test-Path "installer\zstd_tmp") {
              Remove-Item -Path "installer\zstd_tmp" -Recurse -Force
            }
            Expand-Archive -Path "installer\zstd-win64.zip" -DestinationPath "installer\zstd_tmp" -Force

            $zstdExe = Get-ChildItem -Path "installer\zstd_tmp" -Filter "zstd.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
            if (-not $zstdExe) {
              Write-Host "::error::zstd.exe was not found inside downloaded archive"
              exit 1
            }

            Copy-Item -Path $zstdExe -Destination "installer\zstd.exe" -Force

            Write-Host "Downloading 7zr from: $($sevenZipBootstrap.browser_download_url)"
            Invoke-WebRequest -Uri $sevenZipBootstrap.browser_download_url -OutFile "installer\7zr.exe" -UseBasicParsing
            Write-Host "Downloading 7-Zip extra package from: $($sevenZipExtra.browser_download_url)"
            Invoke-WebRequest -Uri $sevenZipExtra.browser_download_url -OutFile "installer\7zip-extra.7z" -UseBasicParsing

            if (Test-Path "installer\7zip_tmp") {
              Remove-Item -Path "installer\7zip_tmp" -Recurse -Force
            }

            & "installer\7zr.exe" x "installer\7zip-extra.7z" "-oinstaller\7zip_tmp" -y
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Failed to extract 7-Zip extra package"
              exit 1
            }

            $sevenZipExe = Get-ChildItem -Path "installer\7zip_tmp" -Filter "7za.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
            if (-not $sevenZipExe) {
              Write-Host "::error::7za.exe was not found inside 7-Zip extra package"
              exit 1
            }

            Copy-Item -Path $sevenZipExe -Destination "installer\7za.exe" -Force
            Remove-Item -Path "installer\zstd-win64.zip" -Force
            Remove-Item -Path "installer\zstd_tmp" -Recurse -Force
            Remove-Item -Path "installer\7zip-extra.7z" -Force
            Remove-Item -Path "installer\7zip_tmp" -Recurse -Force
            Remove-Item -Path "installer\7zr.exe" -Force
            Write-Host "zstd.exe and 7za.exe prepared successfully"

            # מילון המורפולוגיה (lexical.db) של החיפוש המקורב. ב-release הוא אינו
            # דחוס, לכן דוחסים כאן עם zstd שכבר הוכן, כדי שה-installer יחלץ אותו
            # כמו שאר מסדי הנתונים.
            Write-Host "Downloading morphology dictionary (lexical.db) from Otzaria/SeforimMagicIndexer..."
            Invoke-WebRequest -Uri "https://github.com/Otzaria/SeforimMagicIndexer/releases/latest/download/lexical.db" -OutFile "installer\library_db\lexical.db" -UseBasicParsing
            & "installer\zstd.exe" -19 --long=31 -T0 -f "installer\library_db\lexical.db" -o "installer\library_db\lexical.db.zst"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Failed to compress lexical.db"
              exit 1
            }
            Remove-Item -Path "installer\library_db\lexical.db" -Force
            Write-Host "Morphology dictionary compressed successfully"
          }
          catch {
            Write-Host "::error::Failed to download library: $_"
            exit 1
          }

      - name: Download dependencies for full installer
        if: true
        shell: pwsh
        run: |
          # הערה: vc_redist.x64.exe כבר לא נדרש למתקין FULL — ה-DLLs נארזים
          # app-local ע"י השלב "Bundle latest VC++ Redistributable runtime DLLs"
          # שרץ קודם, וה-Source ב-otzaria_full.iss הוסר. השלב הזה מוריד רק
          # את WebView2 bootstrapper.
          Write-Host "Downloading WebView2 Bootstrapper (Microsoft)..."
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "installer\MicrosoftEdgeWebview2Setup.exe"
          $size = [math]::Round((Get-Item "installer\MicrosoftEdgeWebview2Setup.exe").Length / 1MB, 2)
          Write-Host "MicrosoftEdgeWebview2Setup.exe downloaded successfully ($size MB)"

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          Write-Host "Building FULL installer with library and VC++ Redistributable..."
          & "$env:ISCC" installer\otzaria_full.iss
          if ($LASTEXITCODE -ne 0) {
            throw "FULL installer build failed"
          }

          New-Item -ItemType Directory -Path indexed-installer-tools -Force | Out-Null
          Copy-Item installer\zstd.exe indexed-installer-tools\zstd.exe -Force
          Copy-Item installer\7za.exe indexed-installer-tools\7za.exe -Force

          # ניקוי קבצי הספרייה והחולץ לאחר בניית ה-FULL installer
          Write-Host "Cleaning up bundled DB assets to free disk space..."
          if (Test-Path "installer\library_db") {
            Remove-Item -Path "installer\library_db" -Recurse -Force
          }
          if (Test-Path "installer\zstd.exe") {
            Remove-Item -Path "installer\zstd.exe" -Force
          }
          if (Test-Path "installer\7za.exe") {
            Remove-Item -Path "installer\7za.exe" -Force
          }
          if (Test-Path "installer\zstd_tmp") {
            Remove-Item -Path "installer\zstd_tmp" -Recurse -Force
          }
          if (Test-Path "installer\zstd-win64.zip") {
            Remove-Item -Path "installer\zstd-win64.zip" -Force
          }
          if (Test-Path "installer\7zip_tmp") {
            Remove-Item -Path "installer\7zip_tmp" -Recurse -Force
          }
          if (Test-Path "installer\7zip-extra.7z") {
            Remove-Item -Path "installer\7zip-extra.7z" -Force
          }
          if (Test-Path "installer\7zr.exe") {
            Remove-Item -Path "installer\7zr.exe" -Force
          }
          Write-Host "Bundled DB assets cleaned up successfully"
          
          Write-Host "Building REGULAR installer (without VC++ Redistributable)..."
          & "$env:ISCC" installer\otzaria.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Regular installer build failed"
          }

      - name: Upload Windows installer (regular)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-windows-installer
          path: installer/otzaria-*-windows.exe

      - name: Upload Windows installer (full)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-windows-installer-full
          path: installer/otzaria-*-windows-full.exe

      - name: Upload Windows indexed installer tools
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-windows-indexed-installer-tools
          path: indexed-installer-tools/*

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-windows-zip
          path: otzaria-windows.zip

  # בניית Windows ARM64 נייטיבית — הפתרון לתוספים המתים באמולציית x64 על
  # מכשירי Snapdragon (issue #1014): WebView2 מסרב ליצור controller במסלול
  # הקומפוזיציה תחת אמולציה. חייבת לרוץ על רץ ARM — ל-Flutter אין
  # קרוס-קומפילציה של Windows. בכוונה רזה מה-job של x64: מתקין רגיל ו-ZIP
  # נייד בלבד, בלי מתקין FULL (יתווסף בהמשך לפי ביקוש).
  build_windows_arm64:
    if: github.event_name != 'release' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_windows_arm64)
    runs-on: windows-11-arm
    steps:
      - name: Clone repository
        uses: actions/checkout@v4.2.2

      # אין חבילת SDK רשמית של Flutter ל-Windows-ARM במניפסט של flutter-action —
      # מתקינים מ-git באותו תג, כמו בלינוקס-ARM. ה-bootstrap מוריד Dart SDK
      # נייטיבי ל-arm64, וזה קריטי: הכלי קובע את ארכיטקטורת היעד לפי
      # Abi.current() של תהליך ה-Dart, כך ש-SDK של x64 באמולציה בונה x64.
      - name: Set up Flutter (arm64, from git)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:RUNNER_TEMP\flutter\bin\flutter.bat" --version
          $dartVersion = & "$env:RUNNER_TEMP\flutter\bin\cache\dart-sdk\bin\dart.exe" --version 2>&1
          Write-Host "Dart: $dartVersion"
          if ("$dartVersion" -notmatch 'arm64') {
            throw "Expected a native arm64 Dart SDK — got: $dartVersion"
          }

      - name: Create Google Calendar Credentials
        shell: pwsh
        run: |
          $clientId = '${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}'
          $clientSecret = '${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}'
          if ([string]::IsNullOrWhiteSpace($clientId) -or [string]::IsNullOrWhiteSpace($clientSecret)) {
            throw "Google Calendar secrets are missing. Please set GOOGLE_CALENDAR_CLIENT_ID and GOOGLE_CALENDAR_CLIENT_SECRET."
          }
          $credentialsContent = @"
          class GoogleCalendarCredentials {
            static const String clientId = '$clientId';
            static const String clientSecret = '$clientSecret';
          }
          "@
          $credentialsContent | Out-File -FilePath "lib/tools/calendar/services/google_calendar_credentials.dart" -Encoding UTF8
          Write-Host "Google Calendar credentials file created"

      - name: Install Inno Setup (project script + fallback)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path .\installer\install_inno_setup.ps1) {
            Write-Host "Running local installer script..."
            .\installer\install_inno_setup.ps1
          } else {
            Write-Host "Local installer script not found, skipping."
          }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              Write-Host "Installing Inno Setup via winget..."
              winget install -e --id JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements
            } else {
              Write-Host "winget not found, installing via Chocolatey..."
              choco install innosetup -y --no-progress
            }
          }
          # הסקריפט של הפרויקט מתקין לעיתים per-user — מחפשים גם שם.
          $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup*\ISCC.exe" -Recurse -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName)
          if (-not $iscc) { throw "ISCC.exe not found after installation" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "ISCC resolved to: $iscc"

      - name: Prepare Flutter dependencies for Windows release
        shell: pwsh
        run: |
          flutter pub get
          dart run tool/generate_search_index.dart
          dart run tool/generate_settings_l10n.dart

      - name: Bundle VC++ Redistributable runtime DLLs (app-local, ARM64)
        shell: pwsh
        run: |
          # מקביל לשלב ה-x64, בהבדל אחד: אין redist ציבורי מוצמד ל-ARM64 עם
          # SHA ידוע, ואין שם גרסה ידועה-כפגומה להתגונן מפניה (באג 14.36 היה
          # x64). לכן מעתיקים את ה-DLLs הנייטיביים של רץ ה-ARM מ-System32 —
          # תמיד עדכניים ב-runner image — ורושמים את גרסאותיהם ללוג.
          $ErrorActionPreference = 'Stop'
          $destDir = "installer\vcredist\arm64"
          New-Item -ItemType Directory -Path $destDir -Force | Out-Null
          $dlls = @(
            'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll',
            'msvcp140_atomic_wait.dll', 'msvcp140_codecvt_ids.dll',
            'vcruntime140.dll', 'vcruntime140_1.dll', 'vcruntime140_threads.dll',
            'concrt140.dll', 'vccorlib140.dll'
          )
          $copied = 0
          foreach ($d in $dlls) {
            $src = Join-Path $env:SystemRoot "System32\$d"
            if (Test-Path $src) {
              Copy-Item -Path $src -Destination (Join-Path $destDir $d) -Force
              $ver = (Get-Item $src).VersionInfo.FileVersion
              Write-Host "  copied $d (v$ver)"
              $copied++
            } else {
              Write-Host "::warning::$d not found in System32 — skipping"
            }
          }
          if ($copied -eq 0) { throw "No VC++ runtime DLLs found in System32" }
          Write-Host "VC++ runtime DLLs staged in $destDir"

      - name: Build Flutter Windows app (ARM64)
        shell: pwsh
        env:
          UseMultiToolTask: 'true'
          EnforceProcessCountAcrossBuilds: 'true'
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          flutter build windows --release --verbose
          if (-not (Test-Path 'build\windows\arm64\runner\Release\otzaria.exe')) {
            throw 'Expected an arm64 build output — the tool built a different architecture'
          }

      - name: Zip Windows ARM64 build
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\arm64\runner\Release\*" -DestinationPath otzaria-windows-arm64.zip
          # portable.marker — ראה ההסבר בשלב המקביל ב-build_windows.
          $marker = Join-Path $env:RUNNER_TEMP 'portable.marker'
          New-Item -ItemType File -Path $marker -Force | Out-Null
          Compress-Archive -Path $marker -Update -DestinationPath otzaria-windows-arm64.zip

      - name: Build Inno Setup installer (ARM64)
        shell: pwsh
        run: |
          & "$env:ISCC" /DAppArch=arm64 installer\otzaria.iss
          if ($LASTEXITCODE -ne 0) {
            throw "ARM64 installer build failed"
          }

      - name: Upload Windows ARM64 installer
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-windows-arm64-installer
          path: installer/otzaria-*-windows-arm64.exe

      - name: Upload Windows ARM64 ZIP
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-windows-arm64-zip
          path: otzaria-windows-arm64.zip

  build_linux:
    name: Linux ${{ matrix.target }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        target: [deb, rpm, raw, full]
        arch: [x86_64, aarch64]
    # רץ בקונטיינר debian:bookworm — רצפת התאימות של ההפצה: glibc 2.36. רקע:
    # noble (Ubuntu 24.04) הסירה את wpewebkit מהארכיון, וה-WPE החבילתי (גם ב-trixie)
    # נבנה בלי DEVELOPER_MODE ולכן מתעלם מ-WEBKIT_EXEC_PATH — לא ניתן ל-self-contained.
    # לכן מורידים SDK של WPE 2.48.7 שנבנה מהמקור (Otzaria/otzaria-wpe-runtime על
    # bookworm, DEVELOPER_MODE=ON) ל-/opt/wpe-sdk ובונים מולו.
    if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.build_linux)
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: debian:bookworm-slim
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      CARGO_HOME:  ${{ github.workspace }}/.cargo
      DEBIAN_FRONTEND: noninteractive
      # תיקיית הפלט של flutter נגזרת מארכיטקטורת המארח (x64 / arm64).
      FLUTTER_BUILD_DIR: build/linux/${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}/release
      # ה-SDK של WPE נפרס ל-/opt/wpe-sdk; pkg-config וה-loader מוצאים אותו דרך אלה.
      PKG_CONFIG_PATH: /opt/wpe-sdk/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/wpe-sdk/lib
      # ה-try_compile של התוסף מלנקק בלי -L; בלי זה בדיקת WPEPlatform נכשלת ונופלים ל-FDO
      LIBRARY_PATH: /opt/wpe-sdk/lib
      # הפלאגין jni דורש כותרות JDK בזמן CMake (ב-runner הרגיל JDK מותקן מראש)
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-${{ matrix.arch == 'aarch64' && 'arm64' || 'amd64' }}
    steps:
      # חובה לפני actions/checkout: הקונטיינר מינימלי וחסרים בו git/curl/unzip/zstd.
      # בלי git ה-checkout מוריד tarball בלי היסטוריה ושלב בדיקת הגרסה (git log) נשבר;
      # zstd נדרש ל-cache של actions וגם לחילוץ ה-SDK (tar.zst).
      - name: Prepare container base tools
        shell: bash
        run: |
          set -e
          apt-get update -y
          # jq נדרש ע"י flutter-action (setup.sh)
          apt-get install -y ca-certificates curl git unzip zip xz-utils zstd jq
          # בקונטיינר בעלי הקבצים שונים ממשתמש ה-git (checkout וגם Flutter SDK) —
          # בלי wildcard כל פקודת git (כולל flutter עצמו) נופלת על dubious ownership.
          git config --global --add safe.directory '*'
      - name: Clone repository
        uses: actions/checkout@v4.2.2

      - name: Check if commit message is a version tag
        id: check_version
        shell: bash
        run: |
          COMMIT_MESSAGE='${{ github.event.head_commit.message }}'
          if [ -z "$COMMIT_MESSAGE" ]; then
            echo "Commit message not available in event payload; using checked-out HEAD commit message instead"
            COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          fi
          COMMIT_MESSAGE=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "Commit message: $COMMIT_MESSAGE"

          if printf '%s' "$COMMIT_MESSAGE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_version=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: matrix.arch != 'aarch64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      # אין חבילת SDK רשמית של Flutter ללינוקס-ARM (המניפסט של flutter-action
      # מכיל רק x64) — מתקינים מ-git באותו תג; ה-Dart SDK ל-arm64 יורד אוטומטית.
      - name: Set up Flutter (aarch64, from git)
        if: matrix.arch == 'aarch64'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.44.0 https://github.com/flutter/flutter.git /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          # flutter-action מוסיף את bin של מטמון pub ל-PATH; במסלול ה-git זה עלינו —
          # בלעדיו flutter_distributor מותקן אך לא נמצא בהרצה.
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
          /opt/flutter/bin/flutter --version

      - name: Create Google Calendar Credentials
        shell: bash
        run: |
          CLIENT_ID='${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}'
          CLIENT_SECRET='${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}'
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Google Calendar secrets are missing. Please set GOOGLE_CALENDAR_CLIENT_ID and GOOGLE_CALENDAR_CLIENT_SECRET."
            exit 1
          fi
          cat > lib/tools/calendar/services/google_calendar_credentials.dart << EOF
          class GoogleCalendarCredentials {
            static const String clientId = '$CLIENT_ID';
            static const String clientSecret = '$CLIENT_SECRET';
          }
          EOF
          echo "Google Calendar credentials file created"

      - name: Install Rust (stable) with rustup
        uses: dtolnay/rust-toolchain@stable

      - name: Add cargo to PATH and verify toolchain
        run: |
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          rustc -Vv
          cargo -V
          rustup show

      - name: Cache cargo registry and git
        uses: actions/cache@v4.2.3
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -e
          apt-get update -y
          # ריצה כ-root בקונטיינר — אין ולא נדרש sudo. חבילות ה-WPE (webkit/platform/
          # libwpe) לא מגיעות מ-apt אלא מ-SDK שנבנה מהמקור (ראה השלב הבא); כאן רק
          # תלויות הבנייה של התוסף + התלויות הציבוריות שה-.pc של ה-SDK מפנה אליהן
          # (glib/soup/xkbcommon). epoxy/wayland/gtk נמשכים דרך libgtk-3-dev.
          apt-get install -y \
            build-essential ninja-build libgtk-3-dev libblkid1 liblzma5 \
            clang-14 lld-14 cmake git pkg-config liblzma-dev rpm cpio patchelf curl xz-utils zstd \
            libcurl4-openssl-dev \
            libsecret-1-dev \
            libglib2.0-dev libsoup-3.0-dev libxkbcommon-dev openjdk-17-jdk-headless \
            libwebkit2gtk-4.1-dev xvfb xauth
          # bookworm מספקת clang-14 בלבד; יוצרים סימלינק לא-מגורסן ל-toolchain.
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 100
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-14 100
          # Fallback אם מסיבה כלשהי cargo לא קיים (למשל כשל זמני ב-rustup)
          if ! command -v cargo >/dev/null 2>&1; then
            apt-get install -y rustc cargo
          fi

      - name: Download prebuilt WPE runtime SDK
        shell: bash
        env:
          # גרסת ה-SDK; שם ה-asset נגזר ממנה ומהארכיטקטורה (ראה Otzaria/otzaria-wpe-runtime).
          WPE_RUNTIME_VERSION: "2.48.7"
          # digest שמפרסם GitHub לנכס של tag זה, לפי ארכיטקטורה. עדכון גרסה מחייב
          # עדכון מפורש של ה-hash, כדי שנכס שהוחלף ב-release לא ייכנס לבנייה בשקט.
          WPE_RUNTIME_SHA256: ${{ matrix.arch == 'aarch64' && '71b24f245d982fc1e7054d8d00a1c64dcce755675f98f0c6103d1f05843e9b72' || '6890a2fe09735440316f4418fdc56b746d4b3f1a1d5a2d6a1dc608f8fa05d3b8' }}
        run: |
          set -euo pipefail
          # pin ל-tag מפורש (לא latest) — גרסת ה-SDK נגזרת רק מ-WPE_RUNTIME_VERSION.
          # מוסכמת ה-tag בריפו otzaria-wpe-runtime: wpe-<version>.
          tag="candidate-wpe-2.48.7-dmabuf-20260821"
          asset="wpe-runtime-${WPE_RUNTIME_VERSION}-linux-${{ matrix.arch }}.tar.zst"
          base="https://github.com/Otzaria/otzaria-wpe-runtime/releases/download/${tag}"
          echo "Downloading ${asset} ..."
          curl -fSL --retry 3 --retry-delay 5 -o "/tmp/${asset}" "${base}/${asset}"
          printf '%s  %s\n' "$WPE_RUNTIME_SHA256" "/tmp/${asset}" | sha256sum -c -
          mkdir -p /opt
          # ה-tarball נארז מ-$(dirname PREFIX) עם basename → מכיל תיקיית wpe-sdk/ עליונה.
          tar -C /opt -I zstd -xf "/tmp/${asset}"
          test -f /opt/wpe-sdk/lib/pkgconfig/wpe-webkit-2.0.pc
          cat /opt/wpe-sdk/VERSIONS 2>/dev/null || true
          echo "--- אימות שה-.pc של ה-SDK נפתרים ---"
          pkg-config --print-errors --exists \
            wpe-webkit-2.0 wpe-platform-2.0 wpe-platform-headless-2.0 wpe-1.0
          echo "wpe-webkit-2.0 = $(pkg-config --modversion wpe-webkit-2.0)"

      - name: Prepare WPE bundling script (shared)
        shell: bash
        run: |
          set -euo pipefail
          # סקריפט משותף המוזרק ל-bundle נתון: מעתיק את תהליכי העזר של WPE
          # (WPEWebProcess/WPENetworkProcess) + סוגר את התלויות הטרנזיטיביות של
          # libWPEWebKit דרך ldd, למעט ספריות מארח. מופעל שלוש פעמים — על ה-bundle
          # הראשי (raw/FULL) ועל עצי ה-deb/rpm — כדי שכל אריזה תהיה self-contained.
          cat > /tmp/bundle_wpe.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          LIBDIR="${1:?usage: bundle_wpe.sh <bundle-lib-dir>}"
          [ -d "$LIBDIR" ] || { echo "::error::bundle lib dir not found: $LIBDIR"; exit 1; }
          export LD_LIBRARY_PATH="/opt/wpe-sdk/lib:$LIBDIR:${LD_LIBRARY_PATH:-}"

          # תהליכי העזר של WPE — WEBKIT_EXEC_PATH של הפלאגין מפנה אליהם בתוך תיקיית
          # הפלאגין (lib/), והם פותרים ספריות מ-$ORIGIN באותה תיקייה.
          find /opt/wpe-sdk -type f \( -name 'WPEWebProcess' -o -name 'WPENetworkProcess' -o -name 'WPEGPUProcess' \) \
            -exec cp -v {} "$LIBDIR/" \;
          test -e "$LIBDIR/WPEWebProcess" || { echo "::error::WPEWebProcess not found in SDK"; exit 1; }
          # ה-injected bundle יושב ב-SDK בתת-תיקייה (wpe-webkit-2.0/injected-bundle/)
          # ולא מגיע מ-flutter build — בלעדיו ה-WebProcess נכשל בטעינת ה-bundle.
          find /opt/wpe-sdk -type f -name 'libWPEInjectedBundle.so' -exec cp -v {} "$LIBDIR/" \;
          test -e "$LIBDIR/libWPEInjectedBundle.so" || { echo "::error::libWPEInjectedBundle.so not found in SDK"; exit 1; }
          # cp על קובץ יעד קיים משמר את הרשאות היעד (0644 מ-install של flutter) —
          # בלי אכיפת +x כאן, g_chmod בזמן ריצה נכשל בחבילה שהותקנה בבעלות root.
          chmod 755 "$LIBDIR"/WPE*Process

          # רשימת החרגה בסגנון AppImage: ספריות שחייבות להגיע מהמארח — glibc, C++
          # runtime, GL/הצגה (X11/Wayland/DRM/GBM), וכל ה-stack שגם GTK של המארח
          # טוען לאותו תהליך (glib/cairo/pango/harfbuzz...): אריזת עותק bookworm
          # ישן לצד GTK מערכתי חדש גורמת symbol lookup error. רצפת bookworm
          # מבטיחה שגרסת המארח תמיד ≥ מה ש-WPE נבנה מולו (תאימות קדימה).
          # שאר הסגירה (icu/soup/jpeg/webp...) נארזת — sonames שונים בין הפצות
          # (למשל Ubuntu 24.04 = icu74 מול icu72 של bookworm).
          is_excluded() {
            case "$1" in
              ld-linux*|libc.so*|libm.so*|libdl.so*|libpthread.so*|librt.so*|libresolv.so*|libutil.so*|libnsl.so*|\
              libstdc++.so*|libgcc_s.so*|\
              libGL.so*|libGLX.so*|libGLdispatch.so*|libOpenGL.so*|libEGL.so*|libGLESv2.so*|libGLU.so*|libgbm.so*|libdrm.so*|libepoxy.so*|\
              libX11.so*|libX11-xcb.so*|libxcb*.so*|libXext.so*|libXi.so*|libXfixes.so*|libXrender.so*|libXrandr.so*|libXcursor.so*|libXdamage.so*|libXcomposite.so*|libXau.so*|libXdmcp.so*|libXtst.so*|libXinerama.so*|\
              libwayland-*.so*|\
              libglib-2.0.so*|libgobject-2.0.so*|libgio-2.0.so*|libgmodule-2.0.so*|libgthread-2.0.so*|\
              libgtk-3.so*|libgdk-3.so*|libatk*.so*|\
              libcairo*.so*|libpango*.so*|libharfbuzz*.so*|libgdk_pixbuf*.so*|libfreetype.so*|libfontconfig.so*|\
              libdbus-1.so*|libsystemd.so*|libudev.so*|libselinux.so*|libexpat.so*) return 0;;
            esac
            return 1
          }

          tmp="$(mktemp)"
          for elf in "$LIBDIR"/libWPEWebKit-2.0.so* "$LIBDIR"/libwpe-1.0.so* \
                     "$LIBDIR"/libWPEInjectedBundle.so \
                     "$LIBDIR"/WPEWebProcess "$LIBDIR"/WPENetworkProcess; do
            [ -e "$elf" ] || continue
            ldd "$elf" 2>/dev/null | awk '/=> \//{print $3}'
          done | sort -u > "$tmp"

          copied=0
          while IFS= read -r dep; do
            [ -n "$dep" ] || continue
            b="$(basename "$dep")"
            is_excluded "$b" && continue
            [ -e "$LIBDIR/$b" ] && continue
            real="$(readlink -f "$dep")"
            [ -f "$real" ] || continue
            cp -v "$real" "$LIBDIR/$b"
            copied=$((copied+1))
          done < "$tmp"
          rm -f "$tmp"
          # dedup: DT_NEEDED מפנה תמיד ל-soname (libX.so.N) — עותק נוסף בשם הגרסה
          # המלאה (libX.so.N.x.y) זהה בייטית ומיותר; חוסך ~162MB על libWPEWebKit.
          for f in "$LIBDIR"/lib*.so.*.*; do
            [ -f "$f" ] || continue
            short="$f"
            while [[ "$short" == *.so.*.* ]]; do short="${short%.*}"; done
            if [ -f "$short" ] && [ "$(stat -c%s "$f")" = "$(stat -c%s "$short")" ]; then
              rm -v "$f"
            fi
          done
          APPDIR="$(dirname "$LIBDIR")"
          if [ -x "$APPDIR/otzaria" ] && [ ! -e "$APPDIR/otzaria.bin" ]; then
            mv "$APPDIR/otzaria" "$APPDIR/otzaria.bin"
            cat > "$APPDIR/otzaria" <<'LAUNCHER'
          #!/usr/bin/env bash
          set -euo pipefail
          APP_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$APP_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export WEBKIT_EXEC_PATH="$APP_DIR/lib"
          export WEBKIT_INJECTED_BUNDLE_PATH="$APP_DIR/lib"
          exec "$APP_DIR/otzaria.bin" "$@"
          LAUNCHER
            chmod 755 "$APPDIR/otzaria"
          fi
          echo "bundle_wpe: injected helper processes + $copied transitive libs into $LIBDIR"
          SCRIPT
          chmod +x /tmp/bundle_wpe.sh

      - name: Download library assets for Linux FULL bundle
        if: matrix.target == 'full'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full_installer/library_db
          curl -L --fail https://github.com/Otzaria/SeforimLibrary/releases/latest/download/seforim.db.zst -o full_installer/library_db/seforim.db.zst
          curl -L --fail https://github.com/Otzaria/otzar-HB_catalog/releases/latest/download/otzar-HB_catalog.db.zst -o full_installer/library_db/otzar-HB_catalog.db.zst
          curl -L --fail https://github.com/Otzaria/otzaria-library/releases/latest/download/talmud_bavli_latest.tar.zst -o full_installer/library_db/talmud_bavli_latest.tar.zst
          curl -L --fail https://github.com/Otzaria/SeforimMagicIndexer/releases/latest/download/lexical.db -o full_installer/library_db/lexical.db
      
      - name: Install flutter_distributor
        if: matrix.target == 'deb' || matrix.target == 'rpm'
        run: dart pub global activate flutter_distributor

      - name: Prepare Flutter dependencies for Linux release
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          # Generate the settings .g.dart files: search index + translation catalog.
          dart run tool/generate_search_index.dart
          dart run tool/generate_settings_l10n.dart

      - name: Build the search engine inside the compatibility container
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'use_precompiled_binaries: false' \
            'verbose_logging: true' \
            > cargokit_options.yaml

      # התוסף קורא ל-webkit_web_view_get_theme_color (קיים רק מ-WebKit 2.50) בלי guard גרסה;
      # ה-SDK הוא 2.48 — עוטפים ב-WEBKIT_CHECK_VERSION עד שיתוקן בחבילה.
      - name: Patch inappwebview_linux theme_color for WPE 2.48
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r FILE; do
            found=1
            sed -i 's|^  WebKitColor color;$|  WebKitColor color{};|' "$FILE"
            sed -i 's|^  gboolean hasColor = webkit_web_view_get_theme_color(webview_, \&color);$|#if WEBKIT_CHECK_VERSION(2, 50, 0)\n  gboolean hasColor = webkit_web_view_get_theme_color(webview_, \&color);\n#else\n  gboolean hasColor = FALSE;\n#endif|' "$FILE"
            grep -q "WEBKIT_CHECK_VERSION(2, 50, 0)" "$FILE" || { echo "::error::theme_color patch did not apply to $FILE"; exit 1; }
            echo "patched: $FILE"
          done < <(find "${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev" -path '*/flutter_inappwebview_linux-*/linux/in_app_webview/in_app_webview.cc')
          [ "$found" = "1" ] || { echo "::error::in_app_webview.cc not found in pub cache"; exit 1; }

      - name: Build Flutter Linux app (with retry)
        shell: bash
        env:
          # clang-14 של bookworm לא מכיר חלק מדגלי ה-warning של sentry-native/nlohmann,
          # לכן מרככים unknown-warning-option מ-error ל-warning (רצפת התאימות: bookworm/glibc 2.36).
          CC: clang
          CXX: clang++
          CFLAGS: -Wno-error=unknown-warning-option
          CXXFLAGS: -Wno-error=unknown-warning-option
        run: |
          # pipefail חובה: בלעדיו ה-tee מסתיר כשל של flutter build בתוך ה-if
          set -eo pipefail
          tries=0
          : > "$GITHUB_WORKSPACE/build_linux.log"
          until [ $tries -ge 3 ]
          do
            if flutter build linux --verbose 2>&1 | tee -a "$GITHUB_WORKSPACE/build_linux.log"; then
              break
            fi
            tries=$((tries+1))
            echo "flutter build linux failed. retry $tries/3 after short sleep..."
            sleep 15
          done
          if [ $tries -ge 3 ]; then
            echo "::error::flutter build linux failed after 3 attempts"
            exit 1
          fi

      - name: Verify WPE SDK (WPEPlatform) was used, not FDO/system
        shell: bash
        run: |
          set -e
          log="$GITHUB_WORKSPACE/build_linux.log"
          if grep -q "WPEPlatform API - DEFAULT" "$log" \
             && grep -q "WebKit has WPEPlatform API support" "$log"; then
            echo "OK: נבנה מול wpe-platform-2.0 מה-SDK"
          else
            echo "::error::WPEPlatform (wpe-platform-2.0) מה-SDK לא זוהה — ייתכן fallback ל-FDO/WPE מערכת"
            grep -in "wpe" "$log" | head -n 40 || true
            exit 1
          fi
          if grep -q "Found wpebackend-fdo-1.0 (Legacy FDO API)" "$log"; then
            echo "::error::הפלאגין נפל ל-backend הישן (FDO) במקום WPEPlatform"
            exit 1
          fi

      - name: Verify search engine glibc compatibility
        shell: bash
        run: |
          set -euo pipefail
          search_lib="${FLUTTER_BUILD_DIR}/bundle/lib/libsearch_engine.so"
          test -f "$search_lib"
          incompatible=$(strings "$search_lib" \
            | grep -Eo 'GLIBC_2\.(3[7-9]|[4-9][0-9])' \
            | sort -Vu || true)
          if [ -n "$incompatible" ]; then
            echo "::error::libsearch_engine.so requires a glibc newer than Bookworm"
            printf '%s\n' "$incompatible"
            exit 1
          fi
          strings "$search_lib" | grep -Eo 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n 1

      - name: Dump CMake error log on failure
        if: failure()
        shell: bash
        run: |
          tail -n 120 "${FLUTTER_BUILD_DIR}/CMakeFiles/CMakeError.log" 2>/dev/null || true
          tail -n 40 "${FLUTTER_BUILD_DIR}/CMakeFiles/CMakeConfigureLog.yaml" 2>/dev/null || true

      - name: Build and Patch Linux DEB package
        if: matrix.target == 'deb'
        shell: bash
        env:
          CC: clang
          CXX: clang++
          # clang-14 של bookworm — ראה ההסבר בשלב הבנייה הראשי.
          CFLAGS: -Wno-error=unknown-warning-option
          CXXFLAGS: -Wno-error=unknown-warning-option
        run: |
          set -e

          # 1. הרץ את פקודת הבנייה, אבל תפוס את הכישלון כדי שנוכל לתקן אחריו
          echo "Attempting to build with flutter_distributor, it might fail..."
          flutter_distributor release --name=production --jobs=release-linux-deb || true

          # 2. שני מסלולים: אם ה-distributor הצליח (Depends תקין) — נפרק את ה-deb
          # שיצר כדי להזריק את ה-WPE runtime; אם נכשל — נשאר עץ מפורק עם control.
          DEB_BUILT=$(find dist -type f -name "*.deb" | head -n 1)
          CONTROL_FILE=$(find dist -type f -name "control" | head -n 1)
          if [ -z "$CONTROL_FILE" ] && [ -n "$DEB_BUILT" ]; then
            EXTRACT_DIR="dist/otzaria-deb-tree"
            rm -rf "$EXTRACT_DIR"
            dpkg-deb -R "$DEB_BUILT" "$EXTRACT_DIR"
            DEB_PREBUILT_NAME=$(basename "$DEB_BUILT")
            rm -f "$DEB_BUILT"
            CONTROL_FILE="$EXTRACT_DIR/DEBIAN/control"
          fi
          if [ -z "$CONTROL_FILE" ] || [ ! -f "$CONTROL_FILE" ]; then
            echo "::error::Fatal: Could not find the DEBIAN/control file. The distributor failed before creating it."
            exit 1
          fi

          echo "Found control file to patch at: $CONTROL_FILE"
          echo "--- Control file BEFORE fix ---"
          cat "$CONTROL_FILE"

          # 3. תקן את כל הבעיות האפשריות בקובץ
          # המרת סיומות שורה (CRLF -> LF)
          sed -i 's/\r$//' "$CONTROL_FILE"
          # הסרת שורת Depends ריקה
          sed -i '/^Depends:\s*$/d' "$CONTROL_FILE"
          # ודא שיש שורת סיום (newline) בסוף הקובץ
          if [ -n "$(tail -c1 "$CONTROL_FILE")" ]; then
            echo >> "$CONTROL_FILE"
          fi

          # ה-distributor עלול להטביע ארכיטקטורה שגויה בבנייה צולבת-שם — מיישרים למארח.
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sed -i 's/^Architecture:.*/Architecture: arm64/' "$CONTROL_FILE"
          fi

          echo "--- Control file AFTER fix ---"
          cat "$CONTROL_FILE"

          # 4. בנה את חבילת ה-deb מחדש מהקבצים המתוקנים
          DEB_DIR=$(dirname "$CONTROL_FILE" | xargs dirname)
          if [ -n "${DEB_PREBUILT_NAME:-}" ]; then
            DEB_OUTPUT_FILE="dist/$DEB_PREBUILT_NAME"
          else
            DEB_OUTPUT_FILE="dist/$(basename "$DEB_DIR" | sed 's/-linux_deb$//')-linux.deb"
          fi

          # אריזת runtime של WPE לתוך עץ ה-deb לפני ה-repack (dpkg-deb אורז את
          # העץ כמות שהוא) — כדי שה-deb יהיה self-contained באותה רמה כמו ה-raw.
          DEB_LIB_SO=$(find "$DEB_DIR" -name 'libWPEWebKit-2.0.so*' -print -quit)
          [ -n "$DEB_LIB_SO" ] || { echo "::error::libWPEWebKit-2.0 לא נמצא בעץ ה-deb"; exit 1; }
          bash /tmp/bundle_wpe.sh "$(dirname "$DEB_LIB_SO")"

          # AppStream metainfo — בלעדיו GNOME Software מציג גלגל-שיניים גנרי
          # במסך ההתקנה. (ל-rpm זה מגיע נטיבית דרך make_config.yaml.)
          mkdir -p "$DEB_DIR/usr/share/metainfo"
          cp linux/packaging/otzaria.metainfo.xml "$DEB_DIR/usr/share/metainfo/otzaria.metainfo.xml"

          # שם קובץ מובחן ל-arm64 — אחרת שני ה-deb מתנגשים באותו שם ב-release.
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            DEB_OUTPUT_FILE="${DEB_OUTPUT_FILE%.deb}-arm64.deb"
          fi

          echo "Re-packaging from directory: $DEB_DIR into $DEB_OUTPUT_FILE"
          dpkg-deb --build --root-owner-group "$DEB_DIR" "$DEB_OUTPUT_FILE"

          echo "Successfully patched and rebuilt the .deb package."
        
      - name: Build and Patch Linux RPM package
        if: matrix.target == 'rpm'
        shell: bash
        env:
          CC: clang
          CXX: clang++
          # clang-14 של bookworm — ראה ההסבר בשלב הבנייה הראשי.
          CFLAGS: -Wno-error=unknown-warning-option
          CXXFLAGS: -Wno-error=unknown-warning-option
        run: |
          set -e

          # 1. הרץ את פקודת הבנייה הבעייתית, ותפוס את הכישלון
          echo "Attempting to build with flutter_distributor, expecting it to fail..."
          flutter_distributor release --name=production --jobs=release-linux-rpm || true

          # 2. מצא את קובץ ה-spec הפגום שהכלי יצר
          SPEC_FILE=$(find dist -type f -name "*.spec" | head -n 1)
          if [ -z "$SPEC_FILE" ]; then
            echo "::error::Fatal: Could not find the .spec file to patch."
            exit 1
          fi

          echo "Found spec file to patch at: $SPEC_FILE"
          echo "--- Spec file BEFORE fix ---"
          cat "$SPEC_FILE"

          # 3. תקן את הקובץ: מחק את שורת ה-Requires הריקה
          sed -i '/^Requires:\s*$/d' "$SPEC_FILE"

          # make_config של ה-rpm מקבע build_arch: x86_64 — מיישרים לארכיטקטורת המארח.
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sed -i 's/^BuildArch:.*/BuildArch: aarch64/' "$SPEC_FILE"
          fi

          echo "--- Spec file AFTER fix ---"
          cat "$SPEC_FILE"

          # 4. בנה את חבילת ה-rpm מחדש, תוך שימוש בנתיב מוחלט
          RPM_TOP_DIR_REL=$(dirname "$SPEC_FILE" | xargs dirname)
          RPM_TOP_DIR_ABS="$(pwd)/$RPM_TOP_DIR_REL"

          # אריזת runtime של WPE לתוך עץ המקור של ה-rpm לפני rpmbuild. ה-spec של
          # flutter_app_packager חסר %prep/%setup/Source — %install רק מעתיק את
          # %{name}/* מ-BUILD/, לכן הזרקה ל-BUILD/<name>/lib שורדת את rpmbuild -bb
          # (הזרקה ל-BUILDROOT הייתה נדרסת בהעתקת %install).
          RPM_LIB_SO=$(find "$RPM_TOP_DIR_ABS/BUILD" -name 'libWPEWebKit-2.0.so*' -print -quit)
          [ -n "$RPM_LIB_SO" ] || { echo "::error::libWPEWebKit-2.0 לא נמצא בעץ ה-rpm (BUILD)"; exit 1; }
          bash /tmp/bundle_wpe.sh "$(dirname "$RPM_LIB_SO")"

          echo "Re-packaging using absolute top directory: $RPM_TOP_DIR_ABS"
          rpmbuild --define "_topdir $RPM_TOP_DIR_ABS" -bb "$SPEC_FILE"

          echo "Successfully patched and rebuilt the .rpm package."
      
      - name: Bundle WPE runtime into main bundle (raw + FULL)
        shell: bash
        run: |
          set -euo pipefail
          # רץ אחרי בניות ה-deb/rpm של flutter_distributor (שבונות מחדש את ה-bundle
          # ולכן דורסות הזרקה מוקדמת) כדי שחבילות ה-raw וה-FULL, המועתקות מ-bundle
          # זה בשלב הבא, יהיו self-contained.
          bash /tmp/bundle_wpe.sh "${FLUTTER_BUILD_DIR}/bundle/lib"

      - name: Verify WPE runtime in packaged artifacts
        shell: bash
        run: |
          set -euo pipefail
          # מוודא שבכל אריזה תהליכי WPE* קיימים עם הרשאת הרצה וה-injected bundle
          # קיים — בלי זה החבילה נופלת בשקט ל-WPE מערכתי (שלרוב לא מותקן).
          verify_tree() { # verify_tree <label> <root-dir>
            local label="$1" root="$2" libdir proc
            libdir=$(find "$root" -name 'libWPEWebKit-2.0.so*' -print -quit | xargs -r dirname)
            [ -n "$libdir" ] || { echo "::error::$label: libWPEWebKit-2.0 לא נמצא"; exit 1; }
            for proc in WPEWebProcess WPENetworkProcess; do
              [ -f "$libdir/$proc" ] || { echo "::error::$label: $proc חסר"; exit 1; }
              [ -x "$libdir/$proc" ] || { echo "::error::$label: $proc ללא הרשאת הרצה"; exit 1; }
            done
            if [ -f "$libdir/WPEGPUProcess" ] && [ ! -x "$libdir/WPEGPUProcess" ]; then
              echo "::error::$label: WPEGPUProcess ללא הרשאת הרצה"; exit 1
            fi
            [ -f "$libdir/libWPEInjectedBundle.so" ] || { echo "::error::$label: libWPEInjectedBundle.so חסר"; exit 1; }
            echo "$label: WPE runtime תקין ($libdir)"
          }

          # ב-raw/full אין תיקיית dist — find נכשל תחת bash -e בלי ההגנה הזו.
          DEB_FILE=$(find dist -name '*.deb' -print -quit 2>/dev/null || true)
          if [ -n "$DEB_FILE" ]; then
            rm -rf /tmp/verify-deb && mkdir -p /tmp/verify-deb
            dpkg-deb -x "$DEB_FILE" /tmp/verify-deb
            verify_tree "deb" /tmp/verify-deb
          fi

          RPM_FILE=$(find dist -name '*.rpm' -print -quit 2>/dev/null || true)
          if [ -n "$RPM_FILE" ]; then
            rm -rf /tmp/verify-rpm && mkdir -p /tmp/verify-rpm
            (cd /tmp/verify-rpm && rpm2cpio "$GITHUB_WORKSPACE/$RPM_FILE" | cpio -idm --quiet)
            verify_tree "rpm" /tmp/verify-rpm
          fi

          verify_tree "raw-bundle" "${FLUTTER_BUILD_DIR}/bundle"

      - name: Find and prepare Linux packages
        id: find_packages
        run: |
          DEB_FILE=$(find dist -maxdepth 1 -name "*-linux*.deb" | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            echo "deb_file=$DEB_FILE" >> $GITHUB_OUTPUT
            echo "deb_name=$(basename $DEB_FILE)" >> $GITHUB_OUTPUT
          fi
          RPM_FILE=$(find dist -type f -name "*.rpm" | head -n 1)
          if [ -n "$RPM_FILE" ]; then
            echo "rpm_file=$RPM_FILE" >> $GITHUB_OUTPUT
            echo "rpm_name=$(basename $RPM_FILE)" >> $GITHUB_OUTPUT
          fi
          mkdir -p linux-build
          cp -r "${FLUTTER_BUILD_DIR}"/bundle/* linux-build/
          # portable.marker הופך את חבילת ה-raw לניידת באמת: כל הנתונים
          # נשמרים בתיקיית otzaria_data ליד ה-executable (ראה
          # lib/core/app_paths.dart → isPortable). חבילת ה-FULL מעתיקה את
          # linux-build ולכן מסירה את ה-marker אצלה במפורש.
          touch linux-build/portable.marker
      
      - name: Upload Linux DEB package
        if: matrix.target == 'deb' && steps.find_packages.outputs.deb_file != ''
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-linux-deb${{ matrix.arch == 'aarch64' && '-arm64' || '' }}
          path: ${{ steps.find_packages.outputs.deb_file }}
          
      - name: Upload Linux RPM package
        if: github.event_name != 'pull_request' && matrix.target == 'rpm' && steps.find_packages.outputs.rpm_file != ''
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-linux-rpm${{ matrix.arch == 'aarch64' && '-arm64' || '' }}
          path: ${{ steps.find_packages.outputs.rpm_file }}
       
      - name: Upload linux build (raw)
        if: matrix.target == 'raw'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-linux-raw${{ matrix.arch == 'aarch64' && '-arm64' || '' }}
          path: linux-build/*

      - name: Create Linux FULL portable bundle
        if: matrix.target == 'full'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="full_installer/otzaria-linux-full"
          rm -rf "$BUNDLE_ROOT"
          mkdir -p "$BUNDLE_ROOT/app" "$BUNDLE_ROOT/אוצריא"

          cp -r linux-build/. "$BUNDLE_ROOT/app/"
          # חבילת ה-FULL אינה ניידת (נתוני המשתמש נשארים בתיקיית המשתמש);
          # ה-marker שייך רק לחבילת ה-raw — מסירים את העותק שהגיע מ-linux-build.
          rm -f "$BUNDLE_ROOT/app/portable.marker"
          zstd -d -c --long=31 --memory=2048MB full_installer/library_db/seforim.db.zst > "$BUNDLE_ROOT/אוצריא/seforim.db"
          zstd -d -c --long=31 --memory=2048MB full_installer/library_db/otzar-HB_catalog.db.zst > "$BUNDLE_ROOT/אוצריא/otzar-HB_catalog.db"
          zstd -d -c --long=31 --memory=2048MB full_installer/library_db/talmud_bavli_latest.tar.zst | tar -xf - -C "$BUNDLE_ROOT/אוצריא"
          # בלי קובץ הגרסה בתיקייה, בדיקת העדכון הראשונה של האפליקציה מורידה את
          # התלמוד (~440MB) מחדש; ה-sha256 של הארכיון הוא ה-digest שהיא משווה מולו.
          sha256sum full_installer/library_db/talmud_bavli_latest.tar.zst \
            | cut -d' ' -f1 > "$BUNDLE_ROOT/אוצריא/תלמוד בבלי/.version"
          # מילון החיפוש המקורב (lexical.db) — אינו דחוס, מועתק כמות שהוא ליד seforim.db.
          cp full_installer/library_db/lexical.db "$BUNDLE_ROOT/אוצריא/lexical.db"
          # אותו כלל כמו בתלמוד: בלי סימון גרסה המילון (~57MB) יורד מחדש בבדיקה הראשונה.
          sha256sum full_installer/library_db/lexical.db \
            | cut -d' ' -f1 > "$BUNDLE_ROOT/אוצריא/lexical.db.version"
          # קובץ marker שמסמן לאפליקציה שהתיקייה היא ספרייה מצורפת של חבילת FULL.
          # ראה lib/core/app_paths.dart → _detectBundledLibraryPath.
          touch "$BUNDLE_ROOT/אוצריא/.otzaria_bundled_library"

          cat > "$BUNDLE_ROOT/run-otzaria.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          exec ./app/otzaria
          EOF
          chmod +x "$BUNDLE_ROOT/run-otzaria.sh"

          cat > "$BUNDLE_ROOT/README.txt" << 'EOF'
          Otzaria Linux FULL bundle

          This portable bundle includes the app and the bundled library.
          Start the app using ./run-otzaria.sh so the app can detect the bundled library folder.
          EOF

          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            tar -czf otzaria-linux-full-arm64.tar.gz -C full_installer otzaria-linux-full
            # הספרייה המאונדקסת חוצת-פלטפורמות — עותק אחד נבנה ב-x86_64 בלבד.
            exit 0
          fi
          tar -czf otzaria-linux-full.tar.gz -C full_installer otzaria-linux-full

          # חבילת ספרייה נוספת עם אינדקס טקסט מוכן מאותו מנוע של האפליקציה.
          # PDF מאונדקס מקומית מפני שמפתח האינדקס שלו הוא נתיב שאינו נייד.
          INDEX_CLI_DATA="$GITHUB_WORKSPACE/full_installer/index-cli-data"
          INDEXED_LIBRARY_ROOT="$GITHUB_WORKSPACE/full_installer/otzaria-library-full-indexed"
          mkdir -p "$INDEX_CLI_DATA" "$INDEXED_LIBRARY_ROOT"
          cp -al "$GITHUB_WORKSPACE/$BUNDLE_ROOT/אוצריא" "$INDEXED_LIBRARY_ROOT/books"
          # בחבילה הכללית המשתמש בוחר את books ידנית; marker של bundle צמוד
          # לאפליקציה היה גורם לנתיב להיחשב לא-ידני בעלייה הבאה.
          BUNDLED_MARKER="$INDEXED_LIBRARY_ROOT/books/.otzaria_bundled_library"
          case "$BUNDLED_MARKER" in
            "$GITHUB_WORKSPACE/full_installer/otzaria-library-full-indexed/books/.otzaria_bundled_library") ;;
            *) echo "::error::Unexpected bundled marker path: $BUNDLED_MARKER"; exit 1 ;;
          esac
          [ ! -L "$BUNDLED_MARKER" ] || { echo "::error::Bundled marker must not be a symlink"; exit 1; }
          [ ! -e "$BUNDLED_MARKER" ] || rm -f -- "$BUNDLED_MARKER"
          xvfb-run -a "$BUNDLE_ROOT/app/otzaria" build-release-index \
            --library "$INDEXED_LIBRARY_ROOT/books" \
            --index "$INDEXED_LIBRARY_ROOT/index" \
            --data "$INDEX_CLI_DATA"
          touch "$INDEXED_LIBRARY_ROOT/index/.otzaria_prebuilt_index"

          cat > "$INDEXED_LIBRARY_ROOT/README.txt" << 'EOF'
          Otzaria indexed FULL library

          Extract the complete multipart archive and choose its books directory in Otzaria.
          Keep books and index next to each other; the application resolves this layout automatically.
          The package includes a prebuilt text-book search index.
          Bundled PDFs are indexed locally because their index keys contain installation paths.
          EOF

          VERSION=$(awk '/^version:/ {split($2, v, "+"); print v[1]; exit}' pubspec.yaml)
          INDEXED_ARCHIVE="otzaria-${VERSION}-library-full-indexed.tar.zst"
          tar -C full_installer -cf - otzaria-library-full-indexed \
            | zstd -19 -T0 -o "$INDEXED_ARCHIVE"
          mkdir -p indexed-release-parts
          tool/release/split_release_asset.sh \
            "$INDEXED_ARCHIVE" indexed-release-parts 1992294400
          cp tool/release/assemble_split_asset.sh indexed-release-parts/
          cp tool/release/assemble_split_asset.ps1 indexed-release-parts/

          # קובץ-הביניים השלם עלול להיות גדול מ-2 GiB; רק החלקים עולים כ-assets.
          case "$INDEXED_ARCHIVE" in
            otzaria-*-library-full-indexed.tar.zst) ;;
            *) echo "::error::Unexpected indexed archive path: $INDEXED_ARCHIVE"; exit 1 ;;
          esac
          [ -f "$INDEXED_ARCHIVE" ] || { echo "::error::Indexed archive is missing"; exit 1; }
          rm -f -- "$INDEXED_ARCHIVE"

      - name: Upload Linux FULL bundle
        if: matrix.target == 'full'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-linux-full${{ matrix.arch == 'aarch64' && '-arm64' || '' }}
          path: otzaria-linux-full${{ matrix.arch == 'aarch64' && '-arm64' || '' }}.tar.gz

      - name: Upload indexed FULL library parts
        if: matrix.target == 'full' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-library-full-indexed
          path: indexed-release-parts/*
          compression-level: 0
          if-no-files-found: error

      - name: Upload indexed FULL manifest for installer build
        if: matrix.target == 'full' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-library-full-indexed-manifest
          path: indexed-release-parts/*.manifest.json
          if-no-files-found: error

  build_android:
    if: github.event_name != 'release' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_android)
    runs-on: ubuntu-latest
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      CARGO_HOME: ${{ github.workspace }}/.cargo
    steps:
      - name: Clone repository
        uses: actions/checkout@v4.2.2

      - name: Check if commit message is a version tag
        id: check_version
        shell: bash
        run: |
          COMMIT_MESSAGE='${{ github.event.head_commit.message }}'
          if [ -z "$COMMIT_MESSAGE" ]; then
            echo "Commit message not available in event payload; using checked-out HEAD commit message instead"
            COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          fi
          COMMIT_MESSAGE=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "Commit message: $COMMIT_MESSAGE"

          if printf '%s' "$COMMIT_MESSAGE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_version=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          # מחיקת קבצים מיותרים כדי לפנות מקום
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Add cargo to PATH & verify toolchain
        run: |
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          rustc -Vv
          cargo -V
          rustup show

      - name: Cache Rust
        uses: actions/cache@v4.2.3
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            ${{ env.RUSTUP_HOME }}
          key: ${{ runner.os }}-rust-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-android-

      - name: Pre-install Android Rust targets (with retry)
        run: |
          set -e
          # פונקציה להתקנת target עם retry
          install_target_with_retry() {
            local target=$1
            local max_attempts=3
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Installing $target (attempt $attempt/$max_attempts)..."
              if rustup target add --toolchain stable "$target"; then
                echo "✓ Successfully installed $target"
                return 0
              fi
              
              echo "Failed to install $target, cleaning up..."
              # ניקוי קבצים זמניים שעלולים לגרום לבעיה
              rm -rf ~/.rustup/downloads/*.partial || true
              rm -rf ~/.rustup/tmp/* || true
              
              attempt=$((attempt + 1))
              if [ $attempt -le $max_attempts ]; then
                echo "Waiting 10 seconds before retry..."
                sleep 10
              fi
            done
            
            echo "::error::Failed to install $target after $max_attempts attempts"
            return 1
          }
          
          # התקנת כל ה-targets הנדרשים
          install_target_with_retry "armv7-linux-androideabi"
          install_target_with_retry "aarch64-linux-android"
          install_target_with_retry "x86_64-linux-android"
          install_target_with_retry "i686-linux-android"
          
          echo "All Android Rust targets installed successfully"

      - name: Cache Gradle
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Pub
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-
      
      - name: Create Google Calendar Credentials
        shell: bash
        run: |
          CLIENT_ID='${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}'
          CLIENT_SECRET='${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}'
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Google Calendar secrets are missing. Please set GOOGLE_CALENDAR_CLIENT_ID and GOOGLE_CALENDAR_CLIENT_SECRET."
            exit 1
          fi
          cat > lib/tools/calendar/services/google_calendar_credentials.dart << EOF
          class GoogleCalendarCredentials {
            static const String clientId = '$CLIENT_ID';
            static const String clientSecret = '$CLIENT_SECRET';
          }
          EOF
          echo "Google Calendar credentials file created"

      - name: Setup Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore/otzaria-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p android/app/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore/otzaria-keystore.jks
          chmod 600 android/app/keystore/otzaria-keystore.jks
          
          # Verify keystore file exists
          echo "Verifying keystore setup..."
          ls -la android/app/keystore/
          
          if [ ! -f android/app/keystore/otzaria-keystore.jks ]; then
            echo "::error::Keystore file was not created!"
            exit 1
          fi
          
          echo "✓ Keystore file exists at: android/app/keystore/otzaria-keystore.jks"
          echo "✓ Environment variables set for Gradle signing"
      
      - run: sudo apt install ninja-build
      
      - name: Gradle performance flags
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties << 'EOF'
          org.gradle.daemon=true
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          kotlin.incremental=true
          EOF

      - name: Ensure Android SDK Platform 36
        run: |
          set -e
          if [ ! -d "${ANDROID_SDK_ROOT}/platforms/android-36" ]; then
            ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36"
          fi
          if [ ! -d "${ANDROID_SDK_ROOT}/build-tools/36.0.0" ]; then
            ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "build-tools;36.0.0"
          fi

      - name: Download library assets for Android FULL bundle
        if: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full_installer/library_db
          curl -L --fail https://github.com/Otzaria/SeforimLibrary/releases/latest/download/seforim.db.zst -o full_installer/library_db/seforim.db.zst
          curl -L --fail https://github.com/Otzaria/otzar-HB_catalog/releases/latest/download/otzar-HB_catalog.db.zst -o full_installer/library_db/otzar-HB_catalog.db.zst
          curl -L --fail https://github.com/Otzaria/otzaria-library/releases/latest/download/talmud_bavli_latest.tar.zst -o full_installer/library_db/talmud_bavli_latest.tar.zst
          curl -L --fail https://github.com/Otzaria/SeforimMagicIndexer/releases/latest/download/lexical.db -o full_installer/library_db/lexical.db
      
      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore/otzaria-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          # Generate the settings .g.dart files: search index + translation catalog.
          dart run tool/generate_search_index.dart
          dart run tool/generate_settings_l10n.dart
          flutter build apk --verbose
          # ניקוי מיידי של קבצים מיותרים מהבנייה (לא ה-APK הסופי)
          rm -rf build/app/intermediates || true
          rm -rf build/app/.transforms || true
          echo "Disk space after intermediate cleanup:"
          df -h
      
      - name: Upload apk
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-android.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Android FULL bundle
        if: true
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="full_installer/otzaria-android-full"
          rm -rf "$BUNDLE_ROOT"
          mkdir -p "$BUNDLE_ROOT/library_db"
          cp build/app/outputs/flutter-apk/app-release.apk "$BUNDLE_ROOT/otzaria-android.apk"
          cp full_installer/library_db/* "$BUNDLE_ROOT/library_db/"
          cat > "$BUNDLE_ROOT/README.txt" << 'EOF'
          Otzaria Android FULL bundle

          This bundle includes the APK and the offline library payload.
          The APK itself cannot preinstall external library files automatically.
          Use this bundle when distributing the APK together with the library payload.
          EOF
          cd full_installer
          zip -r ../otzaria-android-full.zip otzaria-android-full

      - name: Upload Android FULL bundle
        if: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-android-full
          path: otzaria-android-full.zip
      
      - name: Final cleanup
        if: always()
        run: |
          # ניקוי סופי של כל קבצי build וcache (נשמר Cache לריצות הבאות)
          rm -rf build || true
          echo "Disk space after final cleanup:"
          df -h

  build_macos:
    if: github.event_name != 'release' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_macos)
    runs-on: macos-latest
    env:
      # אחסון יציב בתוך ה-workspace כדי למנוע תקלות rename של rustup
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      CARGO_HOME:  ${{ github.workspace }}/.cargo
    steps:
      - name: Clone repository
        uses: actions/checkout@v4.2.2

      - name: Check if commit message is a version tag
        id: check_version
        shell: bash
        run: |
          COMMIT_MESSAGE='${{ github.event.head_commit.message }}'
          if [ -z "$COMMIT_MESSAGE" ]; then
            echo "Commit message not available in event payload; using checked-out HEAD commit message instead"
            COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          fi
          COMMIT_MESSAGE=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "Commit message: $COMMIT_MESSAGE"

          if printf '%s' "$COMMIT_MESSAGE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_version=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Create Google Calendar Credentials
        shell: bash
        run: |
          CLIENT_ID='${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}'
          CLIENT_SECRET='${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}'
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Google Calendar secrets are missing. Please set GOOGLE_CALENDAR_CLIENT_ID and GOOGLE_CALENDAR_CLIENT_SECRET."
            exit 1
          fi
          cat > lib/tools/calendar/services/google_calendar_credentials.dart << EOF
          class GoogleCalendarCredentials {
            static const String clientId = '$CLIENT_ID';
            static const String clientSecret = '$CLIENT_SECRET';
          }
          EOF
          echo "Google Calendar credentials file created"

      # התקנת Rust יציבה לפני flutter build
      - name: Install Rust (stable)
      # מחליף את ההתקנה האוטומטית של cargokit
        uses: dtolnay/rust-toolchain@stable

      - name: Add cargo to PATH & verify toolchain
        run: |
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          rustc -Vv
          cargo -V
          rustup show

      # (רשות אבל מומלץ) קאשינג לספריות cargo כדי לזרז בניות
      - name: Cache cargo registry and git
        uses: actions/cache@v4.2.3
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Prepare Flutter dependencies for macOS release
        run: |
          flutter pub get
          # Generate the settings .g.dart files: search index + translation catalog.
          dart run tool/generate_search_index.dart
          dart run tool/generate_settings_l10n.dart

      - name: Build Flutter macOS app (Universal Binary, with retry)
        run: |
          # Build Universal Binary that supports both Intel (x86_64) and Apple Silicon (arm64)
          # xcodebuild לעיתים נכשל ב-"Internal inconsistency error: never received
          # target ended message" — מירוץ חולף במערכת הבנייה; retry פותר אותו
          set -e
          tries=0
          until [ $tries -ge 3 ]
          do
            if flutter build macos --release --verbose; then
              break
            fi
            tries=$((tries+1))
            echo "flutter build macos failed. retry $tries/3 after short sleep..."
            sleep 15
          done
          if [ $tries -ge 3 ]; then
            echo "::error::flutter build macos failed after 3 attempts"
            exit 1
          fi

      - name: Download library assets for macOS FULL bundle
        if: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full_installer/library_db
          curl -L --fail https://github.com/Otzaria/SeforimLibrary/releases/latest/download/seforim.db.zst -o full_installer/library_db/seforim.db.zst
          curl -L --fail https://github.com/Otzaria/otzar-HB_catalog/releases/latest/download/otzar-HB_catalog.db.zst -o full_installer/library_db/otzar-HB_catalog.db.zst
          curl -L --fail https://github.com/Otzaria/otzaria-library/releases/latest/download/talmud_bavli_latest.tar.zst -o full_installer/library_db/talmud_bavli_latest.tar.zst
          curl -L --fail https://github.com/Otzaria/SeforimMagicIndexer/releases/latest/download/lexical.db -o full_installer/library_db/lexical.db

      - name: Verify Universal Binary
        run: |
          # Dynamically locate the .app bundle (product name may be Hebrew: אוצריא)
          APP_BUNDLE=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          if [ -n "$APP_BUNDLE" ]; then
            APP_BINARY="${APP_BUNDLE%.app}"
            BIN_PATH="${APP_BUNDLE}/Contents/MacOS/$(basename "$APP_BINARY")"
            echo "Found bundle: $APP_BUNDLE"
            if [ -f "$BIN_PATH" ]; then
              echo "Checking architectures in binary:"
              lipo -info "$BIN_PATH" || file "$BIN_PATH"
            else
              echo "Binary not found at $BIN_PATH, listing MacOS dir:"
              ls -la "${APP_BUNDLE}/Contents/MacOS/" || true
            fi
          else
            echo "Warning: No .app bundle found in build/macos/Build/Products/Release"
            find build/macos/Build/Products/Release -maxdepth 2 | head -20
          fi

      - name: Create DMG installer
        run: |
          # Install create-dmg if not available
          if ! command -v create-dmg &> /dev/null; then
            brew install create-dmg
          fi

          # Dynamically locate the .app bundle (product name may be Hebrew: אוצריא)
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in build/macos/Build/Products/Release"
            ls -la build/macos/Build/Products/Release/ || true
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          APP_BUNDLE=$(basename "$APP_PATH")
          DMG_NAME="otzaria-macos.dmg"

          # Create DMG with drag-to-Applications shortcut
          create-dmg \
            --volname "Otzaria Installer" \
            --volicon "${APP_PATH}/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${APP_BUNDLE}" 175 190 \
            --hide-extension "${APP_BUNDLE}" \
            --app-drop-link 425 190 \
            --no-internet-enable \
            "${DMG_NAME}" \
            "${APP_PATH}" \
            || hdiutil create -volname "Otzaria" -srcfolder "${APP_PATH}" -ov -format UDZO "${DMG_NAME}"

      - name: Create macOS update zip
        run: |
          set -euo pipefail
          # zip של ה-.app בלבד, עבור מנגנון העדכון הפנימי (עדכון עצמי ברקע).
          # ditto משמר symlinks, הרשאות ו-resource forks — חובה ל-bundle תקין.
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found for update zip"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" otzaria-macos.zip

      - name: Create macOS FULL portable bundle
        if: true
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd &> /dev/null; then
            brew install zstd
          fi

          BUNDLE_ROOT="full_installer/otzaria-macos-full"
          rm -rf "$BUNDLE_ROOT"
          mkdir -p "$BUNDLE_ROOT/אוצריא"

          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          APP_BUNDLE=$(basename "$APP_PATH")
          # Derive binary name from bundle name (strip .app suffix)
          APP_BINARY="${APP_BUNDLE%.app}"
          cp -R "$APP_PATH" "$BUNDLE_ROOT/$APP_BUNDLE"
          zstd -d -c --long=31 --memory=2048MB full_installer/library_db/seforim.db.zst > "$BUNDLE_ROOT/אוצריא/seforim.db"
          zstd -d -c --long=31 --memory=2048MB full_installer/library_db/otzar-HB_catalog.db.zst > "$BUNDLE_ROOT/אוצריא/otzar-HB_catalog.db"
          zstd -d -c --long=31 --memory=2048MB full_installer/library_db/talmud_bavli_latest.tar.zst | tar -xf - -C "$BUNDLE_ROOT/אוצריא"
          # בלי קובץ הגרסה בתיקייה, בדיקת העדכון הראשונה של האפליקציה מורידה את
          # התלמוד (~440MB) מחדש; ה-sha256 של הארכיון הוא ה-digest שהיא משווה מולו.
          shasum -a 256 full_installer/library_db/talmud_bavli_latest.tar.zst \
            | cut -d' ' -f1 > "$BUNDLE_ROOT/אוצריא/תלמוד בבלי/.version"
          # מילון החיפוש המקורב (lexical.db) — אינו דחוס, מועתק כמות שהוא ליד seforim.db.
          cp full_installer/library_db/lexical.db "$BUNDLE_ROOT/אוצריא/lexical.db"
          # אותו כלל כמו בתלמוד: בלי סימון גרסה המילון (~57MB) יורד מחדש בבדיקה הראשונה.
          shasum -a 256 full_installer/library_db/lexical.db \
            | cut -d' ' -f1 > "$BUNDLE_ROOT/אוצריא/lexical.db.version"
          # קובץ marker שמסמן לאפליקציה שהתיקייה היא ספרייה מצורפת של חבילת FULL.
          # ראה lib/core/app_paths.dart → _detectBundledLibraryPath.
          touch "$BUNDLE_ROOT/אוצריא/.otzaria_bundled_library"

          cat > "$BUNDLE_ROOT/Run Otzaria.command" << EOF
          #!/bin/bash
          set -euo pipefail
          cd "\$(dirname "\$0")"
          exec "./${APP_BUNDLE}/Contents/MacOS/${APP_BINARY}"
          EOF
          chmod +x "$BUNDLE_ROOT/Run Otzaria.command"

          cat > "$BUNDLE_ROOT/README.txt" << 'EOF'
          Otzaria macOS FULL bundle

          This portable bundle includes the app and the bundled library.
          Start the app using Run Otzaria.command so the app can detect the bundled library folder.
          EOF

          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE_ROOT" otzaria-macos-full.zip

      - name: Upload macOS DMG
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-macos.dmg
          path: otzaria-macos.dmg

      - name: Upload macOS update zip
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-macos-update
          path: otzaria-macos.zip

      - name: Upload macOS FULL bundle
        if: true
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-macos-full
          path: otzaria-macos-full.zip

  build_windows_indexed_full:
    if: github.event_name != 'release' && github.event_name != 'pull_request'
    needs: [build_windows, build_linux]
    runs-on: windows-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4.2.2

      - name: Download Windows app bundle
        uses: actions/download-artifact@v4.3.0
        with:
          name: otzaria-windows-zip
          path: indexed-inputs/windows

      - name: Download indexed installer tools
        uses: actions/download-artifact@v4.3.0
        with:
          name: otzaria-windows-indexed-installer-tools
          path: indexed-inputs/tools

      - name: Download indexed library manifest
        uses: actions/download-artifact@v4.3.0
        with:
          name: otzaria-library-full-indexed-manifest
          path: indexed-inputs/library

      - name: Install Inno Setup
        shell: pwsh
        run: |
          .\installer\install_inno_setup.ps1
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw 'ISCC.exe not found after installation' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare indexed FULL bootstrap inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem indexed-inputs\windows\*.zip | Select-Object -First 1
          if (-not $zip) { throw 'Windows app bundle is missing' }
          $releaseDir = 'build\windows\x64\runner\Release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $releaseDir -Force
          Remove-Item "$releaseDir\portable.marker" -Force -ErrorAction SilentlyContinue

          Copy-Item indexed-inputs\tools\zstd.exe installer\zstd.exe -Force
          Copy-Item indexed-inputs\tools\7za.exe installer\7za.exe -Force
          $manifests = @(Get-ChildItem indexed-inputs\library\*library-full-indexed*.manifest.json)
          if ($manifests.Count -ne 1) {
            throw "Expected one indexed library manifest, found $($manifests.Count)"
          }
          $manifest = $manifests[0]
          Copy-Item $manifest.FullName installer\indexed_library.manifest.json -Force

          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' `
            -OutFile installer\MicrosoftEdgeWebview2Setup.exe

      - name: Build indexed FULL bootstrap installer
        shell: pwsh
        run: |
          $version = ((Get-Content pubspec.yaml | Select-String '^version:').Line -split '\s+')[1].Split('+')[0]
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            $releaseTag = $version
          } else {
            $releaseTag = "$version+$env:GITHUB_RUN_NUMBER"
          }
          $tagDefine = '/DIndexedReleaseTag="' + $releaseTag + '"'
          & "$env:ISCC" '/DIndexedSplitFull=1' $tagDefine installer\otzaria_full.iss
          if ($LASTEXITCODE -ne 0) {
            throw 'Indexed FULL bootstrap installer build failed'
          }

      - name: Upload Windows indexed FULL bootstrap installer
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-windows-installer-full-indexed
          path: installer/otzaria-*-windows-full-indexed.exe

  create_release:
    if: >-
      !cancelled() &&
      github.event_name != 'release' &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.create_release) &&
      inputs.build_windows && inputs.build_linux &&
      inputs.build_android && inputs.build_macos &&
      needs.build_windows.result == 'success' &&
      needs.build_linux.result == 'success' &&
      needs.build_android.result == 'success' &&
      needs.build_macos.result == 'success' &&
      needs.build_windows_indexed_full.result == 'success' &&
      (needs.build_windows_arm64.result == 'success' || needs.build_windows_arm64.result == 'skipped')
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      url: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
    needs: [build_windows, build_windows_arm64, build_linux, build_android, build_macos, build_windows_indexed_full]
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4.2.2
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: artifacts
      
      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Validate semver format
          if ! echo "$VERSION" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::Version '$VERSION' is not valid semver format"
            exit 1
          fi
          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "title=Otzaria $VERSION" >> $GITHUB_OUTPUT
          else
            # Use proper semver pre-release format with dots instead of hyphens
            BRANCH_NAME="${{ github.ref_name }}"
            # Replace any invalid characters in branch name for semver
            CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^A-Za-z0-9.-]/-/g')
            echo "tag=$VERSION+${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "title=Otzaria $VERSION (Preview from ${{ github.ref_name }})" >> $GITHUB_OUTPUT
          fi


      - name: Get commit message
        id: commit
        run: echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      - name: Organize release files
        run: |
          mkdir -p release-files
          
          # Windows installer (regular)
          if [ -d "artifacts/otzaria-windows-installer" ]; then
            cp artifacts/otzaria-windows-installer/*.exe release-files/ || true
          fi

          # Windows installer (full)
          if [ -d "artifacts/otzaria-windows-installer-full" ]; then
            cp artifacts/otzaria-windows-installer-full/*.exe release-files/ || true
          fi

          # Windows indexed FULL bootstrap (app only; library parts stay separate)
          if [ -d "artifacts/otzaria-windows-installer-full-indexed" ]; then
            cp artifacts/otzaria-windows-installer-full-indexed/*.exe release-files/ || true
          fi

          # Windows ZIP
          if [ -d "artifacts/otzaria-windows-zip" ]; then
            cp artifacts/otzaria-windows-zip/*.zip release-files/ || true
          fi

          # Windows ARM64 installer + ZIP
          if [ -d "artifacts/otzaria-windows-arm64-installer" ]; then
            cp artifacts/otzaria-windows-arm64-installer/*.exe release-files/ || true
          fi
          if [ -d "artifacts/otzaria-windows-arm64-zip" ]; then
            cp artifacts/otzaria-windows-arm64-zip/*.zip release-files/ || true
          fi

          # Linux DEB package
          if [ -d "artifacts/otzaria-linux-deb" ]; then
            cp artifacts/otzaria-linux-deb/*.deb release-files/ || true
          fi
          
          # Linux RPM package  
          if [ -d "artifacts/otzaria-linux-rpm" ]; then
            cp artifacts/otzaria-linux-rpm/*.rpm release-files/ || true
          fi
          
          # Linux raw build (fallback)
          if [ -d "artifacts/otzaria-linux-raw" ] && [ ! -f release-files/*.deb ]; then
            cd artifacts/otzaria-linux-raw
            zip -r ../../release-files/otzaria-linux-raw.zip *
            cd ../..
          fi

          # Linux DEB (arm64)
          if [ -d "artifacts/otzaria-linux-deb-arm64" ]; then
            cp artifacts/otzaria-linux-deb-arm64/*.deb release-files/ || true
          fi

          # Linux raw build arm64 (fallback, כמו ב-x86_64)
          if [ -d "artifacts/otzaria-linux-raw-arm64" ] && ! ls release-files/*arm64.deb >/dev/null 2>&1; then
            cd artifacts/otzaria-linux-raw-arm64
            zip -r ../../release-files/otzaria-linux-raw-arm64.zip *
            cd ../..
          fi

          # Linux RPM (arm64)
          if [ -d "artifacts/otzaria-linux-rpm-arm64" ]; then
            cp artifacts/otzaria-linux-rpm-arm64/*.rpm release-files/ || true
          fi

          # Linux FULL bundle (arm64)
          if [ -d "artifacts/otzaria-linux-full-arm64" ]; then
            cp artifacts/otzaria-linux-full-arm64/*.tar.gz release-files/ || true
          fi

          # Linux FULL bundle
          if [ -d "artifacts/otzaria-linux-full" ]; then
            cp artifacts/otzaria-linux-full/*.tar.gz release-files/ || true
          fi

          # Cross-platform indexed FULL library (multipart; every part is below 2 GiB)
          if [ -d "artifacts/otzaria-library-full-indexed" ]; then
            cp artifacts/otzaria-library-full-indexed/* release-files/ || true
          fi
          
          # Android APK
          if [ -d "artifacts/otzaria-android.apk" ]; then
            cp artifacts/otzaria-android.apk/*.apk release-files/ || true
          fi

          # Android FULL bundle
          if [ -d "artifacts/otzaria-android-full" ]; then
            cp artifacts/otzaria-android-full/*.zip release-files/ || true
          fi
          
          # macOS DMG
          if [ -d "artifacts/otzaria-macos.dmg" ]; then
            cp artifacts/otzaria-macos.dmg/*.dmg release-files/ || true
          fi

          # macOS update zip (משמש את מנגנון העדכון הפנימי)
          if [ -d "artifacts/otzaria-macos-update" ]; then
            cp artifacts/otzaria-macos-update/*.zip release-files/ || true
          fi

          # macOS FULL bundle
          if [ -d "artifacts/otzaria-macos-full" ]; then
            cp artifacts/otzaria-macos-full/*.zip release-files/ || true
          fi
          
          # List files for debugging
          echo "Release files:"
          ls -la release-files/

      - name: Generate release notes
        env:
          RELEASE_TITLE: ${{ steps.version.outputs.title }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}"

          windows_installers=()
          windows_arm64_installers=()
          windows_full=()
          windows_indexed_full=()
          android_apk=()
          android_full=()
          linux_deb=()
          linux_rpm=()
          linux_portable=()
          linux_full=()
          indexed_library_parts=()
          indexed_library_support=()
          mac_dmg=()
          mac_full=()

          emit_link_group() {
            local label="$1"
            shift

            for file in "$@"; do
              printf -- "- [%s](%s/%s) - \`%s\`\n" "$label" "$RELEASE_URL" "$file" "$file" >> release-body.md
            done
          }

          for path in release-files/*; do
            [ -f "$path" ] || continue
            file=$(basename "$path")
            lower=$(printf '%s' "$file" | tr '[:upper:]' '[:lower:]')

            case "$lower" in
              *windows-full-indexed*.exe)
                windows_indexed_full+=("$file")
                ;;
              *library-full-indexed*.part-*)
                indexed_library_parts+=("$file")
                ;;
              *library-full-indexed*.manifest.json)
                indexed_library_support+=("$file")
                ;;
              assemble_split_asset.sh|assemble_split_asset.ps1)
                indexed_library_support+=("$file")
                ;;
              *windows-full*.exe)
                windows_full+=("$file")
                ;;
              *windows-arm64*.exe)
                windows_arm64_installers+=("$file")
                ;;
              *windows*.exe)
                windows_installers+=("$file")
                ;;
              *windows*.zip)
                # ה-ZIP הנייד נשאר נכס ב-release (מנגנון העדכון של התקנות
                # ניידות מוריד אותו), אבל לא מקושר בגוף ה-release — התקנה
                # ניידת חדשה נעשית דרך האפשרות במתקין הרגיל.
                echo "Keeping $file as an unlisted release asset (portable update channel)"
                ;;
              *android-full*.zip)
                android_full+=("$file")
                ;;
              *.apk)
                android_apk+=("$file")
                ;;
              *linux-full*.tar.gz|*linux-full*.tar.*)
                linux_full+=("$file")
                ;;
              *.deb)
                linux_deb+=("$file")
                ;;
              *.rpm)
                linux_rpm+=("$file")
                ;;
              *linux-raw*.zip|*linux*.zip)
                linux_portable+=("$file")
                ;;
              *.dmg)
                mac_dmg+=("$file")
                ;;
              *macos-full*.zip)
                mac_full+=("$file")
                ;;
              *)
                echo "Ignoring non-user-facing release file in notes: $file"
                ;;
            esac
          done

          safe_commit_message=$(printf '%s' "$COMMIT_MESSAGE" \
            | tr '\r\n' ' ' \
            | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//' \
            | sed \
                -e 's/\\/\\\\/g' \
                -e 's/`/\\`/g' \
                -e 's/\*/\\*/g' \
                -e 's/_/\\_/g' \
                -e 's/\[/\\[/g' \
                -e 's/\]/\\]/g')

          cat > release-body.md <<EOF
          # ${RELEASE_TITLE}

          > **מה להוריד?**
          >
          > אם אתם רק מעדכנים את האפליקציה, ברוב המקרים תרצו את **גרסת תוכנה בלבד**.
          >
          > אם אתם צריכים חבילה להפצה או להתקנה לא־מקוונת, בחרו **גרסת ספרייה מלאה (FULL)**.
          >
          > את הספרייה מורידים מתוך התוכנה עצמה לאחר ההתקנה, או על־ידי הורדת המתקין המלא (FULL) להתקנה במחשב ללא אינטרנט.

          EOF

          if [ ${#indexed_library_parts[@]} -gt 0 ]; then
            printf "## ספרייה מלאה עם אינדקס מוכן\n\n" >> release-body.md
            emit_link_group "מתקין אוטומטי לווינדוס" "${windows_indexed_full[@]}"
            emit_link_group "חלק מחבילת הספרייה המאונדקסת" "${indexed_library_parts[@]}"
            emit_link_group "קובץ אימות/סקריפט הרכבה" "${indexed_library_support[@]}"
            cat >> release-body.md <<'EOF'

          **התקנה מקוונת בווינדוס:** מורידים רק את המתקין האוטומטי; הוא יוריד, יאמת ויתקין את הספרייה והאינדקס.

          **התקנה לא־מקוונת בווינדוס:** מורידים את המתקין ואת כל החלקים לאותה תיקייה ומפעילים את המתקין. הוא מכיל את רשימת הקבצים, יזהה אותם ויבצע את כל העבודה ללא רשת.

          להרכבה ידנית במערכות אחרות מורידים את כל החלקים, את ה־manifest ואת אחד מסקריפטי ההרכבה:

          ```bash
          bash assemble_split_asset.sh otzaria-*-library-full-indexed.tar.zst.manifest.json
          tar --zstd -xf otzaria-*-library-full-indexed.tar.zst
          ```

          לאחר חילוץ ידני בוחרים באוצריא את תיקיית `books`; תיקיית `index` הצמודה מזוהה אוטומטית. ב־PowerShell ניתן להרכיב באמצעות `assemble_split_asset.ps1`. כל חלק קטן מ־2 GiB ומאומת ב־SHA-256.

          EOF
          fi

          if [ ${#windows_installers[@]} -gt 0 ] || [ ${#windows_arm64_installers[@]} -gt 0 ] || [ ${#windows_full[@]} -gt 0 ] || [ ${#windows_indexed_full[@]} -gt 0 ]; then
            printf "## ווינדוס\n\n" >> release-body.md

            if [ ${#windows_installers[@]} -gt 0 ]; then
              printf "### גרסת תוכנה בלבד\n\n" >> release-body.md
              emit_link_group "מתקין לווינדוס (שדרוג מגרסה קיימת מותקן אוטומטית ברקע; כולל אפשרות התקנה ניידת)" "${windows_installers[@]}"
              emit_link_group "מתקין למחשבי ARM (מעבדי Snapdragon; במחשב רגיל הורידו את המתקין שמעל)" "${windows_arm64_installers[@]}"
              printf "\n" >> release-body.md
            fi

            if [ ${#windows_full[@]} -gt 0 ]; then
              printf "### גרסת ספרייה מלאה\n\n" >> release-body.md
              emit_link_group "חבילה מלאה לווינדוס" "${windows_full[@]}"
              printf "\n" >> release-body.md
            fi
          fi

          if [ ${#android_apk[@]} -gt 0 ] || [ ${#android_full[@]} -gt 0 ]; then
            printf "## אנדרואיד\n\n" >> release-body.md

            if [ ${#android_apk[@]} -gt 0 ]; then
              printf "### גרסת תוכנה בלבד\n\n" >> release-body.md
              emit_link_group "APK לאנדרואיד" "${android_apk[@]}"
              printf "\n" >> release-body.md
            fi

            if [ ${#android_full[@]} -gt 0 ]; then
              printf "### גרסת ספרייה מלאה\n\n" >> release-body.md
              emit_link_group "חבילה מלאה לאנדרואיד" "${android_full[@]}"
              printf "\n> **הבהרה:** חבילת ה־FULL לאנדרואיד כוללת את ה־APK יחד עם חומרי הספרייה, ומיועדת להפצה או להתקנה ידנית.\n\n" >> release-body.md
            fi
          fi

          if [ ${#linux_deb[@]} -gt 0 ] || [ ${#linux_rpm[@]} -gt 0 ] || [ ${#linux_portable[@]} -gt 0 ] || [ ${#linux_full[@]} -gt 0 ]; then
            printf "## לינוקס\n\n" >> release-body.md

            if [ ${#linux_deb[@]} -gt 0 ] || [ ${#linux_rpm[@]} -gt 0 ] || [ ${#linux_portable[@]} -gt 0 ]; then
              printf "### גרסת תוכנה בלבד\n\n" >> release-body.md
              emit_link_group "חבילת DEB ללינוקס" "${linux_deb[@]}"
              emit_link_group "חבילת RPM ללינוקס" "${linux_rpm[@]}"
              emit_link_group "גרסה ניידת ללינוקס" "${linux_portable[@]}"
              if [ ${#linux_portable[@]} -gt 0 ]; then
                printf "\n> **שימו לב:** הגרסה הניידת שומרת מעתה את כל הנתונים בתיקיית \`otzaria_data\` שליד התוכנה — ניידות אמיתית, אפשר להריץ מהתקן נייד.\n" >> release-body.md
              fi
              printf "\n" >> release-body.md
            fi

            if [ ${#linux_full[@]} -gt 0 ]; then
              printf "### גרסת ספרייה מלאה\n\n" >> release-body.md
              emit_link_group "חבילה מלאה ללינוקס" "${linux_full[@]}"
              printf "\n" >> release-body.md
            fi

          fi

          if [ ${#mac_dmg[@]} -gt 0 ] || [ ${#mac_full[@]} -gt 0 ]; then
            printf "## מק\n\n" >> release-body.md

            if [ ${#mac_dmg[@]} -gt 0 ]; then
              printf "### גרסת תוכנה בלבד\n\n" >> release-body.md
              emit_link_group "מתקין DMG למק" "${mac_dmg[@]}"
              printf "\n" >> release-body.md
            fi

            if [ ${#mac_full[@]} -gt 0 ]; then
              printf "### גרסת ספרייה מלאה\n\n" >> release-body.md
              emit_link_group "חבילה מלאה למק" "${mac_full[@]}"
              printf "\n" >> release-body.md
            fi
          fi

          cat >> release-body.md <<EOF
          <details>
          <summary>מידע טכני</summary>

          - נבנה מ־commit ${GITHUB_SHA::7}
          - תיאור commit: ${safe_commit_message}
          - ענף: ${{ github.ref_name }}

          </details>
          EOF

          echo "Generated release notes:"
          cat release-body.md
      
      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: release-files/*
          body_path: release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger_google_play_deploy:
    if: "!cancelled() && needs.check_version.outputs.is_version == 'true' && needs.build_android.result == 'success' && github.event_name != 'release' && github.event_name != 'pull_request'"
    needs: [check_version, build_android]
    uses: ./.github/workflows/deploy-google-play.yml
    secrets: inherit

  # --- הכרזה על גרסה שפורסמה ---
  announce_release:
    needs: [create_release]
    if: >-
      always() &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && inputs.announce_release &&
        needs.create_release.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies for webhook script
        run: pip install bs4 requests pyluach yemot-api

      - name: Load release assets for a manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create_release.outputs.tag }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            | jq '{release: .}' > "$RUNNER_TEMP/release-event.json"

      - name: Run announcement script (Forum + Yemot)
        env:
          # פרטי ה-Release נלקחים מאירוע ה-Webhook של GitHub
          RELEASE_TAG: ${{ github.event.release.tag_name || needs.create_release.outputs.tag }}
          RELEASE_NAME: ${{ github.event.release.name || needs.create_release.outputs.title }}
          RELEASE_URL: ${{ github.event.release.html_url || needs.create_release.outputs.url }}
          GITHUB_EVENT_PATH: ${{ github.event_name == 'workflow_dispatch' && format('{0}/release-event.json', runner.temp) || github.event_path }}

          # סודות להתחברות לשירותים החיצוניים
          USER_NAME:  ${{ secrets.USER_NAME }}
          PASSWORD:   ${{ secrets.PASSWORD }}
          TOKEN_YEMOT: ${{ secrets.TOKEN_YEMOT }}
        run: |
          python webhooks/main.py
