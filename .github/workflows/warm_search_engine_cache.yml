name: Warm Search Engine Cache

# בונה את ספריית מנוע החיפוש ושומר אותה ב-cache של ענף הבסיס. cache שנשמר
# בריצת PR משויך ל-ref של אותו PR ואינו נגיש ל-PRים אחרים — רק כאן הוא נוצר.
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  warm:
    name: Build & cache search engine on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache search engine library
        id: engine-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache/hosted/pub.dev/otzaria_search_engine-*/rust/target/release/libsearch_engine.so
          key: ${{ runner.os }}-search-engine-lib-${{ hashFiles('pubspec.lock') }}

      - name: Build search engine native library
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          pkg_root=$(jq -r '.packages[] | select(.name == "otzaria_search_engine") | .rootUri' .dart_tool/package_config.json)
          pkg_root=${pkg_root#file://}
          case "$pkg_root" in
            /*) ;;
            *) pkg_root=".dart_tool/$pkg_root" ;;
          esac
          echo "Building search engine at: $pkg_root"
          cargo build --release --manifest-path "$pkg_root/rust/Cargo.toml"
