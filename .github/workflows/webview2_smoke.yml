name: Windows WebView2 Smoke

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/webview2_smoke.yml"
      - "integration_test/webview_render_check_test.dart"
      - "lib/core/window_listener.dart"
      # תשתית החלון: כל מה שנוגע בבקר, ב-scope או במחזור החיים של החלון
      # משפיע ישירות על מחזור החיים של ה-WebView שמתארח בו.
      - "lib/core/windowing/**"
      - "lib/main.dart"
      # רצועת הטאבים ומודל הטאבים מארחים את חלוניות ה-WebView של התוספים.
      - "lib/navigation/**"
      - "lib/tabs/**"
      - "lib/plugins/**"
      - "lib/settings/dialogs/change_location_dialog.dart"
      - "lib/settings/tabs/system_settings_tab.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "windows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webview2-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Live WebView2 lifecycle
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        shell: pwsh
        run: |
          # תלות git על מונורפו נכשלת ב-checkout ("Filename too long") ומשאירה
          # עץ חלקי, ואז הבנייה נופלת על קובץ חסר במקום על ה-clone.
          git config --global core.longpaths true
          flutter pub get --enforce-lockfile

      - name: Run live WebView2 smoke test
        run: >-
          flutter test integration_test/webview_render_check_test.dart
          -d windows --timeout 3m
