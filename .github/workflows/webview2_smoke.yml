name: Windows WebView2 Smoke

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/webview2_smoke.yml"
      - "integration_test/webview_render_check_test.dart"
      - "lib/core/window_listener.dart"
      # תשתית החלון: כל מה שנוגע בבקר, ב-scope או במחזור החיים של החלון
      # משפיע ישירות על מחזור החיים של ה-WebView שמתארח בו.
      - "lib/core/windowing/**"
      - "lib/main.dart"
      # רצועת הטאבים ומודל הטאבים מארחים את חלוניות ה-WebView של התוספים.
      - "lib/navigation/**"
      - "lib/tabs/**"
      - "lib/plugins/**"
      - "lib/settings/dialogs/change_location_dialog.dart"
      - "lib/settings/tabs/system_settings_tab.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "windows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webview2-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Live WebView2 lifecycle
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        shell: pwsh
        run: |
          # תלות git על מונורפו נכשלת ב-checkout ("Filename too long") ומשאירה
          # עץ חלקי, ואז הבנייה נופלת על קובץ חסר במקום על ה-clone.
          git config --global core.longpaths true
          flutter pub get --enforce-lockfile

      - name: Check lifecycle fixture formatting
        shell: pwsh
        run: |
          $fixture = 'integration_test/webview_render_check_test.dart'
          dart format --set-exit-if-changed $fixture
          $formatExitCode = $LASTEXITCODE
          if ($formatExitCode -ne 0) {
            $output = Join-Path $env:RUNNER_TEMP 'webview2-smoke-diagnostics'
            New-Item -ItemType Directory -Force $output | Out-Null
            Copy-Item -LiteralPath $fixture -Destination (Join-Path $output 'webview_render_check_test.formatted.dart')
          }
          exit $formatExitCode

      - name: Analyze lifecycle fixture
        shell: pwsh
        run: flutter analyze --no-pub integration_test/webview_render_check_test.dart

      - name: Record native log baseline
        continue-on-error: true
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'webview2-smoke-diagnostics'
          New-Item -ItemType Directory -Force $output | Out-Null
          $runner = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Debug'
          $paths = [ordered]@{
            roaming = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'otzaria/logs/errors.txt'
            portable = Join-Path $runner 'otzaria_data/logs/errors.txt'
          }
          $baseline = [ordered]@{
            sha = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            capturedAtUtc = [DateTime]::UtcNow.ToString('o')
            portableMarker = Join-Path $runner 'portable.marker'
            portableMarkerExists = Test-Path -LiteralPath (Join-Path $runner 'portable.marker')
            logs = @()
          }
          $hash = [Security.Cryptography.SHA256]::Create()
          foreach ($entry in $paths.GetEnumerator()) {
            $log = [ordered]@{ name = $entry.Key; path = $entry.Value; exists = $false; sizeBytes = 0 }
            try {
              $log.exists = Test-Path -LiteralPath $log.path -PathType Leaf
              if ($log.exists) {
                $reader = [IO.BinaryReader]::new([IO.File]::Open($log.path, 'Open', 'Read', 'ReadWrite'))
                try { $bytes = $reader.ReadBytes([int]$reader.BaseStream.Length) }
                finally { $reader.Dispose() }
                $log.sizeBytes = $bytes.LongLength
                $log['sha256'] = [Convert]::ToBase64String($hash.ComputeHash($bytes))
                $log['creationTimeUtc'] = (Get-Item -LiteralPath $log.path).CreationTimeUtc.ToString('o')
              }
            } catch {
              $log['error'] = $_.Exception.Message
              Write-Warning "Cannot read native log baseline: $($log.path): $_"
            }
            $baseline.logs += $log
            Write-Host "Native log baseline: $($log.path); exists=$($log.exists); bytes=$($log.sizeBytes)"
          }
          $hash.Dispose()
          $baseline | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $output 'baseline.json')

      - name: Run live WebView2 smoke test
        id: webview_smoke
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'webview2-smoke-diagnostics'
          New-Item -ItemType Directory -Force $output | Out-Null
          flutter test integration_test/webview_render_check_test.dart -d windows --timeout 3m 2>&1 |
            Tee-Object -FilePath (Join-Path $output 'lifecycle-smoke.log')
          $testExitCode = $LASTEXITCODE
          exit $testExitCode

      - name: Collect native log additions
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          SMOKE_OUTCOME: ${{ steps.webview_smoke.outcome }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'webview2-smoke-diagnostics'
          New-Item -ItemType Directory -Force $output | Out-Null
          $baselinePath = Join-Path $output 'baseline.json'
          $runner = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Debug'
          $paths = [ordered]@{
            roaming = Join-Path ([Environment]::GetFolderPath('ApplicationData')) 'otzaria/logs/errors.txt'
            portable = Join-Path $runner 'otzaria_data/logs/errors.txt'
          }
          $report = [ordered]@{
            sha = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            smokeOutcome = $env:SMOKE_OUTCOME
            collectedAtUtc = [DateTime]::UtcNow.ToString('o')
            baselineAvailable = $false
            portableMarkerExists = Test-Path -LiteralPath (Join-Path $runner 'portable.marker')
            logs = @()
          }
          try {
            if (Test-Path -LiteralPath $baselinePath) {
              $baseline = Get-Content -Raw -LiteralPath $baselinePath | ConvertFrom-Json
              if ($baseline.logs.Count -ne $paths.Count -or $baseline.sha -ne $env:GITHUB_SHA -or
                  $baseline.runId -ne $env:GITHUB_RUN_ID -or $baseline.runAttempt -ne $env:GITHUB_RUN_ATTEMPT) {
                throw 'Baseline does not describe this workflow run.'
              }
              $beforeLogs = $baseline.logs
              $report.baselineAvailable = $true
            }
          } catch {
            $report['baselineError'] = $_.Exception.Message
            Write-Warning "Cannot read native log baseline: $_"
          }
          if (-not $report.baselineAvailable) {
            $report['note'] = 'Baseline unavailable; collected logs are full snapshots, not verified additions.'
            $beforeLogs = foreach ($entry in $paths.GetEnumerator()) {
              [pscustomobject]@{ name = $entry.Key; path = $entry.Value; sizeBytes = $null }
            }
          }
          $hash = [Security.Cryptography.SHA256]::Create()
          foreach ($before in $beforeLogs) {
            $log = [ordered]@{
              path = $before.path
              initialSizeBytes = $before.sizeBytes
              currentSizeBytes = $null
              offsetBytes = 0
              copiedBytes = 0
              status = 'missing'
            }
            try {
              if (Test-Path -LiteralPath $before.path -PathType Leaf) {
                $reader = [IO.BinaryReader]::new([IO.File]::Open($before.path, 'Open', 'Read', 'ReadWrite'))
                try { $bytes = $reader.ReadBytes([int]$reader.BaseStream.Length) }
                finally { $reader.Dispose() }
                $log.currentSizeBytes = $bytes.LongLength
                $log['creationTimeUtc'] = (Get-Item -LiteralPath $before.path).CreationTimeUtc.ToString('o')
                if (-not $report.baselineAvailable) {
                  $log.status = 'baseline_unavailable_full_snapshot'
                } elseif ($before.error) {
                  $log.status = 'baseline_read_error_full_snapshot'
                } elseif (-not $before.exists) {
                  $log.status = 'created'
                } elseif ($bytes.LongLength -lt $before.sizeBytes) {
                  $log.status = 'truncated_full_snapshot'
                } elseif ([Convert]::ToBase64String($hash.ComputeHash($bytes, 0, [int]$before.sizeBytes)) -ne $before.sha256) {
                  $log.status = 'replaced_or_rewritten_full_snapshot'
                } else {
                  $log.offsetBytes = $before.sizeBytes
                  $log.status = if ($bytes.LongLength -eq $before.sizeBytes) { 'unchanged' } else { 'appended' }
                }
                $log.copiedBytes = $bytes.LongLength - $log.offsetBytes
                if ($log.copiedBytes -gt 0) {
                  $log['artifactFile'] = "$($before.name)-errors.txt"
                  $file = [IO.File]::Create((Join-Path $output $log.artifactFile))
                  try { $file.Write($bytes, [int]$log.offsetBytes, [int]$log.copiedBytes) }
                  finally { $file.Dispose() }
                }
              }
            } catch {
              $log.status = 'collection_error'
              $log['error'] = $_.Exception.Message
              Write-Warning "Cannot collect native log: $($before.path): $_"
            }
            $report.logs += $log
            Write-Host "Native log: $($log.path); status=$($log.status); copiedBytes=$($log.copiedBytes)"
          }
          $hash.Dispose()
          $report | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $output 'collection.json')

      - name: Upload native log diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: webview2-native-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webview2-smoke-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload native binaries and symbols on smoke failure
        if: ${{ always() && steps.webview_smoke.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: webview2-native-symbols-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/windows/x64/runner/**/*.exe
            build/windows/x64/runner/**/*.dll
            build/windows/x64/runner/**/*.pdb
            build/windows/x64/plugins/**/*.exe
            build/windows/x64/plugins/**/*.dll
            build/windows/x64/plugins/**/*.pdb
          if-no-files-found: ignore
          retention-days: 7
