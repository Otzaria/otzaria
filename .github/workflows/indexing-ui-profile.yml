name: Indexing UI source cleanliness probe

on:
  pull_request:
    paths:
      - '.github/workflows/indexing-ui-profile.yml'

permissions:
  contents: read

concurrency:
  group: indexing-ui-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-probe:
    name: Diagnose Windows checkout and dependency generation
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      BASELINE_SHA: 0006cf887aff520675dc49e6d4737f1b04eb3af6
      CANDIDATE_SHA: e389e714d35fbfc2d7ad7023a1247a78b9d99fcf
    steps:
      - name: Prepare diagnostic output and long paths
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Could not enable Git long paths.' }
          $probeRoot = Join-Path $env:RUNNER_TEMP 'indexing-ui-source-probe'
          New-Item -ItemType Directory -Path $probeRoot | Out-Null
          "PROBE_ROOT=$probeRoot" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Check out the baseline
        uses: actions/checkout@v7.0.1
        with:
          repository: Otzaria/otzaria
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false

      - name: Check out the candidate
        uses: actions/checkout@v7.0.1
        with:
          repository: Otzaria/otzaria
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Inspect source before and after pinned dependency resolution
        run: |
          function Save-SourceState([string]$Side, [string]$Stage) {
            $checkoutPath = Join-Path $env:GITHUB_WORKSPACE $Side
            $prefix = Join-Path $env:PROBE_ROOT "$Side-$Stage"
            & git -C $checkoutPath rev-parse HEAD | Set-Content "$prefix-head.txt"
            & git -C $checkoutPath status --porcelain=v1 --untracked-files=all | Set-Content "$prefix-status.txt"
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $Side source status." }
            & git -C $checkoutPath diff --no-ext-diff --raw | Set-Content "$prefix-raw.txt"
            & git -C $checkoutPath diff --no-ext-diff --numstat | Set-Content "$prefix-numstat.txt"
            & git -C $checkoutPath diff --no-ext-diff | Set-Content "$prefix-diff.patch"
            & git -C $checkoutPath diff --cached --no-ext-diff | Set-Content "$prefix-staged.patch"
            & git -C $checkoutPath config --show-origin --get-regexp 'core\.(autocrlf|eol|filemode)' | Set-Content "$prefix-config.txt"
            if ($LASTEXITCODE -gt 1) { throw "Cannot inspect $Side Git settings." }
          }
          foreach ($side in @('baseline', 'candidate')) {
            Save-SourceState $side 'before-pub'
            Push-Location (Join-Path $env:GITHUB_WORKSPACE $side)
            try {
              & flutter pub get --enforce-lockfile 2>&1 | Tee-Object -FilePath (Join-Path $env:PROBE_ROOT "$side-pub.log")
              $pubExitCode = $LASTEXITCODE
            } finally {
              Pop-Location
              Save-SourceState $side 'after-pub'
            }
            if ($pubExitCode -ne 0) { throw "Pinned dependency resolution failed for $side." }
          }
          exit 0

      - name: Identify the scope of this diagnostic run
        if: always()
        run: |
          @(
            '## Windows source cleanliness diagnostic',
            '',
            'This run only inspects source status before and after pinned dependency resolution.',
            'No application build or performance measurement was attempted.',
            'The original comparison failed before search.while_indexing; its partial data are not a valid comparison.',
            'The performance runner and its dirty-worktree rejection are unchanged.'
          ) -join "`n" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: indexing-ui-source-probe-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/indexing-ui-source-probe/**
