name: Indexing UI profile comparison

on:
  pull_request:
    paths:
      - '.github/workflows/indexing-ui-profile.yml'

permissions:
  contents: read

concurrency:
  group: indexing-ui-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  paired-profile:
    name: Baseline and candidate on one Windows runner
    runs-on: windows-2025
    timeout-minutes: 80
    defaults:
      run:
        shell: pwsh
    env:
      BASELINE_SHA: 0006cf887aff520675dc49e6d4737f1b04eb3af6
      CANDIDATE_SHA: e389e714d35fbfc2d7ad7023a1247a78b9d99fcf
      PAIR_HARDWARE_ID: github-hosted-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate the fixed source revisions
        run: |
          foreach ($revision in @($env:BASELINE_SHA, $env:CANDIDATE_SHA)) {
            if ($revision -notmatch '^[0-9a-f]{40}$') {
              throw 'Both source revisions must be full commit SHAs.'
            }
          }
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not enable Git long paths.'
          }
          $pairRoot = Join-Path $env:RUNNER_TEMP 'indexing-ui-profile'
          "PAIR_ROOT=$pairRoot" | Add-Content -LiteralPath $env:GITHUB_ENV
          New-Item -ItemType Directory -Path $pairRoot | Out-Null

      - name: Check out the baseline
        uses: actions/checkout@v7.0.1
        with:
          repository: Otzaria/otzaria
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false

      - name: Check out the candidate
        uses: actions/checkout@v7.0.1
        with:
          repository: Otzaria/otzaria
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install Rust for native source builds
        uses: dtolnay/rust-toolchain@stable

      - name: Measure the baseline
        timeout-minutes: 35
        working-directory: baseline
        run: |
          ./tool/perf_probe/run_perf_probe.ps1 -Mode profile -CacheState cold `
            -Warmup 1 -Repetitions 3 -Launches 2 -TimeoutSeconds 300 `
            -HardwareId $env:PAIR_HARDWARE_ID `
            -OutputDirectory (Join-Path $env:PAIR_ROOT 'baseline')
          exit $LASTEXITCODE

      - name: Free the completed baseline build artifacts
        run: |
          foreach ($relative in @('baseline/build', 'baseline/.dart_tool/hooks_runner/shared')) {
            $ownedPath = Join-Path $env:GITHUB_WORKSPACE $relative
            if (Test-Path -LiteralPath $ownedPath) {
              Remove-Item -LiteralPath $ownedPath -Recurse -Force
            }
          }

      - name: Measure and compare the candidate
        timeout-minutes: 35
        working-directory: candidate
        run: |
          ./tool/perf_probe/run_perf_probe.ps1 -Mode profile -CacheState cold `
            -Warmup 1 -Repetitions 3 -Launches 2 -TimeoutSeconds 300 `
            -HardwareId $env:PAIR_HARDWARE_ID `
            -OutputDirectory (Join-Path $env:PAIR_ROOT 'candidate') `
            -Baseline (Join-Path $env:PAIR_ROOT 'baseline')
          exit $LASTEXITCODE

      - name: Summarize measurement coverage
        if: always()
        run: |
          $summary = @(
            '## Indexing UI profile observations',
            '',
            'Each side requests 2 launches with 3 measured repetitions and 1 warmup per launch.',
            'A completed search without confirmed indexing overlap remains skipped.',
            '',
            '| Side | Search status | Measured | Skipped | Frames | Truncated iterations |',
            '|---|---|---:|---:|---:|---:|'
          )
          foreach ($side in @('baseline', 'candidate')) {
            $reportPath = Join-Path $env:PAIR_ROOT "$side/report.json"
            if (-not (Test-Path -LiteralPath $reportPath)) {
              $summary += "| $side | report unavailable | — | — | — | — |"
              Write-Warning "$side report is unavailable; inspect the partial logs."
              continue
            }
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            $search = $report.scenarios | Where-Object { $_.name -eq 'search.while_indexing' } | Select-Object -First 1
            if ($null -eq $search) {
              $summary += "| $side | search scenario unavailable | — | — | — | — |"
              Write-Warning "$side has no search.while_indexing observation."
              continue
            }
            $summary += "| $side | $($search.status) | $($search.measured) | $($search.skipped) | $($search.frames.count) | $($search.frames.truncatedIterations) |"
            if ($search.measured -lt 6 -or $search.frames.count -eq 0 -or $search.frames.truncatedIterations -gt 0) {
              Write-Warning "$side has incomplete search/frame coverage; no observations are fabricated or retried."
            }
            if ($side -eq 'candidate' -and $null -ne $report.comparison) {
              $comparison = $report.comparison
              $row = $comparison.scenarios | Where-Object { $_.name -eq 'search.while_indexing' } | Select-Object -First 1
              $summary += "`nReport comparison eligible: $($comparison.comparable). Search comparison: $($row.status)."
              if ($comparison.reasons.Count -gt 0) {
                $summary += "Reasons: $($comparison.reasons -join '; ')."
              }
            }
          }
          $summary += @(
            '',
            'Skipped reasons and raw frame observations are retained in phases.jsonl.',
            'The existing analyzer omits frame percentiles when collection is truncated.',
            'No timing thresholds are applied. With at most 6 latency samples, p95/p99 are not stable tail estimates.',
            'This scenario does not measure scrolling during indexing, internal queue bytes, or engine/DB worker counts.',
            'Cold means fresh application data; operating-system caches are not cleared.'
          )
          $summary -join "`n" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload reports and partial observations
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: indexing-ui-profile-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/indexing-ui-profile/**
            !${{ runner.temp }}/indexing-ui-profile/*/data/**
