name: "Build Otzaria 0.9.98 Windows Test"

on:
  push:
    branches: [dev]
    paths:
      - 'pubspec.yaml'
      - 'tool/version/version.json'
      - '.github/workflows/build-0.9.98-temp.yml'

permissions:
  contents: read

jobs:
  build_windows_098:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Fetch biographies data
        uses: ./.github/actions/fetch-biographies

      - name: Prepare dependencies
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart run tool/generate_search_index.dart
          dart run tool/generate_settings_l10n.dart

      - name: Verify version
        shell: pwsh
        run: |
          $line = (Select-String -Path pubspec.yaml -Pattern '^version:').Line
          Write-Host "Building $line"
          if ($line -notmatch '0\.9\.98\+99800') { throw "Expected 0.9.98+99800" }

      - name: Build Windows release
        shell: pwsh
        env:
          UseMultiToolTask: 'true'
          EnforceProcessCountAcrossBuilds: 'true'
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          flutter build windows --release --verbose --dart-define=BIO_OBF_KEY=${{ secrets.BIO_OBF_KEY }}
          if (-not (Test-Path 'build\windows\x64\runner\Release\otzaria.exe')) {
            throw 'otzaria.exe not found after build'
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "otzaria-0.9.98-windows-test.zip"
          $marker = Join-Path $env:RUNNER_TEMP 'portable.marker'
          New-Item -ItemType File -Path $marker -Force | Out-Null
          Compress-Archive -Path $marker -Update -DestinationPath "otzaria-0.9.98-windows-test.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: otzaria-0.9.98-windows-test
          path: otzaria-0.9.98-windows-test.zip
          if-no-files-found: error
