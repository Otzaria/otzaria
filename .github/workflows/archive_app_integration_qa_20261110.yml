name: Archive app integration QA
on:
  push:
    branches:
      - qa/archive-app-integration-20261110
permissions:
  contents: read
jobs:
  plugin-and-library-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze both extraction paths
        run: >
          flutter analyze
          lib/plugins/services/plugin_installer_service.dart
          lib/plugins/services/plugin_archive_extractor.dart
          lib/utils/file/zip_extractor_service.dart
          test/plugins/services/plugin_archive_extractor_test.dart
          test/utils/file/zip_extractor_service_test.dart
      - name: Test plugin and library ZIP extraction together
        run: >
          flutter test -j 2
          test/plugins/services/plugin_archive_extractor_test.dart
          test/utils/file/zip_extractor_service_test.dart
