name: Temporary Windows 11 actual Flutter clipboard history QA

on:
  workflow_dispatch:
  pull_request:
    branches: [palmoni5/report-winv-after-qa-20261106]
    paths: ['.github/workflows/report-winv-windows11-qa.yml', 'integration_test/support/windows_history_qa_windows11.ps1', 'integration_test/support/windows_history_qa_controller.ps1', 'integration_test/support/windows_history_qa_native.cs', 'integration_test/support/windows_history_qa_clipboard.ps1']

permissions:
  contents: read
  actions: read

concurrency:
  group: report-winv-windows11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  history:
    runs-on: windows-11-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        native_trace: [true, false]
    env:
      REPORT_QA_WORKFLOW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      REPORT_QA_NATIVE_TRACE: ${{ matrix.native_trace }}
      REPORT_QA_AFTER_RUN: '42221915069'
      REPORT_QA_AFTER_HEAD: 1a67fb771c7e3660fd7066e958606e12e496ff1a
      REPORT_QA_PRODUCT_HEAD: d1a05625b66536ac3c93267add80acf0b95b3987
      REPORT_QA_ARTIFACT_ROOT: ${{ github.workspace }}/windows11-evidence
    steps:
      - name: Check out the exact reviewed QA script
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record the real Windows host before any app launch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:REPORT_QA_ARTIFACT_ROOT | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          $process = Get-Process -Id $PID
          $hostInfo = @{
            caption = $os.Caption; version = $os.Version; buildNumber = $os.BuildNumber
            productType = $os.ProductType; osArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            controllerArchitecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            controllerProcess = $PID; sessionId = $process.SessionId; userInteractive = [Environment]::UserInteractive
            imageOS = $env:ImageOS; imageVersion = $env:ImageVersion; nativeTraceRequested = '${{ matrix.native_trace }}'
            sourceRun = $env:REPORT_QA_AFTER_RUN; sourceQaHead = $env:REPORT_QA_AFTER_HEAD; productHead = $env:REPORT_QA_PRODUCT_HEAD
          }
          $hostInfo | ConvertTo-Json | Set-Content -Encoding utf8 "$env:REPORT_QA_ARTIFACT_ROOT/host.json"
          if ($os.Caption -notmatch 'Windows\s+11' -or $os.ProductType -ne 1 -or $hostInfo.osArchitecture -ne 'Arm64') {
            throw 'This QA requires an actual Windows 11 ARM host.'
          }
      - name: Download the exact Server evidence for the prerequisite gate
        uses: actions/download-artifact@v8.0.2
        with:
          name: windows-flutter-history-42221915069
          path: server-evidence
          run-id: 42221915069
          github-token: ${{ github.token }}
      - name: Require a working standalone entrypoint and missing Server history
        id: prerequisite
        shell: pwsh
        run: |
          $source = Get-Content server-evidence/standalone-no-trace/flutter-summary.json -Raw | ConvertFrom-Json
          if ($source.qaHead -ne $env:REPORT_QA_AFTER_HEAD -or $source.sourceHead -ne $env:REPORT_QA_PRODUCT_HEAD -or $source.nativeTraceEnabled -ne $false) {
            throw 'The source evidence does not identify the approved direct-main trace-off candidate.'
          }
          $expected = @('plain-v-focused', 'alt-v-focused', 'posted-v-focused', 'text-focused', 'text-unfocused', 'image-focused', 'image-unfocused')
          $observed = @($source.cases | ForEach-Object { $_.case })
          if ($observed.Count -ne 7 -or @(Compare-Object ($expected | Sort-Object) ($observed | Sort-Object)).Count -gt 0) {
            throw 'The standalone source did not execute all seven cases.'
          }
          $controls = @($source.cases | Where-Object { $_.negativeControl })
          if (@($controls | Where-Object { !$_.reportAssertionsPassed }).Count -gt 0) {
            throw 'A native negative control failed on Server; investigate that failure before transferring the bundle.'
          }
          $history = @($source.cases | Where-Object { !$_.negativeControl })
          if ($history.Count -ne 4 -or @($history | Where-Object { $_.controller.outcome -ne 'history-window-not-identified' }).Count -gt 0) {
            throw 'The source does not prove that Server lacks the history window in all four cases.'
          }
          $source | ConvertTo-Json -Depth 30 | Set-Content -Encoding utf8 "$env:REPORT_QA_ARTIFACT_ROOT/server-prerequisite.json"
      - name: Download the two already observed privacy frames for read-only OCR checks
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: windows11-flutter-history-trace-*-42231302570
          merge-multiple: false
          path: privacy-ocr-fixtures
          run-id: 42231302570
          github-token: ${{ github.token }}
      - name: Download the observed Location transition for read-only validation
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: windows11-flutter-history-trace-*-42233490986
          merge-multiple: false
          path: privacy-transition-fixtures
          run-id: 42233490986
          github-token: ${{ github.token }}
      - name: Download the observed final privacy frames for read-only validation
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: windows11-flutter-history-trace-*-42234949689
          merge-multiple: false
          path: privacy-final-fixtures
          run-id: 42234949689
          github-token: ${{ github.token }}
      - name: Download the approved complete x64 standalone bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: windows-flutter-history-bundle-42221915069
          path: flutter-history-x64
          run-id: 42221915069
          github-token: ${{ github.token }}
      - name: Install the reviewed Shell-only observation helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'integration_test/support'
          $bundle = (Resolve-Path flutter-history-x64).Path
          $expected = @{
            'windows_history_qa_controller.ps1' = 'b158ef83e0ca5166c0aa486b491dc35e0eec9eceb8f67da411d5de81ac7fc0a8'
            'windows_history_qa_native.cs' = '48d0ff3d31ca717327050c29a321fe88dbdb151853ecab3ebe75a6773b778c81'
            'windows_history_qa_clipboard.ps1' = '64c815149b9fd16d17d48ce63da62fa1b1ba055c2ecd103b5e74aa40664132d4'
          }
          $exeBefore = (Get-FileHash "$bundle/otzaria.exe").Hash
          $records = @()
          New-Item -ItemType Directory "$env:REPORT_QA_ARTIFACT_ROOT/helper-overrides" | Out-Null
          foreach ($name in $expected.Keys) {
            $target = Join-Path "$bundle/qa" $name
            $normalized = [Text.Encoding]::UTF8.GetBytes(([IO.File]::ReadAllText($target) -replace "`r`n", "`n"))
            $oldSourceHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($normalized)).ToLowerInvariant()
            if ($oldSourceHash -cne $expected[$name]) { throw ('The original bundle helper differs from the reviewed source: ' + $name) }
            $before = (Get-FileHash $target).Hash
            Copy-Item (Join-Path $source $name) $target -Force
            Copy-Item (Join-Path $source $name) "$env:REPORT_QA_ARTIFACT_ROOT/helper-overrides/$name"
            $records += @{ name = $name; originalSha256 = $before; originalNormalizedSha256 = $oldSourceHash; installedSha256 = (Get-FileHash $target).Hash }
          }
          $tokens = $null; $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $source 'windows_history_qa_controller.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'The Shell observer failed PowerShell parsing.' }
          Add-Type -Path (Join-Path $source 'windows_history_qa_native.cs')
          $smokeRoot = Join-Path $env:REPORT_QA_ARTIFACT_ROOT 'shell-verifier-smoke'
          New-Item -ItemType Directory $smokeRoot | Out-Null
          '{}' | Set-Content -Encoding utf8 (Join-Path $smokeRoot 'case.json')
          $child = New-Object Diagnostics.Process
          $child.StartInfo.FileName = Join-Path $env:windir 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $child.StartInfo.Arguments = '-NoProfile -NonInteractive -ExecutionPolicy Bypass -MTA -File "' + (Join-Path "$bundle/qa" 'windows_history_qa_controller.ps1') + '" -Root "' + $smokeRoot + '" -ValidateShellVerifier'
          $child.StartInfo.UseShellExecute = $false
          $child.StartInfo.CreateNoWindow = $true
          $child.StartInfo.RedirectStandardOutput = $true
          $child.StartInfo.RedirectStandardError = $true
          $childStarted = $false
          try {
            # .NET preserves the PS7 environment, like the intermediate Flutter process.
            $childStarted = $child.Start()
            if (!$childStarted) { throw 'The same-environment signature smoke did not start.' }
            $stdout = $child.StandardOutput.ReadToEndAsync()
            $stderr = $child.StandardError.ReadToEndAsync()
            if (!$child.WaitForExit(60000)) { throw 'The same-environment signature smoke timed out.' }
            if (!$stdout.Wait(1000) -or !$stderr.Wait(1000)) { throw 'The signature smoke streams did not finish.' }
            [IO.File]::WriteAllText((Join-Path $smokeRoot 'stdout.log'), $stdout.Result)
            [IO.File]::WriteAllText((Join-Path $smokeRoot 'stderr.log'), $stderr.Result)
            @{ exitCode = $child.ExitCode; launcherPSVersion = [string]$PSVersionTable.PSVersion;
              launcherModulePath = $env:PSModulePath; inputSent = $false } | ConvertTo-Json |
              Set-Content -Encoding utf8 (Join-Path $smokeRoot 'process.json')
            if ($child.ExitCode -ne 0) { throw 'The controller signature/history-state preflight failed; see shell-verifier-smoke evidence.' }
            $proof = Get-Content (Join-Path $smokeRoot 'shell-verifier.json') -Raw | ConvertFrom-Json
            if (!$proof.verifierReady -or $proof.inputSent -or $proof.psVersion -notlike '5.1.*') { throw 'The controller signature smoke did not prove the intended environment.' }
          } finally {
            if ($childStarted -and !$child.HasExited) { $child.Kill() }
            $child.Dispose()
          }
          $exeAfter = (Get-FileHash "$bundle/otzaria.exe").Hash
          if ($exeAfter -cne $exeBefore) { throw 'The Flutter executable changed while installing observation helpers.' }
          @{ workflowHead = $env:REPORT_QA_WORKFLOW_HEAD; bundleHead = $env:REPORT_QA_AFTER_HEAD; productHead = $env:REPORT_QA_PRODUCT_HEAD;
            executableSha256 = $exeAfter; helpers = $records; completionInputSimulated = $false;
            negativeControl = 'V remains scan0; the optional Alt modifier uses the active keyboard layout' } | ConvertTo-Json -Depth 10 |
            Set-Content -Encoding utf8 "$env:REPORT_QA_ARTIFACT_ROOT/helper-overrides.json"
      - name: Run actual Flutter history selection under Windows x64 emulation
        timeout-minutes: 21
        shell: pwsh
        run: |
          $script = 'integration_test/support/windows_history_qa_windows11.ps1'
          @{ workflowHead = $env:REPORT_QA_WORKFLOW_HEAD; path = $script; sha256 = (Get-FileHash $script).Hash } |
            ConvertTo-Json | Set-Content -Encoding utf8 "$env:REPORT_QA_ARTIFACT_ROOT/windows11-harness-source.json"
          & "./$script"
      - name: Upload actual Windows 11 screenshots, traces and process identity
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows11-flutter-history-trace-${{ matrix.native_trace }}-${{ github.run_id }}
          path: windows11-evidence/
          if-no-files-found: error
          retention-days: 14
