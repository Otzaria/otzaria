name: Temporary Windows 11 actual Flutter clipboard history QA

on:
  workflow_dispatch:
  pull_request:
    branches: [palmoni5/report-winv-after-qa-20261106]
    paths: ['.github/workflows/report-winv-windows11-qa.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: report-winv-windows11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  history:
    runs-on: windows-11-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        native_trace: [true, false]
    env:
      REPORT_QA_AFTER_RUN: '42221915069'
      REPORT_QA_AFTER_HEAD: 1a67fb771c7e3660fd7066e958606e12e496ff1a
      REPORT_QA_PRODUCT_HEAD: d1a05625b66536ac3c93267add80acf0b95b3987
      REPORT_QA_ARTIFACT_ROOT: ${{ github.workspace }}/windows11-evidence
    steps:
      - name: Record the real Windows host before any app launch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:REPORT_QA_ARTIFACT_ROOT | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          $process = Get-Process -Id $PID
          $hostInfo = @{
            caption = $os.Caption; version = $os.Version; buildNumber = $os.BuildNumber
            productType = $os.ProductType; osArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            controllerArchitecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            controllerProcess = $PID; sessionId = $process.SessionId; userInteractive = [Environment]::UserInteractive
            imageOS = $env:ImageOS; imageVersion = $env:ImageVersion; nativeTraceRequested = '${{ matrix.native_trace }}'
            sourceRun = $env:REPORT_QA_AFTER_RUN; sourceQaHead = $env:REPORT_QA_AFTER_HEAD; productHead = $env:REPORT_QA_PRODUCT_HEAD
          }
          $hostInfo | ConvertTo-Json | Set-Content -Encoding utf8 "$env:REPORT_QA_ARTIFACT_ROOT/host.json"
          if ($os.Caption -notmatch 'Windows\s+11' -or $os.ProductType -ne 1 -or $hostInfo.osArchitecture -ne 'Arm64') {
            throw 'This QA requires an actual Windows 11 ARM host.'
          }
      - name: Download the exact Server evidence for the prerequisite gate
        uses: actions/download-artifact@v8.0.2
        with:
          name: windows-flutter-history-42221915069
          path: server-evidence
          run-id: 42221915069
          github-token: ${{ github.token }}
      - name: Require a working standalone entrypoint and missing Server history
        id: prerequisite
        shell: pwsh
        run: |
          $source = Get-Content server-evidence/standalone-no-trace/flutter-summary.json -Raw | ConvertFrom-Json
          if ($source.qaHead -ne $env:REPORT_QA_AFTER_HEAD -or $source.sourceHead -ne $env:REPORT_QA_PRODUCT_HEAD -or $source.nativeTraceEnabled -ne $false) {
            throw 'The source evidence does not identify the approved direct-main trace-off candidate.'
          }
          $expected = @('plain-v-focused', 'alt-v-focused', 'posted-v-focused', 'text-focused', 'text-unfocused', 'image-focused', 'image-unfocused')
          $observed = @($source.cases | ForEach-Object { $_.case })
          if ($observed.Count -ne 7 -or @(Compare-Object ($expected | Sort-Object) ($observed | Sort-Object)).Count -gt 0) {
            throw 'The standalone source did not execute all seven cases.'
          }
          $controls = @($source.cases | Where-Object { $_.negativeControl })
          if (@($controls | Where-Object { !$_.reportAssertionsPassed }).Count -gt 0) {
            throw 'A native negative control failed on Server; investigate that failure before transferring the bundle.'
          }
          $history = @($source.cases | Where-Object { !$_.negativeControl })
          if ($history.Count -ne 4 -or @($history | Where-Object { $_.controller.outcome -ne 'history-window-not-identified' }).Count -gt 0) {
            throw 'The source does not prove that Server lacks the history window in all four cases.'
          }
          $source | ConvertTo-Json -Depth 30 | Set-Content -Encoding utf8 "$env:REPORT_QA_ARTIFACT_ROOT/server-prerequisite.json"
      - name: Download the approved complete x64 standalone bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: windows-flutter-history-bundle-42221915069
          path: flutter-history-x64
          run-id: 42221915069
          github-token: ${{ github.token }}
      - name: Run actual Flutter history selection under Windows x64 emulation
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = (Resolve-Path flutter-history-x64).Path
          $metadata = Get-Content "$bundle/qa-bundle.json" -Raw | ConvertFrom-Json
          if ($metadata.qaHead -ne $env:REPORT_QA_AFTER_HEAD -or $metadata.sourceHead -ne $env:REPORT_QA_PRODUCT_HEAD -or
              $metadata.architecture -ne 'x64' -or $metadata.requiresFlutterTestRunner -ne $false) {
            throw 'Unexpected source bundle contract.'
          }
          Copy-Item "$bundle/qa-bundle.json" "$env:REPORT_QA_ARTIFACT_ROOT/qa-bundle.json"
          Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          public static class QaProcessArchitecture {
            [StructLayout(LayoutKind.Sequential)] public struct MachineInfo { public ushort ProcessMachine; public ushort Reserved; public uint Attributes; }
            [DllImport("kernel32.dll", SetLastError=true)] static extern IntPtr OpenProcess(uint access, bool inherit, int pid);
            [DllImport("kernel32.dll", SetLastError=true)] static extern bool GetProcessInformation(IntPtr process, int kind, out MachineInfo info, uint size);
            [DllImport("kernel32.dll", SetLastError=true)] static extern bool IsWow64Process2(IntPtr process, out ushort wowMachine, out ushort nativeMachine);
            [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr handle);
            public static uint[] Read(int pid) {
              IntPtr handle = OpenProcess(0x1000, false, pid);
              if (handle == IntPtr.Zero) throw new Win32Exception(Marshal.GetLastWin32Error());
              try {
                MachineInfo machine; ushort wow, native;
                if (!GetProcessInformation(handle, 9, out machine, (uint)Marshal.SizeOf(typeof(MachineInfo))) ||
                    !IsWow64Process2(handle, out wow, out native)) throw new Win32Exception(Marshal.GetLastWin32Error());
                return new uint[] { machine.ProcessMachine, native, wow, machine.Attributes };
              } finally { CloseHandle(handle); }
            }
          }
          '@
          $output = Join-Path $env:REPORT_QA_ARTIFACT_ROOT 'run'
          $arguments = '-NoProfile -NonInteractive -File "' + "$bundle/run.ps1" + '" -OutputDirectory "' + $output + '"'
          if ('${{ matrix.native_trace }}' -eq 'true') { $arguments += ' -EnableNativeTrace' }
          $launcher = New-Object Diagnostics.Process
          $launcher.StartInfo.FileName = (Get-Process -Id $PID).Path
          $launcher.StartInfo.Arguments = $arguments
          $launcher.StartInfo.UseShellExecute = $false
          $launcher.StartInfo.CreateNoWindow = $true
          $launcher.StartInfo.RedirectStandardOutput = $true
          $launcher.StartInfo.RedirectStandardError = $true
          $started = $false
          $application = $null
          try {
            $started = $launcher.Start()
            if (!$started) { throw 'The standalone launcher did not start.' }
            $stdout = $launcher.StandardOutput.ReadToEndAsync()
            $stderr = $launcher.StandardError.ReadToEndAsync()
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            do {
              $application = Get-Process -Name otzaria -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$bundle\otzaria.exe" } | Select-Object -First 1
              if ($null -ne $application -or $launcher.HasExited) { break }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($null -eq $application) { throw 'The standalone Flutter process was not observed.' }
            $machine = [QaProcessArchitecture]::Read($application.Id)
            @{
              processId = $application.Id; path = $application.Path; sessionId = $application.SessionId
              processMachine = ('0x{0:X4}' -f $machine[0]); nativeMachine = ('0x{0:X4}' -f $machine[1])
              wowMachine = ('0x{0:X4}' -f $machine[2]); attributes = $machine[3]
              executableSha256 = (Get-FileHash $application.Path -Algorithm SHA256).Hash
            } | ConvertTo-Json | Set-Content -Encoding utf8 "$env:REPORT_QA_ARTIFACT_ROOT/flutter-process.json"
            if ($machine[0] -ne 0x8664 -or $machine[1] -ne 0xAA64) {
              throw 'The observed Flutter process must be x64 on native ARM64 Windows.'
            }
            if (!$launcher.WaitForExit(13 * 60 * 1000)) { throw 'Standalone launcher exceeded its bounded run time.' }
            if (!$stdout.Wait(1000) -or !$stderr.Wait(1000)) { throw 'Standalone launcher output did not close.' }
            [IO.File]::WriteAllText("$env:REPORT_QA_ARTIFACT_ROOT/launcher.stdout.log", $stdout.Result)
            [IO.File]::WriteAllText("$env:REPORT_QA_ARTIFACT_ROOT/launcher.stderr.log", $stderr.Result)
            $exitCode = $launcher.ExitCode
            if ($exitCode -isnot [int]) { throw 'The standalone launcher did not produce a trustworthy exit code.' }
            @{ exitCode = $exitCode; processId = $launcher.Id } | ConvertTo-Json |
              Set-Content -Encoding utf8 "$env:REPORT_QA_ARTIFACT_ROOT/launcher-exit.json"
            exit $exitCode
          } catch {
            [IO.File]::WriteAllText("$env:REPORT_QA_ARTIFACT_ROOT/wrapper-error.txt", $_.Exception.ToString())
            throw
          } finally {
            if ($started -and !$launcher.HasExited) { & taskkill.exe /PID $launcher.Id /T /F | Out-Null }
            if ($null -ne $application -and !$application.HasExited) { & taskkill.exe /PID $application.Id /T /F | Out-Null }
            $launcher.Dispose()
          }
      - name: Upload actual Windows 11 screenshots, traces and process identity
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows11-flutter-history-trace-${{ matrix.native_trace }}-${{ github.run_id }}
          path: windows11-evidence/
          if-no-files-found: error
          retention-days: 14
