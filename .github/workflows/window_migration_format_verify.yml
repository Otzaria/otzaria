name: Temporary migration formatting capture

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/window_migration_format_verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Capture exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          for f in test/core/window_persistence_test.dart test/text_book/view/text_book_screen_actions_test.dart integration_test/webview_render_check_test.dart; do
            dart format "$f"
            echo "FORMAT_BEGIN $f"
            base64 -w 0 "$f"
            echo
            echo "FORMAT_END $f"
          done
