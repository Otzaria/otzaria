name: Temporary window migration formatter

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/window_migration_formatter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Capture changed Dart source after formatting
        shell: bash
        run: |
          set -euo pipefail
          for path in 'integration_test/installed_plugin_resource_probe_test.dart' 'integration_test/support/webview_probe_window.dart' 'lib/app.dart' 'lib/core/window_listener.dart' 'lib/core/windowing/app_virtual_window_frame.dart' 'lib/core/windowing/app_window_caption.dart' 'lib/core/windowing/app_window_controller.dart' 'lib/core/windowing/multiview/cocoa_view_window_native.dart' 'lib/core/windowing/multiview/gtk_view_window_native.dart' 'lib/core/windowing/multiview/host_window_app_window_controller.dart' 'lib/core/windowing/multiview/view_window_native.dart' 'lib/core/windowing/multiview/view_window_opener.dart' 'lib/core/windowing/nativeapi_primary_window_binding.dart' 'lib/core/windowing/runner_window_channel.dart' 'lib/core/windowing/window_manager_app_window_controller.dart' 'lib/core/windowing/window_title_sync.dart' 'lib/main.dart' 'lib/utils/ui/fullscreen_helper.dart' 'test/core/window_listener_native_visibility_test.dart' 'test/core/window_persistence_test.dart' 'test/core/windowing/app_virtual_window_frame_test.dart' 'test/core/windowing/app_window_controller_test.dart' 'test/core/windowing/app_window_scope_test.dart' 'test/core/windowing/app_window_title_bar_controls_test.dart' 'test/core/windowing/dock_progress_test.dart' 'test/core/windowing/drag_to_resize_area_rtl_test.dart' 'test/core/windowing/multiview/cocoa_view_window_native_test.dart' 'test/core/windowing/multiview/host_window_app_window_controller_test.dart' 'test/core/windowing/nativeapi_primary_window_binding_test.dart' 'test/core/windowing/runner_window_channel_test.dart' 'test/core/windowing/window_caption_hit_test_test.dart' 'test/navigation/custom_title_bar_test.dart' 'test/navigation/main_window_attached_book_reveal_test.dart' 'test/navigation/main_window_library_focus_integration_test.dart' 'test/navigation/main_window_library_load_failure_test.dart' 'test/navigation/small_screens/small_screens_fixture.dart' 'test/test_helpers/fake_view_window.dart' 'test/test_helpers/recording_native_window.dart' 'test/text_book/view/text_book_screen_actions_test.dart' 'test/tool/perf_probe/webview_probe_window_test.dart' 'test/utils/ui/fullscreen_helper_toggle_test.dart' 'test_driver/multiview_smoke.dart'; do
            [ -f "$path" ] || continue
            old=$(sha256sum "$path" | cut -d' ' -f1)
            dart format "$path"
            now=$(sha256sum "$path" | cut -d' ' -f1)
            if [ "$old" != "$now" ]; then
              echo "FORMAT_BEGIN $path"
              base64 -w 0 "$path"
              echo
              echo "FORMAT_END $path"
            fi
          done
