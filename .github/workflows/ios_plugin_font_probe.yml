name: iOS plugin font compatibility experiment

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
  pull_request:
    branches: [main, dev, 'y-ploni/webview-*']
    paths:
      - '.github/workflows/ios_plugin_font_probe.yml'
      - 'integration_test/ios_plugin_font_probe_test.dart'
      - 'integration_test/support/apple_font_probe_view.dart'
      - 'integration_test/support/ios_font_probe*.dart'
      - 'integration_test/support/macos_font_probe.dart'
      - 'test/tool/perf_probe/ios_font_probe*_test.dart'
      - 'test/tool/perf_probe/macos_font_probe*_test.dart'
      - 'test_driver/ios_plugin_fonts.dart'
      - 'tool/perf_probe/*ios_plugin_fonts*'
      - 'tool/perf_probe/ios_simulator_driver.py'
      - 'tool/perf_probe/test_ios_simulator_driver.py'
      - 'integration_test/support/ios_simulator_vm_service.dart'
      - 'tool/perf_probe/apple_plugin_activity/run.py'
      - 'lib/plugins/services/plugin_font*.dart'
      - 'lib/plugins/services/plugin_asset_scheme.dart'
      - 'lib/plugins/services/plugin_content_blockers.dart'
      - 'lib/plugins/services/plugin_content_security_policy.dart'
      - 'lib/plugins/services/plugin_network_policy.dart'
      - 'lib/plugins/view/plugin_tab_page.dart'
      - 'lib/plugins/view/plugin_webview_host.dart'
      - 'lib/plugins/view/plugin_sdk_scripts.dart'
      - 'lib/theme/app_fonts.dart'
      - 'fonts/**'
      - 'tool/perf_probe/apple_font_probe_changes.py'
      - 'tool/perf_probe/test_apple_font_probe_ci.py'
      # The changes job runs the simulator only for Apple/font dependency changes.
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

concurrency:
  group: ios-plugin-fonts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Decide whether this change needs a macOS runner
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tool/perf_probe/apple_font_probe_changes.py --probe ios \
            --workflow .github/workflows/ios_plugin_font_probe.yml \
            --base HEAD^1 >> "$GITHUB_OUTPUT"

  contracts:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Native source fallback prerequisites
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Resolve exact dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze and verify failure, ownership and evidence controls
        run: |
          set -euo pipefail
          flutter analyze --no-pub
          node --test tool/perf_probe/test_macos_plugin_fonts.mjs tool/perf_probe/test_ios_plugin_fonts.mjs
          python3 -m unittest discover -s tool/perf_probe -p 'test_ios_plugin_fonts*.py' -v
          python3 -m unittest discover -s tool/perf_probe -p test_ios_simulator_driver.py -v
          python3 -m unittest discover -s tool/perf_probe -p test_macos_plugin_fonts_report.py -v
          python3 -m unittest discover -s tool/perf_probe -p test_apple_font_probe_ci.py -v
          flutter test --no-pub \
            test/tool/perf_probe/ios_font_probe_contract_test.dart \
            test/tool/perf_probe/ios_font_probe_startup_test.dart \
            test/tool/perf_probe/ios_font_probe_navigation_test.dart \
            test/tool/perf_probe/ios_font_probe_semantics_test.dart \
            test/tool/perf_probe/macos_font_probe_navigation_test.dart \
            test/tool/perf_probe/macos_font_probe_progress_test.dart \
            test/tool/perf_probe/macos_font_probe_frames_test.dart \
            test/plugins/services/plugin_font_bootstrap_test.dart \
            test/plugins/services/plugin_font_scheme_test.dart \
            test/ci/native_font_workflow_test.dart

  simulator:
    name: Actual iOS Simulator debug (1, 5 and 10 views)
    needs: [changes, contracts]
    if: needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    # The probe step's budget (below) plus setup, uploads and the cache save.
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Initialize retained evidence
        run: |
          set -euo pipefail
          export IOS_FONT_PROBE_OUTPUT="$RUNNER_TEMP/ios-plugin-fonts"
          IOS_FONT_PROBE_BUILD_ID="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          export IOS_FONT_PROBE_BUILD_ID
          mkdir -p "$IOS_FONT_PROBE_OUTPUT"
          echo "IOS_FONT_PROBE_OUTPUT=$IOS_FONT_PROBE_OUTPUT" >> "$GITHUB_ENV"
          echo "IOS_FONT_PROBE_BUILD_ID=$IOS_FONT_PROBE_BUILD_ID" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['IOS_FONT_PROBE_OUTPUT'], 'workflow.json').write_text(json.dumps({
              'githubSha': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
              'status': 'initialized', 'physicalProfile': 'NOT_RUN', 'physicalRelease': 'NOT_RUN',
              'buildCache': 'shared-between-counts', 'executionOrder': [1, 5, 10],
              'buildId': os.environ['IOS_FONT_PROBE_BUILD_ID'],
              'appProcessPolicy': 'fresh-per-count', 'simulatorArchitecture': 'arm64',
          }, indent=2) + '\n')
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      # The runner image ships rustup; only the arm64 Simulator target is needed.
      - name: Install the arm64 Rust Simulator target
        timeout-minutes: 10
        run: |
          set -euo pipefail
          log="$IOS_FONT_PROBE_OUTPUT/rust-targets.log"
          for attempt in 1 2 3; do
            if rustup toolchain install stable --profile minimal --no-self-update \
                --target aarch64-apple-ios-sim 2>&1 | tee -a "$log"; then
              rustup default stable 2>&1 | tee -a "$log"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          exit 1
      - name: Resolve exact dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee "$IOS_FONT_PROBE_OUTPUT/pub-get.log"
      # The Git-pinned search engine has no published binary, so cargo builds it.
      - name: Restore native build hook output
        id: native-hooks
        uses: actions/cache/restore@v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-${{ runner.arch }}-ios-sim-native-hooks-v1-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
      - name: Run all fifty-four cases in actual visible WKWebViews
        timeout-minutes: 100
        run: |
          set -euo pipefail
          budget_minutes=95
          deadline=$(( $(date +%s) + budget_minutes * 60 ))
          failed=0
          for instances in 1 5 10; do
            output="$IOS_FONT_PROBE_OUTPUT/$instances-views"
            mkdir -p "$output"
            cp "$IOS_FONT_PROBE_OUTPUT/workflow.json" \
              "$IOS_FONT_PROBE_OUTPUT/rust-targets.log" \
              "$IOS_FONT_PROBE_OUTPUT/pub-get.log" "$output/"
            if ! python3 tool/perf_probe/run_ios_plugin_fonts.py \
                --instances "$instances" --output "$output" \
                --build-id "${IOS_FONT_PROBE_BUILD_ID:-}" --deadline-epoch "$deadline"; then
              failed=1
            fi
          done
          exit "$failed"
      # Saved even when a count fails: the build hooks finish before any launch.
      - name: Save native build hook output
        if: always() && steps.native-hooks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: ${{ steps.native-hooks.outputs.cache-primary-key }}
      - name: Retain setup evidence before any count starts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-plugin-fonts-setup
          path: |
            ${{ runner.temp }}/ios-plugin-fonts/workflow.json
            ${{ runner.temp }}/ios-plugin-fonts/rust-targets.log
            ${{ runner.temp }}/ios-plugin-fonts/pub-get.log
          if-no-files-found: error
          retention-days: 14
      - name: Retain one-view native evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-plugin-fonts-debug-1-views
          path: ${{ runner.temp }}/ios-plugin-fonts/1-views
          if-no-files-found: error
          retention-days: 14
      - name: Retain five-view native evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-plugin-fonts-debug-5-views
          path: ${{ runner.temp }}/ios-plugin-fonts/5-views
          if-no-files-found: error
          retention-days: 14
      - name: Retain ten-view native evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ios-plugin-fonts-debug-10-views
          path: ${{ runner.temp }}/ios-plugin-fonts/10-views
          if-no-files-found: error
          retention-days: 14
