name: Warm Flutter Cache

# שומר את ה-Flutter SDK וה-pub cache ב-cache של ענף הבסיס. cache שנשמר
# בריצת PR משויך ל-ref של אותו PR ואינו נגיש ל-PRים אחרים — רק כאן הוא נוצר.
# ה-cache מזוהה גם לפי נתיבי הסביבה, ולכן כל סביבה של flutter_tests.yml
# צריכה job חימום זהה משלה.
on:
  push:
    branches:
      - main
      - dev
    # מפתח ה-cache נגזר מגרסת Flutter ומ-pubspec.lock; push אחר מוצא hit ולא שומר.
    paths:
      - '**/pubspec.lock'
      - '**/pubspec.yaml'
      - .github/workflows/warm_flutter_cache.yml
      - .github/workflows/flutter_tests.yml
  # משחזר cache שנמחק (פינוי לפי מקום) גם בלי שינוי בתלויות.
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: warm-flutter-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: Cache Flutter (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # הגרסה חייבת להיות זהה ל-flutter_tests.yml, אחרת המפתח לא יתאים.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

  # ב-Windows שחזור ה-SDK איטי מהתקנה, אבל ה-pub cache מקצר את pub get
  # מ-~100 ל-~10 שניות, כך שבסך הכל ה-cache משתלם.
  warm_windows:
    name: Cache Flutter (windows)
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        shell: pwsh
        run: |
          git config --global core.longpaths true
          flutter pub get --enforce-lockfile

  # תואם ל-build_linux ב-flutter_tests.yml: אותו ראנר, קונטיינר וכלים.
  # בלי zstd ה-cache נדחס אחרת ולא יימצא.
  warm_linux_container:
    name: Cache Flutter (debian container)
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm-slim
    defaults:
      run:
        shell: bash

    steps:
      - name: Prepare container
        run: |
          set -euo pipefail
          apt-get update -y
          apt-get install -y ca-certificates curl git jq unzip xz-utils zstd
          git config --global --add safe.directory '*'

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
