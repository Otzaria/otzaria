name: Flutter Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev

# A new push to a PR supersedes its previous run, so the older one is cancelled.
concurrency:
  group: flutter-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native_linux:
    name: Native updater and download assistant (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev xvfb xauth
      - name: Build and test Linux download assistant
        run: make -C tool/download_assistant/linux all check-needed test test-ui
      - name: Build atomic tree swap helper
        run: cc -O2 -Wall -Wextra tool/updater/atomic_tree_swap.c -o /tmp/otzaria-atomic-swap

  native_macos:
    name: Native updater and download assistant (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Test macOS download assistant
        run: swift test --package-path tool/download_assistant/macos
      - name: Build universal atomic tree swap helper
        run: |
          cc -O2 -Wall -Wextra -arch x86_64 -arch arm64 -mmacosx-version-min=12.0 \
            tool/updater/atomic_tree_swap.c -o /tmp/otzaria-atomic-swap
          lipo /tmp/otzaria-atomic-swap -verify_arch x86_64 arm64
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test native SHA-256 (macOS)
        run: flutter test test/utils/file/native_sha256_test.dart

  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # שימוש ב-channel stable + flutter-version קבוע, אחיד עם build-and-announce.yml.
      # הגרסה ננעלת מפני שדרוגים אוטומטיים של pub/CI אחרי שחרור גרסת flutter יציבה חדשה.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # חילול אינדקס חיפוש בהגדרות. ה-.g.dart נדחף לרפו, אבל הסקריפט הזה
      # יוודא שהוא עדכני בכל הרצה (אם searchEntries השתנו במהלך ה-PR).
      # ה-dart run הראשון מפעיל build hooks שמורידים נכסים נייטיביים, ולכן
      # retry חל רק על כשל hooks כדי ששגיאת סקריפט תיכשל מיד.
      - name: Generate settings search index
        run: |
          set +e

          for attempt in 1 2 3; do
            output=$(dart run tool/generate_search_index.dart 2>&1)
            status=$?
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            case "$output" in
              *'Running build hooks failed'*) ;;
              *) exit "$status" ;;
            esac

            if [ "$attempt" -lt 3 ]; then
              echo "::warning::בניית נכסים נייטיביים נכשלה (ניסיון $attempt מתוך 3) - ניסיון נוסף בעוד 15 שניות"
              sleep 15
            fi
          done

          echo "::error::בניית הנכסים הנייטיביים נכשלה בשלושה ניסיונות"
          exit 1

      - name: Generate settings translation catalog
        run: dart run tool/generate_settings_l10n.dart

      # מפרט ה-SDK לתוספים. --check נכשל אם spec.json שבדיסק מיושן, כדי
      # שהוולידטורים החיצוניים לא יצרכו מפרט שאינו תואם את קוד האפליקציה.
      - name: Check plugin SDK spec is fresh
        run: dart run tool/plugins/generate_plugin_spec.dart --check

      # בדיקות ה־CI: analyze + test (פורמט נבדק locally ב־lint).
      - name: Analyze
        run: flutter analyze

  test:
    name: Test (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    # בדיקות ה-zstd של line_content נכשלות כאן במקום לדלג כשחסרים libzstd או המילון.
    env:
      OTZARIA_REQUIRE_CODEC_TESTS: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Resolve the Git or hosted package to cache the native library under the
      # exact root used by flutter_test_config.dart.
      - name: Resolve search engine package root
        id: engine-package
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import url2pathname

          config = Path('.dart_tool/package_config.json').resolve()
          packages = json.loads(config.read_text())['packages']
          package = next(p for p in packages if p['name'] == 'otzaria_search_engine')
          uri = urlparse(urljoin(config.as_uri(), package['rootUri']))
          if uri.scheme != 'file' or uri.netloc:
              raise ValueError(f'Expected a local package root, got {uri.geturl()}')
          root = Path(url2pathname(uri.path)).resolve()
          if not (root / 'rust/Cargo.toml').is_file():
              raise FileNotFoundError(f'Engine Cargo.toml missing in {root}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'root={root}', file=output)
          print(f'Search engine package root: {root}')
          PYTHON

      # Cache by the immutable package reference so later runs can reuse the
      # native library. The first uncached run builds it through Cargokit.
      - name: Cache search engine library
        id: engine-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.engine-package.outputs.root }}/rust/target/release/libsearch_engine.so
          key: ${{ runner.os }}-search-engine-lib-v3-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}

      # flutter_test has no plugin assets. Cargokit downloads signed release
      # artifacts when available and builds the pinned Git engine from source
      # when that crate hash has not been published.
      - name: Fetch native libraries (search engine, OpenType shaper)
        env:
          ENGINE_PACKAGE_ROOT: ${{ steps.engine-package.outputs.root }}
        run: |
          for pkg in otzaria_search_engine opentype_shaper; do
            pkg_root=$(jq -r --arg pkg "$pkg" '.packages[] | select(.name == $pkg) | .rootUri' .dart_tool/package_config.json)
            pkg_root=${pkg_root#file://}
            case "$pkg_root" in
              /*) ;;
              *) pkg_root=".dart_tool/$pkg_root" ;;
            esac
            pkg_root=$(realpath "$pkg_root")
            echo "Fetching $pkg at: $pkg_root"
            if [ "$pkg" = "otzaria_search_engine" ] && \
                [ -s "$ENGINE_PACKAGE_ROOT/rust/target/release/libsearch_engine.so" ]; then
              echo "Using cached search engine native library"
              continue
            fi
            mkdir -p "$pkg_root/rust/target/release"
            CARGOKIT_CONFIGURATION=Release \
            CARGOKIT_TARGET_PLATFORM=linux-x64 \
            CARGOKIT_MANIFEST_DIR="$pkg_root/rust" \
            CARGOKIT_OUTPUT_DIR="$pkg_root/rust/target/release" \
            CARGOKIT_TARGET_TEMP_DIR="$RUNNER_TEMP/cargokit/$pkg/target" \
            CARGOKIT_TOOL_TEMP_DIR="$RUNNER_TEMP/cargokit/$pkg/tool" \
            CARGOKIT_ROOT_PROJECT_DIR="$GITHUB_WORKSPACE" \
              bash "$pkg_root/cargokit/run_build_tool.sh" build-cmake
            ls -la "$pkg_root/rust/target/release"
          done
          test -s "$ENGINE_PACKAGE_ROOT/rust/target/release/libsearch_engine.so"

      # הטסטים תלויים בקבצים המחוללים, לכן החילול רץ גם בכל shard (~20 שניות).
      - name: Generate settings search index
        run: |
          set +e

          for attempt in 1 2 3; do
            output=$(dart run tool/generate_search_index.dart 2>&1)
            status=$?
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            case "$output" in
              *'Running build hooks failed'*) ;;
              *) exit "$status" ;;
            esac

            if [ "$attempt" -lt 3 ]; then
              echo "::warning::בניית נכסים נייטיביים נכשלה (ניסיון $attempt מתוך 3) - ניסיון נוסף בעוד 15 שניות"
              sleep 15
            fi
          done

          echo "::error::בניית הנכסים הנייטיביים נכשלה בשלושה ניסיונות"
          exit 1

      - name: Generate settings translation catalog
        run: dart run tool/generate_settings_l10n.dart

      # המילון האמיתי (2MB) לא נכנס לרפו: הוא מגיע מ-SeforimLibrary בקומיט נעוץ ונבדק
      # לפי SHA-256, ועותק וקטור ה-golden שב-test/fixtures חייב להיות זהה למקור שם.
      - name: Fetch the SeforimLibrary line dictionary (pinned)
        env:
          SL_COMMIT: cdc5a50fc5c831284e190ad15791b72af8198a57
          DICT_SHA256: 7b08b7c3534c9f9cd0e8f18414b4326aeeb64cfd574cc0f12d83b6f92bd6a396
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/Otzaria/SeforimLibrary/$SL_COMMIT/generator/common/src"
          mkdir -p build/test_fixtures
          curl -fsSL --retry 3 --retry-delay 5 -o build/test_fixtures/line_content.zdict \
            "$base/jvmMain/resources/zstd/line_content.zdict"
          printf '%s  %s\n' "$DICT_SHA256" build/test_fixtures/line_content.zdict | sha256sum -c -
          curl -fsSL --retry 3 --retry-delay 5 "$base/jvmTest/resources/zstd/line_content_golden_frames.json" \
            | cmp - test/fixtures/line_content_codec/sl_golden_frames.json
          ldconfig -p | grep -F 'libzstd.so.1'

      # Fail immediately if a missing or incompatible binary would make the
      # engine-dependent test groups skip themselves.
      - name: Verify the cached native engine loads
        run: |
          preflight=$(mktemp --suffix=_test.dart test/search_engine_ci_XXXXXX)
          trap 'rm -f "$preflight"' EXIT
          cat > "$preflight" <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'support/search_engine_test_init.dart';

          void main() {
            test('CI loads the resolved native search engine', () async {
              if (!await tryInitSearchEngine()) {
                throw StateError(searchEngineSkipReason);
              }
            });
          }
          DART
          flutter test "$preflight"

      # הרצת הטסטים עם retry: אם הריצה הראשונה נכשלה, נחלץ את קבצי הטסט
      # שנכשלו ונריץ אותם שוב. רק אם הם נכשלים גם בריצה השנייה - הסטפ נכשל.
      - name: Run tests (with retry on failure)
        run: |
          set +e

          # פיצול מפורש של רשימת הקבצים (round-robin על רשימה ממוינת) במקום
          # --total-shards: הדגל מקמפל את כל הקבצים בכל shard והקומפילציה
          # היא רוב הזמן, כך שהפיצול לא חסך כלום.
          mapfile -t all_files < <(find test -name "*_test.dart" | sort)
          shard_files=()
          for i in "${!all_files[@]}"; do
            if [ $((i % 6)) -eq ${{ matrix.shard }} ]; then
              shard_files+=("${all_files[$i]}")
            fi
          done

          echo "════════════════════════════════════════"
          echo "ריצה ראשונה של הטסטים (shard ${{ matrix.shard }}/6, ${#shard_files[@]} מתוך ${#all_files[@]} קבצים)"
          echo "════════════════════════════════════════"

          flutter test --file-reporter json:test-results.json "${shard_files[@]}"
          first_exit=$?

          if [ $first_exit -eq 0 ]; then
            echo "כל הטסטים עברו בהצלחה בריצה הראשונה"
            exit 0
          fi

          if [ ! -s test-results.json ]; then
            echo "::error::ריצת הטסטים נכשלה ולא הופק קובץ תוצאות (ייתכן שיש שגיאת קומפילציה)"
            exit $first_exit
          fi

          # חילוץ קבצי הטסט שכללו לפחות טסט שנכשל.
          # ממפים דרך suiteID→suite.path כי .test.url מצביע על widget_tester.dart
          # כשטסט testWidgets נכשל בתוך קוד async של ה-framework.
          failed_files=$(jq -rs '
            (map(select(.type == "suite"))
              | map({(.suite.id | tostring): .suite.path})
              | add) as $suites
            | (map(select(.type == "testStart"))
              | map({(.test.id | tostring): .test})
              | add) as $tests
            | map(select(
                .type == "testDone"
                and (.result == "failure" or .result == "error")
                and (.hidden | not)
              ))
            | map($suites[($tests[.testID | tostring].suiteID) | tostring] // empty)
            | map(select(. != ""))
            | unique
            | .[]
          ' test-results.json)

          if [ -z "$failed_files" ]; then
            echo "::error::הריצה הראשונה נכשלה אבל לא ניתן לחלץ רשימת קבצים שנכשלו"
            exit $first_exit
          fi

          echo ""
          echo "════════════════════════════════════════"
          echo "ריצה ראשונה נכשלה. מריץ שוב את קבצי הטסט הבאים:"
          echo "$failed_files" | sed 's/^/  /'
          echo "════════════════════════════════════════"
          echo ""

          files_array=()
          while IFS= read -r line; do
            [ -n "$line" ] && files_array+=("$line")
          done <<< "$failed_files"

          # ה-retry רץ על רשימת קבצים מפורשת - בלי דגלי shard,
          # כדי שהפיצול לא ישמיט חלק מהקבצים שנכשלו.
          flutter test --file-reporter json:retry-results.json "${files_array[@]}"
          second_exit=$?

          if [ $second_exit -eq 0 ]; then
            echo ""
            echo "════════════════════════════════════════"
            echo "כל הטסטים עברו בהצלחה בריצה השנייה (retry)"
            echo "════════════════════════════════════════"
            {
              echo "## טסטים שעברו רק אחרי retry (shard ${{ matrix.shard }})"
              echo ""
              echo "$failed_files" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ריצה שנייה נכשלה גם - מדפיסים בדיוק מה נכשל
          final_failed=$(jq -rs '
            (map(select(.type == "suite"))
              | map({(.suite.id | tostring): .suite.path})
              | add) as $suites
            | (map(select(.type == "testStart"))
              | map({(.test.id | tostring): .test})
              | add) as $tests
            | map(select(
                .type == "testDone"
                and (.result == "failure" or .result == "error")
                and (.hidden | not)
              ))
            | map($tests[.testID | tostring])
            | map("- " + ($suites[.suiteID | tostring] // "unknown") + " :: " + .name)
            | .[]
          ' retry-results.json)

          echo ""
          echo "════════════════════════════════════════"
          echo "טסטים שנכשלו גם אחרי retry:"
          echo "════════════════════════════════════════"
          echo "$final_failed"
          echo "════════════════════════════════════════"

          {
            echo "## טסטים שנכשלו גם אחרי retry (shard ${{ matrix.shard }})"
            echo ""
            echo "$final_failed"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $second_exit

      # הוכחה בלוג שבדיקות ה-codec רצו ב-shard הזה, וכשל אם אחת מהן דולגה.
      - name: Report zstd codec tests
        run: |
          set -euo pipefail
          read -r ran skipped < <(jq -rs '
            (map(select(.type == "suite"))
              | map({(.suite.id | tostring): .suite.path})
              | add) as $suites
            | (map(select(.type == "testStart"))
              | map({(.test.id | tostring): .test})
              | add // {}) as $tests
            | map(select(.type == "testDone" and (.hidden | not)))
            | map(select(($suites[($tests[.testID | tostring].suiteID) | tostring] // "")
                | test("line_content_(codec|split)|db_read_worker_compressed|line_codec_isolate_placement")))
            | "\(map(select(.skipped | not)) | length) \(map(select(.skipped)) | length)"
          ' test-results.json)
          echo "zstd codec tests (shard ${{ matrix.shard }}): $ran ran, $skipped skipped"
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped zstd codec tests were skipped"
            exit 1
          fi

  # שער הבנייה היחיד ל-Windows על PR. עד עכשיו לא היה כזה: `analyze` ו-`test`
  # רצים שניהם על ubuntu, ו-`webview2_smoke` מסונן ב-`paths`. המשמעות הייתה
  # ששבירה בקוד הנייטיבי (windows/runner, רישום תוספים, cargokit) התגלתה רק
  # אצל המפתח הבא שניסה לבנות מקומית.
  build_windows:
    name: Build (Windows)
    runs-on: windows-2022
    env:
      # MSBuild FileTracker still limits llama.cpp scratch paths to MAX_PATH.
      CARGOKIT_TEMP_DIR: D:/ck
      # כמו בבניית ההפצה: בלי אלה MSBuild מקמפל קובץ C++ אחד בכל פעם.
      UseMultiToolTask: 'true'
      EnforceProcessCountAcrossBuilds: 'true'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    # מדידה מקומית: בנייה קרה 6 דקות. ראנר CI איטי יותר ומוסיף checkout,
    # setup ו-pub get. 30 נותן מרווח בלי לתת ל-job תקוע לשרוף שעה שלמה.
    # לכווץ אחרי הריצה הראשונה לפי הזמן שנמדד בפועל.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # ⚠️ חייב להתאים לשאר ה-jobs. `pubspec.lock` דורש Flutter >=3.47.0,
          # ולכן עם 3.44.0 ה-job הזה נכשל ב-`pub get` ומעולם לא רץ ירוק.
          flutter-version: 3.47.2
          # ה-cache של Windows נשמר על ענף הבסיס ב-warm_flutter_cache.yml.
          cache: true

      - name: Install dependencies
        shell: pwsh
        run: |
          # תלות git על מונורפו נכשלת ב-checkout ("Filename too long") ומשאירה
          # עץ חלקי, ואז הבנייה נופלת על קובץ חסר במקום על ה-clone.
          git config --global core.longpaths true
          flutter pub get --enforce-lockfile

      # The Git-pinned engine may not have precompiled release assets yet.
      - name: Install Rust for native source fallback
        uses: dtolnay/rust-toolchain@stable

      # זה הצעד שבגללו ה-job קיים: MSBuild, רישום התוספים הנייטיביים
      # ו-cargokit. debug ולא release — הוא מפעיל את אותה שרשרת נייטיבית
      # בשבריר מהזמן, ובניית ה-release כבר מכוסה ב-build-and-announce.
      - name: Build Windows (debug)
        run: flutter build windows --debug

      # ⚠️ הבנייה חייבת לקדום לבדיקות, ולא רק כדי לחסוך זמן:
      # `test/support/search_engine_test_init.dart` מאתר את מנוע החיפוש
      # בין השאר תחת `build/windows/x64/plugins/otzaria_search_engine/Debug`.
      # בלי בנייה קודמת האתחול נכשל **בשקט**, וכל בדיקה שתלויה במנוע
      # מדולגת בלי להיכשל — כלומר ה-job היה ירוק ולא בודק כלום.
      #
      # ההיקף מכוון וצר: הסוללה המלאה רצה על Linux ב-6 shards. כאן רצות
      # רק הקבוצות שאומתו כירוקות ב-Windows (1,073 בדיקות, ועוד 146 של
      # personal_notes), והקבוצות הידועות כתלויות-סביבה או flaky (migration,
      # installer, tools/calendar) נשארות ל-Linux בלבד. הרחבת ההיקף מחייבת אימות
      # מקומי ב-Windows קודם — אחרת ה-job נהיה רועש ומתחילים להתעלם ממנו.
      - name: Verify the built native engine loads
        shell: pwsh
        run: |
          $preflight = Join-Path "test" ("search_engine_ci_{0}_test.dart" -f [guid]::NewGuid().ToString("N"))
          try {
            @'
          import 'package:flutter_test/flutter_test.dart';
          import 'support/search_engine_test_init.dart';

          void main() {
            test('CI loads the resolved native search engine', () async {
              if (!await tryInitSearchEngine()) {
                throw StateError(searchEngineSkipReason);
              }
            });
          }
          '@ | Set-Content -Path $preflight -Encoding utf8
            flutter test $preflight
            if ($LASTEXITCODE -ne 0) { throw "Native engine initialization failed" }
          } finally {
            Remove-Item -Path $preflight -ErrorAction SilentlyContinue
          }

      - name: Run Windows-relevant tests
        run: flutter test test/core/ test/tabs/ test/navigation/ test/workspaces/ test/personal_notes/ test/utils/file/native_sha256_test.dart

      # המנוע בבניית האפליקציה בלי SQLite משלו; כשל ברישום אינו נראה בשום טסט
      # יחידה. רץ על הבנייה הנייטיבית שלמעלה, ולכן מוסיף רק קומפילציה וריצה.
      - name: Engine SQLite integration test (Windows)
        run: flutter test integration_test/external_line_text_test.dart -d windows --timeout 5m

      # שומר לוגים בכישלון: כשהבנייה נופלת, הלוג של MSBuild הוא הדבר היחיד
      # שמסביר למה — ההודעה ב-stdout מפנה לכיוון הלא נכון בדרך כלל.
      - name: Collect native build logs on failure
        if: failure()
        shell: pwsh
        run: |
          $source = $env:CARGOKIT_TEMP_DIR
          $destination = Join-Path $env:GITHUB_WORKSPACE 'build/ci-native-logs'
          if (Test-Path -LiteralPath $source) {
            Get-ChildItem -LiteralPath $source -Recurse -File |
              Where-Object { $_.Extension -in '.log', '.tlog' } |
              ForEach-Object {
                $relative = [IO.Path]::GetRelativePath($source, $_.FullName)
                $target = Join-Path $destination $relative
                New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
                Copy-Item -LiteralPath $_.FullName -Destination $target
              }
          }

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-build-logs
          path: |
            build/windows/x64/**/*.log
            build/windows/x64/**/*.tlog
            build/ci-native-logs/**/*.log
            build/ci-native-logs/**/*.tlog
          if-no-files-found: ignore
          retention-days: 7

  build_linux:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    # ה-SDK של WPE נבנה ומופץ עבור Debian Bookworm. זהה את סביבת הבנייה
    # לבדיקת ההפצה: על Ubuntu 24.04 ה-try_compile של WPEPlatform נכשל אף
    # שה-PC modules נמצאים, ולכן אינו מייצג build נתמך של המוצר.
    container:
      image: debian:bookworm-slim
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      CARGO_HOME: ${{ github.workspace }}/.cargo
      WPE_SDK: /opt/wpe-sdk
      PKG_CONFIG_PATH: /opt/wpe-sdk/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/wpe-sdk/lib
      LIBRARY_PATH: /opt/wpe-sdk/lib
      # התוסף jni מפעיל FindJNI בזמן CMake; בקונטיינר אין JAVA_HOME ברירת מחדל.
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      # Flutter בוחר clang++ עבור Linux. Clang 14 של Bookworm אינו מכיר
      # דגל אזהרה אופציונלי של nlohmann/json, לכן רק diagnostic זה אינו -Werror.
      CC: clang
      CXX: clang++
      CFLAGS: -Wno-error=unknown-warning-option
      CXXFLAGS: -Wno-error=unknown-warning-option

    steps:
      # הפעולה חייבת לרוץ לפני checkout: הקונטיינר המינימלי לא כולל git,
      # curl, unzip או zstd, הנדרשים ל-actions ול-SDK.
      - name: Prepare Linux build container
        run: |
          set -euo pipefail
          apt-get update -y
          apt-get install -y ca-certificates curl git jq unzip xz-utils zstd
          # ה-Flutter SDK מוזרק מה-runner בבעלות משתמש אחר. זהו קונטיינר
          # חד-פעמי של CI, וכל עץ git בו מגיע מה-workflow עצמו.
          git config --global --add safe.directory '*'

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          # ה-cache של הקונטיינר נשמר על ענף הבסיס ב-warm_flutter_cache.yml.
          cache: true

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          apt-get update -y
          apt-get install -y build-essential clang-14 cmake \
            libblkid1 libcurl4-openssl-dev libglib2.0-dev libgtk-3-dev \
            liblzma5 liblzma-dev libsecret-1-dev libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-dev ninja-build \
            openjdk-17-jdk-headless pkg-config xvfb xauth
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-14 100
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-14 100

      # Bookworm-slim has no rustup. Unpublished crate hashes fall back to
      # building the Git-pinned engine from source through Cargokit.
      - name: Install Rust for native source fallback
        uses: dtolnay/rust-toolchain@stable

      - name: Verify native Rust toolchain
        run: |
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          rustc -Vv
          cargo -V
          rustup show

      - name: Download prebuilt WPE runtime SDK
        env:
          WPE_RUNTIME_SHA256: ca7e706c0ec2f66623fede2c369e3e13339448843e125f2ccd1553f4a3c4bcaf
          WPE_RUNTIME_VERSION: 2.48.7
        run: |
          set -euo pipefail
          asset="wpe-runtime-${WPE_RUNTIME_VERSION}-linux-x86_64.tar.zst"
          base="https://github.com/Otzaria/otzaria-wpe-runtime/releases/download/wpe-2.48.7-print-to-pdf"
          curl -fSL --retry 3 --retry-delay 5 -o "/tmp/$asset" "$base/$asset"
          printf '%s  %s\n' "$WPE_RUNTIME_SHA256" "/tmp/$asset" | sha256sum -c -
          mkdir -p /opt
          tar -C /opt -I zstd -xf "/tmp/$asset"
          test -f "$WPE_SDK/lib/pkgconfig/wpe-webkit-2.0.pc"
          pkg-config --print-errors --exists \
            wpe-webkit-2.0 wpe-platform-2.0 wpe-platform-headless-2.0 wpe-1.0

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Test fractional scaling policy
        run: linux/runner/test/run_fractional_scaling_test.sh

      - name: Build Linux (debug)
        run: flutter build linux --debug

      # ראו את הצעד המקביל ב-build_windows. ה-runner של GTK צריך תצוגה.
      - name: Engine SQLite integration test (Linux)
        run: >-
          xvfb-run -a flutter test integration_test/external_line_text_test.dart
          -d linux --timeout 5m
