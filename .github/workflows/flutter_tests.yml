name: Flutter Tests

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  # שער אבטחה+עומס: רץ על runner של GitHub (לא על ה-self-hosted) ומחליט על איזה
  # runner להריץ את הטסטים. השרת נגע רק ע"י מורשים ורק מחוץ לחלון העמוס.
  gate:
    name: Select runner
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.decide.outputs.runner }}
    steps:
      - name: Decide runner by author + load window
        id: decide
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # מורשים להריץ על ה-self-hosted runner (שמות משתמש ב-GitHub, מופרדים ברווח).
          AUTHORIZED="Y-PLONI palmoni5 gwngdwl YOSEFTT DeveShlomo mmichaelush Nathaniel-260 arieldaniely"

          authorized=false
          for u in $AUTHORIZED; do
            if [ "$u" = "$PR_AUTHOR" ]; then authorized=true; break; fi
          done

          # חלון עמוס: יום חמישי 15:00–20:00 UTC, מסונכרן ל-cron של weekly-pipeline
          # (ב-repo otzaria-library). ב-UTC בלבד — אין תלות בשעון קיץ/חורף.
          dow=$(date -u +%u)    # 1=שני .. 7=ראשון; חמישי=4
          hour=$(date -u +%-H)  # 0..23 ללא אפס מוביל
          busy=false
          if [ "$dow" = "4" ] && [ "$hour" -ge 15 ] && [ "$hour" -lt 20 ]; then
            busy=true
          fi

          if [ "$authorized" = true ] && [ "$busy" = false ]; then
            echo 'runner=["self-hosted","Linux","ARM64"]' >> "$GITHUB_OUTPUT"
            echo "מורשה ומחוץ לחלון עמוס → self-hosted"
          else
            echo 'runner="ubuntu-latest"' >> "$GITHUB_OUTPUT"
            echo "runner של GitHub (author=$PR_AUTHOR, authorized=$authorized, busy=$busy)"
          fi

  test:
    name: Analyze & Test on ${{ needs.gate.outputs.runner }}
    needs: gate
    runs-on: ${{ fromJSON(needs.gate.outputs.runner) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GitHub-hosted (x64): ה-action מוריד artifact רשמי של Flutter, מהיר ו-cached.
      # הגרסה ננעלת מפני שדרוגים אוטומטיים אחרי שחרור גרסת flutter יציבה חדשה.
      - name: Setup Flutter (GitHub-hosted)
        if: runner.environment == 'github-hosted'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      # self-hosted (Oracle Linux ARM64): אין artifact רשמי של Flutter ל-Linux ARM64,
      # לכן מתקינים דרך git clone שנשאר בין ריצות. אם הגרסה הנכונה כבר מותקנת —
      # מדלגים על ההתקנה כדי לחסוך את זמן ההורדה.
      - name: Setup Flutter (self-hosted, persistent)
        if: runner.environment == 'self-hosted'
        env:
          FLUTTER_VERSION: 3.44.0
          FLUTTER_HOME: ${{ runner.tool_cache }}/flutter
        run: |
          set -euo pipefail

          for cmd in git jq curl unzip xz; do
            command -v "$cmd" >/dev/null \
              || { echo "::error::חסר '$cmd' על ה-runner (התקן ידנית, למשל: sudo dnf install -y $cmd)"; exit 1; }
          done

          git config --global --add safe.directory "$FLUTTER_HOME" || true

          installed=""
          if [ -x "$FLUTTER_HOME/bin/flutter" ]; then
            installed=$("$FLUTTER_HOME/bin/flutter" --version 2>/dev/null \
              | grep -oE 'Flutter [0-9]+\.[0-9]+\.[0-9]+' | head -1 | awk '{print $2}' || true)
          fi

          if [ "$installed" = "$FLUTTER_VERSION" ]; then
            echo "Flutter $FLUTTER_VERSION כבר מותקן — מדלג על ההתקנה"
          else
            echo "מתקין Flutter $FLUTTER_VERSION (מותקן כעת: ${installed:-אין})"
            rm -rf "$FLUTTER_HOME"
            git clone --depth 1 -b "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter.git "$FLUTTER_HOME"
          fi

          echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
          "$FLUTTER_HOME/bin/flutter" --version

      - name: Install dependencies
        run: flutter pub get

      # חילול אינדקס חיפוש בהגדרות. ה-.g.dart נדחף לרפו, אבל הסקריפט הזה
      # יוודא שהוא עדכני בכל הרצה (אם searchEntries השתנו במהלך ה-PR).
      - name: Generate settings search index
        run: dart run tool/generate_search_index.dart

      # ה-trinity של CLAUDE.md: analyze + test (פורמט נבדק locally בlint).
      - name: Analyze
        run: flutter analyze

      # הרצת הטסטים עם retry: אם הריצה הראשונה נכשלה, נחלץ את קבצי הטסט
      # שנכשלו ונריץ אותם שוב. רק אם הם נכשלים גם בריצה השנייה - הסטפ נכשל.
      - name: Run tests (with retry on failure)
        run: |
          set +e

          echo "════════════════════════════════════════"
          echo "ריצה ראשונה של הטסטים"
          echo "════════════════════════════════════════"

          flutter test --file-reporter json:test-results.json
          first_exit=$?

          if [ $first_exit -eq 0 ]; then
            echo "כל הטסטים עברו בהצלחה בריצה הראשונה"
            exit 0
          fi

          if [ ! -s test-results.json ]; then
            echo "::error::ריצת הטסטים נכשלה ולא הופק קובץ תוצאות (ייתכן שיש שגיאת קומפילציה)"
            exit $first_exit
          fi

          # חילוץ קבצי הטסט שכללו לפחות טסט שנכשל
          failed_files=$(jq -rs '
            (map(select(.type == "testStart"))
              | map({(.test.id | tostring): .test})
              | add) as $tests
            | map(select(
                .type == "testDone"
                and (.result == "failure" or .result == "error")
                and (.hidden | not)
              ))
            | map($tests[.testID | tostring].url // empty)
            | map(select(. != ""))
            | map(ltrimstr("file://"))
            | unique
            | .[]
          ' test-results.json)

          if [ -z "$failed_files" ]; then
            echo "::error::הריצה הראשונה נכשלה אבל לא ניתן לחלץ רשימת קבצים שנכשלו"
            exit $first_exit
          fi

          echo ""
          echo "════════════════════════════════════════"
          echo "ריצה ראשונה נכשלה. מריץ שוב את קבצי הטסט הבאים:"
          echo "$failed_files" | sed 's/^/  /'
          echo "════════════════════════════════════════"
          echo ""

          files_array=()
          while IFS= read -r line; do
            [ -n "$line" ] && files_array+=("$line")
          done <<< "$failed_files"

          flutter test --file-reporter json:retry-results.json "${files_array[@]}"
          second_exit=$?

          if [ $second_exit -eq 0 ]; then
            echo ""
            echo "════════════════════════════════════════"
            echo "כל הטסטים עברו בהצלחה בריצה השנייה (retry)"
            echo "════════════════════════════════════════"
            {
              echo "## טסטים שעברו רק אחרי retry"
              echo ""
              echo "$failed_files" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ריצה שנייה נכשלה גם - מדפיסים בדיוק מה נכשל
          final_failed=$(jq -rs '
            (map(select(.type == "testStart"))
              | map({(.test.id | tostring): .test})
              | add) as $tests
            | map(select(
                .type == "testDone"
                and (.result == "failure" or .result == "error")
                and (.hidden | not)
              ))
            | map($tests[.testID | tostring])
            | map("- " + (.url // "unknown") + " :: " + .name)
            | .[]
          ' retry-results.json)

          echo ""
          echo "════════════════════════════════════════"
          echo "טסטים שנכשלו גם אחרי retry:"
          echo "════════════════════════════════════════"
          echo "$final_failed"
          echo "════════════════════════════════════════"

          {
            echo "## טסטים שנכשלו (גם אחרי retry)"
            echo ""
            echo "$final_failed"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $second_exit
