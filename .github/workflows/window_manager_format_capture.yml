name: Temporary nativeapi migration Dart formatting capture

on:
  pull_request:
    branches: [dev]
    paths: ['.github/workflows/window_manager_format_capture.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Capture exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          for file in test/core/window_persistence_test.dart test/text_book/view/text_book_screen_actions_test.dart integration_test/webview_render_check_test.dart test/core/windowing/app_window_controller_test.dart test/core/windowing/runner_window_channel_test.dart; do
            test -f "$file"
            dart format "$file"
            printf 'FORMAT_BEGIN %s\n' "$file"
            base64 -w 0 "$file"
            printf '\nFORMAT_END %s\n' "$file"
          done
