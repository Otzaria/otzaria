name: Engine SQLite Integration

# מנוע החיפוש בבניית האפליקציה אינו כולל SQLite ומקבל את זה של Dart דרך
# sqlite3_auto_extension. כשל ברישום בפלטפורמה אחת אינו נראה בשום טסט יחידה:
# האינדוקס נופל לטקסט באינדקס, והמילון המורפולוגי לא נטען כלל.
# Windows ו-Linux רצים בכל PR ב-flutter_tests.yml, על הבנייה שכבר נעשית שם.
# כאן Android, רק כשמשתנה מה שמשפיע על הרישום.

on:
  pull_request:
    branches:
      - main
      - dev
      - 'y-ploni/webview-*'
    paths:
      - ".github/workflows/engine_sqlite_integration.yml"
      - "integration_test/external_line_text_test.dart"
      - "lib/search/library_line_source.dart"
      - "lib/data/sqlite/**"
      # גרסת המנוע ו-package:sqlite3.
      - "pubspec.yaml"
  workflow_dispatch:
    inputs:
      android:
        description: Android (אמולטור)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: engine-sqlite-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Engine SQLite (Android emulator)
    if: github.event_name == 'pull_request' || inputs.android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # כמו build_android: בלי פינוי אין מקום ל-NDK, ל-llama.cpp ולתמונת האמולטור.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # האמולטור x86_64.
      - name: Install Rust for native source fallback
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: flutter pub get

      - name: Run engine SQLite integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: >-
            flutter test integration_test/external_line_text_test.dart -d emulator-5554 --flavor direct --timeout 10m
            --dart-define=OTZARIA_TEST_ZSTD_DICT="$(base64 < test/fixtures/line_content_codec/dict.zdict | tr -d '\r\n')"
