name: "צילום תמונות המתקין"

# מצלם את מסכי התכונות שבמתקין (installer/feature1-4.bmp) מתוך התוכנה ב-macOS, על
# הספרייה העדכנית ועם אינדקס שנבנה כאן, ופותח PR עם התמונות והשוואת לפני/אחרי.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: installer-screenshots
  cancel-in-progress: false

env:
  PREVIEW_BRANCH: installer-screenshots-preview

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare Flutter dependencies
        run: |
          flutter pub get
          dart run tool/generate_search_index.dart
          dart run tool/generate_settings_l10n.dart

      - name: Download latest library
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/library"
          books="$root/books"
          dl="$RUNNER_TEMP/downloads"
          mkdir -p "$books" "$dl"
          command -v zstd >/dev/null || brew install zstd

          # אותם מקורות כמו חבילות ה-FULL ב-build-and-announce.yml.
          fetch() { curl -L --fail --retry 3 -o "$dl/$2" "https://github.com/Otzaria/$1/releases/latest/download/$2"; }
          db_asset=$(bash tool/release/library_db_asset.sh download "$dl")
          fetch otzar-HB_catalog otzar-HB_catalog.db.zst
          fetch otzaria-library talmud_bavli_latest.tar.zst
          fetch SeforimMagicIndexer lexical.db

          # בניית האינדקס והצילום רצים על מסד רגיל; zdb מיוצא ב-zvfs_cli שנבנה מהמאגר הזה.
          bash tool/release/library_db_asset.sh expand "$db_asset" "$books/seforim.db"
          rm -f "$db_asset"
          zstd -d --long=31 --memory=2048MB "$dl/otzar-HB_catalog.db.zst" -o "$books/otzar-HB_catalog.db"
          # לא בצינור: bsdtar סוגר את הקלט בסמן סוף-הארכיון, ו-zstd נכשל ב-Broken pipe על הריפוד.
          zstd -d --long=31 --memory=2048MB "$dl/talmud_bavli_latest.tar.zst" -o "$dl/talmud.tar"
          tar -xf "$dl/talmud.tar" -C "$books"
          cp "$dl/lexical.db" "$books/lexical.db"

          # כמו בחבילת ה-FULL: בלי סימון גרסה התלמוד והמילון יורדים שוב בהפעלה.
          shasum -a 256 "$dl/talmud_bavli_latest.tar.zst" | cut -d' ' -f1 > "$books/תלמוד בבלי/.version"
          shasum -a 256 "$dl/lexical.db" | cut -d' ' -f1 > "$books/lexical.db.version"

          rm -rf "$dl"
          echo "OTZARIA_SHOTS_LIBRARY=$root" >> "$GITHUB_ENV"
          echo "OTZARIA_SHOTS_OUT=$RUNNER_TEMP/shots" >> "$GITHUB_ENV"

      - name: Build search index
        run: flutter test integration_test/installer_index_test.dart -d macos

      - name: Capture screenshots
        # פלט הבדיקה מודפס רק בסופה; תקיעה נראית כשקט מוחלט עד ה-timeout של ה-job.
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          ( while true; do screencapture -x "$RUNNER_TEMP/diag/screen-$(date +%H%M%S).png"; sleep 60; done ) &
          # מחסנית הנייטיב של האפליקציה אם היא עדיין רצה — מראה על מה ה-main thread עומד.
          ( for t in 480 360; do
              sleep $t
              pid=$(pgrep -f 'Debug/.*\.app/Contents/MacOS/' | head -1) || true
              [ -n "$pid" ] && sample "$pid" 5 -file "$RUNNER_TEMP/diag/sample-$(date +%H%M%S).txt"
            done ) &
          flutter test integration_test/installer_screenshots_test.dart -d macos

      - name: Upload diagnostics
        if: ${{ !success() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: installer-screenshots-diagnostics
          path: |
            ${{ runner.temp }}/diag/*
            ${{ runner.temp }}/shots/*.txt
            ${{ runner.temp }}/shots/_app_data/**/*.txt
          retention-days: 7

      - name: Upload screenshots
        uses: actions/upload-artifact@v7.0.1
        with:
          name: installer-screenshots
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 30

  pull-request:
    needs: capture
    # ההמרה ל-BMP נשענת על System.Drawing, שקיים רק ב-Windows.
    runs-on: windows-2022
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1

      - name: Download screenshots
        uses: actions/download-artifact@v8.0.1
        with:
          name: installer-screenshots
          path: ${{ runner.temp }}/shots

      - name: Update installer images
        shell: pwsh
        run: |
          ./tool/installer_screenshots/update_installer_images.ps1 `
            -ShotsDir (Join-Path $env:RUNNER_TEMP 'shots') `
            -PreviewDir (Join-Path $env:RUNNER_TEMP 'preview')

      - name: Open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- installer/; then
            echo "התמונות זהות לקיימות — אין מה לעדכן." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # תמונות ההשוואה יושבות בענף נפרד כדי שה-PR יוכל להציג אותן בלי להכניס PNG ל-dev.
          preview_dir="$RUNNER_TEMP/preview-branch"
          if git fetch --depth=1 origin "$PREVIEW_BRANCH"; then
            git worktree add -B "$PREVIEW_BRANCH" "$preview_dir" FETCH_HEAD
          else
            git worktree add --orphan -b "$PREVIEW_BRANCH" "$preview_dir"
          fi
          mkdir -p "$preview_dir/$GITHUB_RUN_ID"
          cp "$RUNNER_TEMP"/preview/*.png "$preview_dir/$GITHUB_RUN_ID/"
          git -C "$preview_dir" add "$GITHUB_RUN_ID"
          git -C "$preview_dir" commit -q -m "תמונות השוואה לריצה $GITHUB_RUN_ID"
          git -C "$preview_dir" push -q origin "$PREVIEW_BRANCH"
          raw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$(git -C "$preview_dir" rev-parse HEAD)/$GITHUB_RUN_ID"

          branch="installer-screenshots/$GITHUB_RUN_ID"
          git switch -c "$branch"
          git add installer/feature1.bmp installer/feature2.bmp installer/feature3.bmp installer/feature4.bmp
          git commit -q -m "מתקין: עדכון צילומי המסכים מתוך התוכנה" \
            -m "צולם אוטומטית ב-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push -q origin "$branch"

          captions=("ספר עם מפרשים" "לוח שנה" "ספרי PDF" "חיפוש מתקדם")
          {
            echo "צילומי מסכי התכונות שבמתקין, מתוך התוכנה עצמה על הספרייה העדכנית."
            echo
            echo "| | לפני | אחרי |"
            echo "|---|---|---|"
            for n in 1 2 3 4; do
              echo "| ${captions[$((n-1))]} | <img src=\"$raw/before-$n.png\" width=\"400\"> | <a href=\"$raw/full-$n.png\"><img src=\"$raw/after-$n.png\" width=\"400\"></a> |"
            done
            echo
            echo "לחיצה על תמונת \"אחרי\" פותחת את הצילום ברזולוציה מלאה."
            echo "הריצה: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/pr-body.md"

          # מדיניות הארגון עלולה לחסום יצירת PR מ-Actions; אז הענף כבר דחוף ונשאר קישור.
          if ! gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "מתקין: עדכון צילומי המסכים מתוך התוכנה" \
            --body-file "$RUNNER_TEMP/pr-body.md"; then
            {
              echo "## לא ניתן לפתוח PR אוטומטית"
              echo "[פתיחת ה-PR]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...$branch?expand=1) — העתק לתיאור את הטבלה שלמטה."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"
