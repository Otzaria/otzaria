name: Android Dart code size attribution

on:
  pull_request:
    paths:
      - '.github/workflows/android_code_size_audit.yml'
      - 'tool/release/audit_bundle_size.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-size:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      CARGO_HOME: ${{ github.workspace }}/.cargo
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore/audit.jks
      ANDROID_KEYSTORE_PASSWORD: auditpass
      ANDROID_KEY_ALIAS: audit
      ANDROID_KEY_PASSWORD: auditpass
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Prepare Android build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-36" ]; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36"
          fi
          if [ ! -d "$ANDROID_SDK_ROOT/build-tools/36.0.0" ]; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0"
          fi
          mkdir -p android/app/keystore
          keytool -genkeypair -v -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Otzaria Size Audit, O=Otzaria, C=IL"
      - name: Resolve locked dependencies and generate source catalogs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          if ! dart run tool/generate_search_index.dart; then
            # pdfium_dart's browser-download endpoint currently returns 504 on
            # hosted runners. The failed hook has already materialized its
            # deterministic shared output directory. Seed the exact pinned
            # Chromium 8125 asset through the GitHub API, then rerun the
            # unchanged hook; it accepts an existing output file.
            release_url='https://api.github.com/repos/bblanchon/pdfium-binaries/releases/tags/chromium%2F8125'
            release_json="$(curl --fail --location --retry 8 --retry-all-errors --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$release_url")"
            asset_url="$(jq -r '.assets[] | select(.name == "pdfium-linux-x64.tgz") | .url' <<<"$release_json")"
            test -n "$asset_url" && test "$asset_url" != null
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
              "$asset_url" -o "$RUNNER_TEMP/pdfium-8125.tgz"
            mapfile -t roots < <(find .dart_tool/hooks_runner/shared/pdfium_dart/build -mindepth 1 -maxdepth 1 -type d | sort)
            test "${#roots[@]}" -gt 0
            for root in "${roots[@]}"; do
              out="$root/chromium_8125/linux-x64"
              mkdir -p "$out"
              tar -xzf "$RUNNER_TEMP/pdfium-8125.tgz" -C "$RUNNER_TEMP" lib/libpdfium.so
              cp "$RUNNER_TEMP/lib/libpdfium.so" "$out/libpdfium.so"
            done
            printf '%s  %s\n' \
              '1c251efce460d67437a4c76d4be9033ae2f17bf5603f5bff1af10209b94ca723' \
              "$RUNNER_TEMP/lib/libpdfium.so" | sha256sum --check -
            dart run tool/generate_search_index.dart
          fi
          dart run tool/generate_settings_l10n.dart
      - name: Build one-ABI release with Flutter analyze-size
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/code-size"
          build() {
            flutter build apk --release \
              --target-platform android-arm64 \
              --analyze-size \
              --code-size-directory="$RUNNER_TEMP/code-size" \
              "--dart-define=OTZARIA_BUILD_COMMIT=$(git rev-parse --short=12 HEAD)"
          }
          if ! build; then
            # A separate native-assets invocation may request Android PDFium
            # even after the Linux generator used its local x64 binary.
            release_url='https://api.github.com/repos/bblanchon/pdfium-binaries/releases/tags/chromium%2F8125'
            release_json="$(curl --fail --location --retry 8 --retry-all-errors --retry-delay 2 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$release_url")"
            asset_url="$(jq -r '.assets[] | select(.name == "pdfium-android-arm64.tgz") | .url' <<<"$release_json")"
            test -n "$asset_url" && test "$asset_url" != null
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 2 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
              "$asset_url" -o "$RUNNER_TEMP/pdfium-android-8125.tgz"
            mkdir -p "$RUNNER_TEMP/pdfium-android"
            tar -xzf "$RUNNER_TEMP/pdfium-android-8125.tgz" -C "$RUNNER_TEMP/pdfium-android" lib/libpdfium.so
            mapfile -t roots < <(find .dart_tool/hooks_runner/shared/pdfium_dart/build -mindepth 1 -maxdepth 1 -type d | sort)
            test "${#roots[@]}" -gt 0
            for root in "${roots[@]}"; do
              out="$root/chromium_8125/android-arm64"
              mkdir -p "$out"
              cp "$RUNNER_TEMP/pdfium-android/lib/libpdfium.so" "$out/libpdfium.so"
            done
            build
          fi
          find "$RUNNER_TEMP/code-size" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-dart-code-size
          path: ${{ runner.temp }}/code-size/
          if-no-files-found: error
          retention-days: 30
