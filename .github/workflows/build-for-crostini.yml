name: "Build for Crostini"

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build_linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt update -y
          sudo apt install -y \
            clang cmake git ninja-build pkg-config \
            curl xz-utils zstd patchelf \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libcurl4-openssl-dev \
            libwpewebkit-1.0-dev \
            libwpebackend-fdo-1.0-dev \
            libwebkit2gtk-4.1-dev

      - name: Prepare Flutter dependencies
        shell: bash
        run: |
          flutter pub get

          # Prevent bundling the PDFium WASM assets into non-Web release builds.
          dart run pdfrx:remove_wasm_modules

          # Generate settings search index (.g.dart) — gitignored, regenerated per build.
          dart run tool/generate_search_index.dart

      - name: Build Flutter Linux app
        run: flutter build linux --release

      - name: Prepare app bundle
        shell: bash
        run: |
          BUILD_DIR=build/linux/x64/release
          LIBZSTD=libzstandard_linux.so

          cp $BUILD_DIR/plugins/zstandard_linux/zstd_build/$LIBZSTD $BUILD_DIR/bundle/lib/$LIBZSTD
          chmod 644 $BUILD_DIR/bundle/lib/$LIBZSTD

          RPATH=$(patchelf --print-rpath $BUILD_DIR/bundle/lib/libzstandard_linux_plugin.so)
          patchelf --set-rpath "\$ORIGIN:$RPATH" $BUILD_DIR/bundle/lib/libzstandard_linux_plugin.so

          tar -czf otzaria-linux-app.tar.gz -C $BUILD_DIR/bundle .

      - name: Activate fastforge
        run: dart pub global activate fastforge

      - name: Build Linux DEB package
        run: fastforge release --name=production --jobs=release-linux-deb --no-clean

      - name: Find Linux package
        id: find_packages
        shell: bash
        run: |
          # Find DEB file
          DEB_FILE=$(find dist -type f -name '*-linux.deb' | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            echo "deb_file=$DEB_FILE" >> $GITHUB_OUTPUT
            echo "deb_name=$(basename $DEB_FILE)" >> $GITHUB_OUTPUT
          fi

      - name: Prepare full bundle
        if: false
        shell: bash
        run: |
          LIBRARY=library_db
          BUNDLE=otzaria-linux-full

          mkdir -p $LIBRARY
          curl -Lf https://github.com/Otzaria/SeforimLibrary/releases/latest/download/seforim.db.zst -o $LIBRARY/seforim.db.zst
          curl -Lf https://github.com/Otzaria/otzar-HB_catalog/releases/latest/download/otzar-HB_catalog.db.zst -o $LIBRARY/otzar-HB_catalog.db.zst
          curl -Lf https://github.com/Otzaria/otzaria-library/releases/latest/download/talmud_bavli_latest.tar.zst -o $LIBRARY/talmud_bavli_latest.tar.zst

          rm -rf $BUNDLE
          mkdir -p $BUNDLE $BUNDLE/Otzaria

          cp -r build/linux/x64/release/bundle/. $BUNDLE
          zstd -d -c --long=31 --memory=2048MB $LIBRARY/seforim.db.zst > $BUNDLE/Otzaria/seforim.db
          zstd -d -c --long=31 --memory=2048MB $LIBRARY/otzar-HB_catalog.db.zst > $BUNDLE/Otzaria/otzar-HB_catalog.db
          zstd -d -c --long=31 --memory=2048MB $LIBRARY/talmud_bavli_latest.tar.zst | tar -xf - -C $BUNDLE/Otzaria

          tar -czf otzaria-linux-full.tar.gz -C $BUNDLE .

      - name: Upload linux deb package
        if: steps.find_packages.outputs.deb_file != ''
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-linux-deb
          path: ${{ steps.find_packages.outputs.deb_file }}
          archive: false

      - name: Upload linux app bundle
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-linux-app
          path: otzaria-linux-app.tar.gz
          archive: false

      - name: Upload linux full bundle
        uses: actions/upload-artifact@v7
        with:
          name: otzaria-linux-full
          path: otzaria-linux-full.tar.gz
          archive: false