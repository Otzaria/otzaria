name: "Build for Crostini"

permissions: 
  contents: write

on:
  workflow_dispatch:

jobs:
  build_linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Install Linux build dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            build-essential ninja-build clang cmake git \
            libgtk-3-dev liblzma-dev \
            libwpewebkit-1.0-dev \
            libwpebackend-fdo-1.0-dev \
            libwebkit2gtk-4.1-dev \
            libstdc++-12-dev
     
      - name: Upgrade Flutter dependencies
        run: |
          flutter pub upgrade

          # Prevent bundling the PDFium WASM assets into non-Web release builds.
          dart run pdfrx:remove_wasm_modules

          # Generate settings search index (.g.dart) — gitignored, regenerated per build.
          dart run tool/generate_search_index.dart

      - name: Build Flutter Linux app
        run: flutter build linux --release
      
      - name: Activate flutter_distributor
        run: dart pub global activate flutter_distributor
      
      - name: Build Linux DEB package
        run: flutter_distributor release --name=production --jobs=release-linux-deb
        
      - name: Find and prepare Linux packages
        id: find_packages
        run: |
          # Find DEB file
          DEB_FILE=$(find dist -type f -maxdepth 1 -name '*-linux.deb' | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            echo "deb_file=$DEB_FILE" >> $GITHUB_OUTPUT
            echo "deb_name=$(basename $DEB_FILE)" >> $GITHUB_OUTPUT
          fi
          
          # Also keep the raw build for compatibility
          mkdir -p linux-build
          cp -r build/linux/x64/release/bundle/* linux-build/
      
      - name: Upload Linux DEB package
        if: steps.find_packages.outputs.deb_file != ''
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-linux-deb
          path: ${{ steps.find_packages.outputs.deb_file }}
       
      - name: Upload linux build (raw)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: otzaria-linux-raw
          path: linux-build/*