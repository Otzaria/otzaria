name: Performance probe tools

on:
  pull_request:
    paths:
      - 'tool/perf_probe/**'
      - 'lib/core/diagnostics/**'
      - 'lib/plugins/services/plugin_webview_diagnostics.dart'
      - 'test/core/diagnostics/**'
      - 'test/plugins/services/plugin_webview_diagnostics_test.dart'
      - 'test/tool/perf_probe/webview_probe_metrics_test.dart'
      - 'integration_test/support/webview_probe_fixture.dart'
      - 'integration_test/support/webview_probe_metrics.dart'
      - 'integration_test/support/webview_probe_window.dart'
      - 'integration_test/support/perf_recorder.dart'
      - 'integration_test/webview_resource_probe_test.dart'
      - 'test_driver/webview_resource_probe.dart'
      - '.github/workflows/perf_probe.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode (results are never compared across modes)
        type: choice
        options: [profile, release, debug]
        default: profile
      cache_state:
        description: Application data state (OS caches are not cleared)
        type: choice
        options: [cold, warm]
        default: cold
      launches:
        description: Measured process launches
        type: number
        default: 3
      repetitions:
        description: Measured repetitions per action and launch
        type: number
        default: 5

permissions:
  contents: read

jobs:
  contracts:
    name: Sampler contracts (no performance thresholds)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate process identity and invariant CSV formatting
        shell: pwsh
        run: ./tool/perf_probe/test_sample_resources.ps1
      - name: Validate WebView fixture state and bounded observers
        run: node --test tool/perf_probe/test_webview_probe_fixture.mjs

  webview:
    name: Live WebView2 resource scenario (profile)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Resolve pinned dependencies
        shell: pwsh
        run: |
          git config --global core.longpaths true
          flutter pub get --enforce-lockfile
      - name: Validate process coverage with the real Windows host sampler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '${{ runner.temp }}/webview-probe' | Out-Null
          flutter test --no-pub --reporter expanded `
            test/core/diagnostics/process_tree_sampler_test.dart `
            test/core/diagnostics/process_tree_coverage_test.dart `
            test/core/diagnostics/frame_stats_overlay_test.dart `
            test/plugins/services/plugin_webview_diagnostics_test.dart `
            test/tool/perf_probe/webview_probe_metrics_test.dart `
            2>&1 | Tee-Object -FilePath '${{ runner.temp }}/webview-probe/process-coverage-tests.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the native scenario without performance thresholds
        shell: pwsh
        env:
          WEBVIEW_PROBE_REPORTS: ${{ runner.temp }}/webview-probe/host
          WEBVIEW_PROBE_DEVICE_OUTPUT: ${{ runner.temp }}/webview-probe/device
        run: |
          New-Item -ItemType Directory -Force -Path '${{ runner.temp }}/webview-probe' | Out-Null
          flutter drive --profile -d windows --no-pub `
            --driver=test_driver/webview_resource_probe.dart `
            --target=integration_test/webview_resource_probe_test.dart `
            --dart-define=WEBVIEW_PROBE_FLUTTER_VERSION=3.47.7 `
            --dart-define=WEBVIEW_PROBE_COMMIT=${{ github.sha }} `
            --dart-define=WEBVIEW_PROBE_IDLE_MS=1000 `
            2>&1 | Tee-Object -FilePath '${{ runner.temp }}/webview-probe/run.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve native observations and partial failures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: webview-resource-probe-windows-profile
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/webview-probe/run.log
            ${{ runner.temp }}/webview-probe/process-coverage-tests.log
            ${{ runner.temp }}/webview-probe/host/**/*.json
            ${{ runner.temp }}/webview-probe/device/**/phases.jsonl
            ${{ runner.temp }}/webview-probe/device/**/report.json

  desktop:
    name: Optional Windows measurements
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve pinned dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run isolated measurements
        shell: pwsh
        env:
          PROBE_MODE: ${{ inputs.mode }}
          PROBE_CACHE: ${{ inputs.cache_state }}
          PROBE_LAUNCHES: ${{ inputs.launches }}
          PROBE_REPETITIONS: ${{ inputs.repetitions }}
        run: |
          ./tool/perf_probe/run_perf_probe.ps1 -Mode $env:PROBE_MODE `
            -CacheState $env:PROBE_CACHE -Launches ([int]$env:PROBE_LAUNCHES) `
            -Repetitions ([int]$env:PROBE_REPETITIONS) `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'perf-results') `
            -HardwareId "github-hosted-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
      - name: Upload observations, including partial failures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: perf-${{ inputs.mode }}-${{ inputs.cache_state }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/perf-results/*.json
            ${{ runner.temp }}/perf-results/*.jsonl
            ${{ runner.temp }}/perf-results/*.csv
            ${{ runner.temp }}/perf-results/*.md
            ${{ runner.temp }}/perf-results/*.log
            ${{ runner.temp }}/perf-results/launch-*/*.json*
            ${{ runner.temp }}/perf-results/launch-*/*.log
