name: Implementation self-check 4425 causal clocks
on:
  push:
    branches: ['y-ploni/qa-4425-clock-implementation-20261107-a']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CLOCK_SELF_OUTPUT: ${{ runner.temp }}/clock-4425-implementation
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 5
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Focused copy formatting, contract tests and retained input replay
        run: python3 tool/perf_probe/qa_4425_clock_implementation.py
      - name: Preserve full implementation self-check evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: clock-4425-implementation-self-check
          path: ${{ runner.temp }}/clock-4425-implementation
          if-no-files-found: error
          retention-days: 14
