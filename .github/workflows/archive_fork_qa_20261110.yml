name: Archive fork QA matrix

on:
  push:
    branches:
      - qa/archive-fork-20261110

permissions:
  contents: read

jobs:
  validate-dart-package:
    name: Dart analyze + tests (${{ matrix.archive_branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        archive_branch:
          - qa/archive-final-integration-20261110
          - perf/tar-gzip-direct-streaming
    steps:
      - name: Checkout archive branch
        uses: actions/checkout@v4
        with:
          repository: Otzaria/archive
          ref: ${{ matrix.archive_branch }}
          persist-credentials: false
      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
      - name: Fetch package dependencies
        run: dart pub get
      - name: Analyze package
        run: dart analyze --fatal-infos
      - name: Run complete package tests
        run: dart test
