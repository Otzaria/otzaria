name: Release bundle size audit

on:
  pull_request:
    paths:
      - 'tool/release/audit_bundle_size.py'
      - 'tool/release/test_audit_bundle_size.py'
      - '.github/workflows/bundle_size_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-size-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tool/release -p test_audit_bundle_size.py -v

  release-apk-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch checksum-pinned released APK fixture (not a dev build)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/size-fixture"
          curl --fail --location --retry 3 --max-time 300 \
            'https://github.com/Otzaria/otzaria/releases/download/0.9.98.3%2B809/app-release.apk' \
            --output "$RUNNER_TEMP/size-fixture/app-release.apk"
          echo 'd17c0bfbd84c3848cac03f35781e02fe9845d7053bb4f7b9b6bde2f2305e051b  app-release.apk' \
            | (cd "$RUNNER_TEMP/size-fixture" && sha256sum --check -)
      - name: Inventory released APK without extracting or executing it
        shell: bash
        run: |
          python tool/release/audit_bundle_size.py "$RUNNER_TEMP/size-fixture/app-release.apk" \
            --target android-universal \
            --source-commit 463030539460ee49a175acb9bfaec8722b23c838 \
            --output "$RUNNER_TEMP/size-fixture/report.json"
          python - "$RUNNER_TEMP/size-fixture/report.json" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(json.dumps({k: v for k, v in report.items() if k != 'files'}, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk-0.9.98.3-809-size-inventory
          path: ${{ runner.temp }}/size-fixture/report.json
          if-no-files-found: error
          retention-days: 14
