name: QA 4427 macOS font candidate

on:
  push:
    branches: ['y-ploni/qa-4427-fonts-20261107-a']

permissions:
  contents: read

concurrency:
  group: qa-4427-macos-fonts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Bind this QA checkout to the frozen source candidate
        run: |
          python3 - <<'PY'
          import json, subprocess
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          candidate = '5dcd64785d2154df33faf0def6f0f30c20f04c53'
          expected_tree = '6e76b5c0c2f9f7549ea98f60a39e257315d7bd21'
          changes = git('diff', '--name-only', candidate, 'HEAD').splitlines()
          assert sorted(changes) == [".github/workflows/qa_4427_ios_fonts.yml",".github/workflows/qa_4427_macos_fonts.yml"], changes
          assert git('rev-parse', candidate + '^{tree}') == expected_tree
          assert git('rev-parse', 'HEAD^') == candidate
          print(json.dumps({'qaHead': git('rev-parse', 'HEAD'), 'sourceCandidate': candidate, 'sourceTree': expected_tree, 'qaOnlyFiles': changes}))
          PY
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Bootstrap negative controls and report validator
        run: |
          node --test tool/perf_probe/test_macos_plugin_fonts.mjs
          python3 -m unittest discover -s tool/perf_probe -p test_macos_plugin_fonts_report.py

  wkwebview:
    name: WKWebView fresh processes (${{ matrix.instances }} views)
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - instances: 1
            order: 'data scheme'
          - instances: 5
            order: 'scheme data'
          - instances: 10
            order: 'data scheme'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Bind this QA checkout to the frozen source candidate
        run: |
          python3 - <<'PY'
          import json, subprocess
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          candidate = '5dcd64785d2154df33faf0def6f0f30c20f04c53'
          expected_tree = '6e76b5c0c2f9f7549ea98f60a39e257315d7bd21'
          changes = git('diff', '--name-only', candidate, 'HEAD').splitlines()
          assert sorted(changes) == [".github/workflows/qa_4427_ios_fonts.yml",".github/workflows/qa_4427_macos_fonts.yml"], changes
          assert git('rev-parse', candidate + '^{tree}') == expected_tree
          assert git('rev-parse', 'HEAD^') == candidate
          print(json.dumps({'qaHead': git('rev-parse', 'HEAD'), 'sourceCandidate': candidate, 'sourceTree': expected_tree, 'qaOnlyFiles': changes}))
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build and run paired visible macOS applications
        env:
          PLUGIN_FONT_PROBE_REPORTS: ${{ runner.temp }}/plugin-font-reports
          FONT_PROBE_ORDER: ${{ matrix.order }}
          FONT_PROBE_INSTANCES: ${{ matrix.instances }}
        run: |
          set -uo pipefail
          mkdir -p "$PLUGIN_FONT_PROBE_REPORTS"
          failed=0
          for mode in $FONT_PROBE_ORDER; do
            if ! flutter drive --profile -d macos \
                --driver=test_driver/macos_plugin_fonts.dart \
                --target=integration_test/macos_plugin_font_probe_test.dart \
                --dart-define=OTZARIA_EXPERIMENTAL_MACOS_PLUGIN_FONTS=true \
                --dart-define=OTZARIA_FONT_PROBE_TRANSPORT="$mode" \
                --dart-define=OTZARIA_FONT_PROBE_INSTANCES="$FONT_PROBE_INSTANCES" \
                2>&1 | tee "$PLUGIN_FONT_PROBE_REPORTS/$mode.log"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Validate paired font and CSP evidence
        if: always()
        env:
          PLUGIN_FONT_PROBE_REPORTS: ${{ runner.temp }}/plugin-font-reports
        run: |
          python3 tool/perf_probe/compare_macos_plugin_fonts.py \
            "$PLUGIN_FONT_PROBE_REPORTS" --output "$PLUGIN_FONT_PROBE_REPORTS/comparison.json"
      - name: Retain reports, screenshots and build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-plugin-fonts-${{ matrix.instances }}-views
          path: ${{ runner.temp }}/plugin-font-reports
          if-no-files-found: error
          retention-days: 14
