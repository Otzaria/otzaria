name: Auto-Draft Failed CI

on:
  workflow_run:
    workflows: ['**', '!Auto-Draft Failed CI']
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  auto-draft:
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
          (github.event.workflow_run.conclusion == 'failure' ||
           github.event.workflow_run.conclusion == 'timed_out') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: auto-draft-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
      queue: max
    steps:
      # workflow_run's SHA is on the default branch, never the PR's head.
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Draft the PR and notify its author
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const autoDraft = require('./.github/scripts/auto-draft-failed-ci.cjs');
            await autoDraft({ github, context, core });
