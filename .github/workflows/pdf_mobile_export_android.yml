name: Android PDF file export

on:
  pull_request:
    branches: [main, dev]
    paths:
      - '.github/workflows/pdf_mobile_export_android.yml'
      - 'android/**'
      - 'lib/utils/file/mobile_pdf_export*'
      - 'integration_test/pdf_android_file_export_probe.dart'
      - 'tool/pdf_export_android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pdf-file-export-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  ORG_GRADLE_PROJECT_otzariaPdfExportProbe: 'true'

jobs:
  gate:
    uses: ./.github/workflows/ci_gate.yml
    permissions:
      contents: read
      pull-requests: read

  native:
    name: Real DocumentsUI, provider streams and cancellation / API 34
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free space for Android native tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Install pinned native build tools and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          bash .github/scripts/sdkmanager-install.sh \
            'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' \
            emulator 'system-images;android-34;google_apis;x86_64'
      - name: Validate host evidence contracts
        run: python3 -m unittest -v tool.pdf_export_android.test_android_pdf_export
      - name: Build the real Dart service and isolated native fixture
        run: |
          mkdir -p build/pdf-mobile-export-android
          flutter --version --machine > build/pdf-mobile-export-android/flutter.json
          python3 tool/pdf_export_android/run_android_pdf_export.py --record-source \
            --flutter-json build/pdf-mobile-export-android/flutter.json --output build/pdf-mobile-export-android
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub integration_test/pdf_android_file_export_probe.dart
          flutter build apk --debug --no-pub --flavor direct \
            --target integration_test/pdf_android_file_export_probe.dart --target-platform android-x64
      - name: Build instrumentation APK and run JVM contracts
        working-directory: android
        run: |
          ./gradlew :app:assembleDirectDebugAndroidTest :app:testDirectDebugUnitTest \
            -Ptarget="$GITHUB_WORKSPACE/integration_test/pdf_android_file_export_probe.dart" \
            -Ptarget-platform=android-x64 --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove real picker and native terminal ownership
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: >-
            python3 tool/pdf_export_android/run_android_pdf_export.py
            --device emulator-5554
            --app-apk build/app/outputs/flutter-apk/app-direct-debug.apk
            --test-apk build/app/outputs/apk/androidTest/direct/debug/app-direct-debug-androidTest.apk
            --aapt2 "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
            --flutter-json build/pdf-mobile-export-android/flutter.json
            --output build/pdf-mobile-export-android
      - name: Keep native evidence and failures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pdf-mobile-export-android-api34
          path: |
            build/pdf-mobile-export-android/
            build/app/test-results/testDirectDebugUnitTest/
          if-no-files-found: error
