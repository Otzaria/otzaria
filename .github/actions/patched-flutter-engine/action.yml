name: Install patched Flutter Windows engine
description: >
  Replaces the release-mode flutter_windows.dll (with its .pdb, .lib and .exp)
  in the Flutter SDK cache with the build from palmoni5/flutter, which fixes
  quadratic UI Automation GetVisibleRanges hangs (flutter/flutter#196183) and nested reparenting
  (flutter/flutter#175041, PR #195448). Fails the job when the download, the
  checksum or the
  Flutter engine revision does not match.

inputs:
  arch:
    description: Windows target architecture, x64 or arm64.
    required: true

runs:
  using: composite
  steps:
    - name: Replace flutter_windows.dll in the Flutter cache
      shell: pwsh
      env:
        ENGINE_ARCH: ${{ inputs.arch }}
        # TODO: כשתיקוני flutter/flutter#196183 ו-#195448 ביציב — למחוק פעולה זו, בדיקות hash אחרי
        # flutter build ואת סיומת cache-key ‏-patched-engine ב-build-and-announce.yml.
        ENGINE_REVISION: deb287481e3ce9468f3434937ced4240a70539ca
        ENGINE_RELEASE_URL: https://github.com/palmoni5/flutter/releases/download/otzaria-3.47.7-a11y.1
        ENGINE_SHA256_X64: cc04e8c75d7b8740b3b2705e87a9f9d6839366518ad1eb842e33c6efd2048818
        ENGINE_SHA256_ARM64: ed7d43bbc77af371cb44303d9484503417761c2ba36480982bc467552c888eab
      run: |
        $ErrorActionPreference = 'Stop'
        $expectedSha = switch ($env:ENGINE_ARCH) {
          'x64'   { $env:ENGINE_SHA256_X64 }
          'arm64' { $env:ENGINE_SHA256_ARM64 }
          default { throw "Unsupported arch '$env:ENGINE_ARCH'" }
        }

        $versionText = flutter --version --machine | Out-String
        if ($LASTEXITCODE -ne 0) { throw 'flutter --version failed' }
        $version = $versionText.Substring($versionText.IndexOf('{')) | ConvertFrom-Json
        if ($version.engineRevision -ne $env:ENGINE_REVISION) {
          throw "Patched engine is built for $env:ENGINE_REVISION but Flutter uses $($version.engineRevision). Rebuild it or remove this step."
        }

        # מוריד את ארטיפקטי Windows עכשיו: אחרת flutter build מחלץ אותם מחדש מעל הקבצים שלנו.
        flutter precache --windows
        if ($LASTEXITCODE -ne 0) { throw 'flutter precache --windows failed' }
        $engineDir = Join-Path $version.flutterRoot "bin\cache\artifacts\engine\windows-$env:ENGINE_ARCH-release"
        if (-not (Test-Path (Join-Path $engineDir 'flutter_windows.dll'))) {
          throw "Official engine not found in $engineDir"
        }

        $name = "flutter_windows-windows-$env:ENGINE_ARCH-release.zip"
        $zip = Join-Path $env:RUNNER_TEMP $name
        curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -o $zip "$env:ENGINE_RELEASE_URL/$name"
        if ($LASTEXITCODE -ne 0) { throw "Download of $name failed" }
        $actualSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
        if ($actualSha -ne $expectedSha) {
          throw "SHA-256 mismatch for $name`: expected $expectedSha, got $actualSha"
        }

        $unpacked = Join-Path $env:RUNNER_TEMP "patched-engine-$env:ENGINE_ARCH"
        Expand-Archive -LiteralPath $zip -DestinationPath $unpacked -Force
        foreach ($file in 'flutter_windows.dll', 'flutter_windows.dll.pdb', 'flutter_windows.dll.lib', 'flutter_windows.dll.exp') {
          Copy-Item -LiteralPath (Join-Path $unpacked $file) -Destination (Join-Path $engineDir $file) -Force
        }

        $dll = Join-Path $engineDir 'flutter_windows.dll'
        $dllSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash.ToLowerInvariant()
        flutter precache --windows
        if ($LASTEXITCODE -ne 0) { throw 'flutter precache --windows failed' }
        if ((Get-FileHash -Algorithm SHA256 -LiteralPath $dll).Hash.ToLowerInvariant() -ne $dllSha) {
          throw 'flutter precache replaced the patched flutter_windows.dll'
        }
        "PATCHED_FLUTTER_DLL_SHA256=$dllSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "Patched flutter_windows.dll ($env:ENGINE_ARCH, sha256 $dllSha) installed in $engineDir"
