name: Personal notes independent QA

on:
  push:
    branches: [qa/personal-notes-followup-20261105]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-notes-independent-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Replace this only after the product snapshot, including #4303, is frozen.
      PRODUCT_SHA: 'fe27937a7e368bfc3d7d51203fe9497b186fbcb4'
      BASE_SHA: '2ba2e6d76b53e7c72f37d048023f41d150f9702f'
      QA_BUNDLE_DIR: ${{ runner.temp }}/personal-notes-qa-bundle
      QA_OUT_DIR: ${{ runner.temp }}/personal-notes-qa-results
      TZ: Asia/Jerusalem
      OTZARIA_REQUIRE_SEARCH_ENGINE: '1'
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Check out the QA branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Keep QA outside the checkout and select the exact product commit
        id: product
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, shutil, subprocess
          product = os.environ['PRODUCT_SHA']
          if not re.fullmatch('[0-9a-f]{40}', product):
              raise SystemExit('Set PRODUCT_SHA to the frozen 40-character product commit.')
          bundle = Path(os.environ['QA_BUNDLE_DIR'])
          shutil.copytree('qa/personal-notes-followup', bundle)
          subprocess.run(['git', 'checkout', '--detach', product], check=True)
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          dirty = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True).strip()
          if actual != product or dirty:
              raise SystemExit('The product checkout is not the requested clean snapshot: ' + dirty)
          PY

      - name: Set up the repository's Flutter version
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # Ubuntu widget-test CI already provides clang, cmake and pkg-config.
      # Rust is explicit for a Git-pinned crate with no downloadable binary.
      - name: Set up Rust native source fallback
        uses: dtolnay/rust-toolchain@stable

      - name: Enforced dependencies, format, analyze and the complete selected gate
        id: gate
        shell: bash
        run: |
          python3 "$QA_BUNDLE_DIR/run_qa.py" \
            --repo "$GITHUB_WORKSPACE" --product-sha "$PRODUCT_SHA" \
            --base-sha "$BASE_SHA" --out "$QA_OUT_DIR" --phase gate

      - name: Prove the original export-selection regression and restore exact source
        if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
        shell: bash
        run: |
          python3 "$QA_BUNDLE_DIR/run_qa.py" \
            --repo "$GITHUB_WORKSPACE" --product-sha "$PRODUCT_SHA" \
            --base-sha "$BASE_SHA" --out "$QA_OUT_DIR" --phase red

      - name: Render real UI captures outside the product checkout
        if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
        shell: bash
        run: |
          python3 "$QA_BUNDLE_DIR/run_qa.py" \
            --repo "$GITHUB_WORKSPACE" --product-sha "$PRODUCT_SHA" \
            --base-sha "$BASE_SHA" --out "$QA_OUT_DIR" --phase captures

      - name: Write combined JSON and artifact checksums
        if: ${{ always() && steps.product.outcome == 'success' }}
        shell: bash
        run: |
          python3 "$QA_BUNDLE_DIR/run_qa.py" \
            --repo "$GITHUB_WORKSPACE" --product-sha "$PRODUCT_SHA" \
            --base-sha "$BASE_SHA" --out "$QA_OUT_DIR" --phase summarize

      - name: Pack logs, JSON, source manifest and PNGs
        if: ${{ always() && steps.product.outcome == 'success' }}
        shell: bash
        run: tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/personal-notes-qa-artifacts.tar" personal-notes-qa-results

      - name: Upload evidence even when a gate fails
        if: ${{ always() && steps.product.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: personal-notes-independent-qa-${{ env.PRODUCT_SHA }}
          path: ${{ runner.temp }}/personal-notes-qa-artifacts.tar
          if-no-files-found: error
