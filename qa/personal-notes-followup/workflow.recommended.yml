name: Personal notes capture continuation

on:
  push:
    branches: [qa/personal-notes-followup-20261105]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: personal-notes-independent-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Replace this only after the product snapshot, including #4303, is frozen.
      PRODUCT_SHA: 'fe27937a7e368bfc3d7d51203fe9497b186fbcb4'
      BASE_SHA: '2ba2e6d76b53e7c72f37d048023f41d150f9702f'
      TZ: Asia/Jerusalem
      OTZARIA_REQUIRE_SEARCH_ENGINE: '1'
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Check out the QA branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Keep QA outside the checkout and select the exact product commit
        id: product
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, shutil, subprocess
          product = os.environ['PRODUCT_SHA']
          if not re.fullmatch('[0-9a-f]{40}', product):
              raise SystemExit('Set PRODUCT_SHA to the frozen 40-character product commit.')
          qa_temp = Path(os.environ['RUNNER_TEMP'])
          bundle = qa_temp / 'personal-notes-qa-bundle'
          output = qa_temp / 'personal-notes-qa-results'
          shutil.copytree('qa/personal-notes-followup', bundle)
          subprocess.run(['git', 'checkout', '--detach', product], check=True)
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          dirty = subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True).strip()
          if actual != product or dirty:
              raise SystemExit('The product checkout is not the requested clean snapshot: ' + dirty)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as export_file:
              export_file.write(f'QA_BUNDLE_DIR={bundle}\n')
              export_file.write(f'QA_OUT_DIR={output}\n')
          PY

      - name: Set up the repository's Flutter version
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # Ubuntu widget-test CI already provides clang, cmake and pkg-config.
      # Rust is explicit for a Git-pinned crate with no downloadable binary.
      - name: Set up Rust native source fallback
        uses: dtolnay/rust-toolchain@stable

      - name: Download the original immutable QA artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: '13450021903'
          run-id: '42099805004'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Otzaria/otzaria
          path: ${{ runner.temp }}/personal-notes-prior-download
          digest-mismatch: error

      - name: Verify pinned evidence and inherit only the passing gate and RED
        id: evidence
        shell: bash
        run: |
          python3 "$QA_BUNDLE_DIR/resume_captures.py" \
            --repo "$GITHUB_WORKSPACE" --product-sha "$PRODUCT_SHA" \
            --base-sha "$BASE_SHA" --out "$QA_OUT_DIR" --phase prepare \
            --prior-tar "$RUNNER_TEMP/personal-notes-prior-download/personal-notes-qa-artifacts.tar"

      - name: Install exactly locked dependencies for the new capture process
        id: dependencies
        shell: bash
        run: |
          flutter pub get --enforce-lockfile 2>&1 | tee "$QA_OUT_DIR/capture-dependencies.log"
          flutter --version --machine > "$QA_OUT_DIR/capture-flutter-version.json"
          python3 - <<'PYVERSION'
          from pathlib import Path
          import json, os
          out = Path(os.environ['QA_OUT_DIR'])
          version = json.loads((out / 'capture-flutter-version.json').read_text())
          if version.get('frameworkVersion') != '3.47.7':
              raise SystemExit('Capture continuation used an unexpected Flutter version.')
          PYVERSION

      - name: Render fresh UI captures without rerunning the gate or RED
        id: captures
        shell: bash
        run: |
          python3 "$QA_BUNDLE_DIR/run_qa.py" \
            --repo "$GITHUB_WORKSPACE" --product-sha "$PRODUCT_SHA" \
            --base-sha "$BASE_SHA" --out "$QA_OUT_DIR" --phase captures

      - name: Combine inherited gate and RED with new captures and explicit provenance
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        shell: bash
        run: |
          python3 "$QA_BUNDLE_DIR/resume_captures.py" \
            --repo "$GITHUB_WORKSPACE" --product-sha "$PRODUCT_SHA" \
            --base-sha "$BASE_SHA" --out "$QA_OUT_DIR" --phase summarize

      - name: Pack logs, JSON, original evidence archive and new PNGs
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        shell: bash
        run: tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/personal-notes-qa-capture-artifacts.tar" personal-notes-qa-results

      - name: Upload capture evidence even on failure
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: personal-notes-capture-continuation-${{ env.PRODUCT_SHA }}
          path: ${{ runner.temp }}/personal-notes-qa-capture-artifacts.tar
          if-no-files-found: error
