sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: otzariaorg

# התקנת ההוק: dart run tool/install_git_hooks.dart
dart_pre_commit:
  exclude:
    - '^packages/'
    - '^build/'
    - '\.g\.dart$'
    - '\.freezed\.dart$'
    - '\.mocks\.dart$'
  format: true
  analyze: true
  # כבויים: תלויות רבות מוצמדות בכוונה, וזה היה חוסם כל קומיט.
  outdated: false
  pull-up-dependencies: false
