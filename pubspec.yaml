name: otzaria
description: "A Jewish books library."
publish_to: "none"

msix_config:
  display_name: "אוצריא"
  display_name_short: "אוצריא"
  publisher_display_name: "אוצריא"
  identity_name: F8854998.otzaria
  description: "ספריית ספרים יהודיים עם אפשרויות חיפוש חכם"
  msix_version: 0.9.96.0
  logo_path: assets/icon/iconnew.png
  publisher: CN=B3B520D1-500C-4859-986C-448583CC927B
  capabilities: "internetClient"
  sign_msix: false
  install_certificate: false
  app_installer:
    publish_folder_path: C:\dev\otzaria\build\windows\x64\runner\Release
    hours_between_update_checks: 24
    automatic_background_task: true
    update_blocks_activation: true
    show_prompt: true
    force_update_from_any_version: false


version: 0.9.96+90960

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  sentry_flutter: ^9.25.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.1.0
  flutter_localizations:
    sdk: flutter
  flutter_settings_screens: ^0.3.4
  hive_ce: ^2.19.3
  path_provider: ^2.1.6
  html: ^0.15.6
  pdfrx: ^2.4.7
  url_launcher: ^6.3.2
  flutter_widget_from_html: ^0.17.2
  scrollable_positioned_list: ^0.3.8
  fuzzywuzzy: ^1.2.0
  flutter_svg: ^2.3.0  
  fluentui_system_icons: ^1.1.273
  otzaria_icons:
    git:
      url: https://github.com/Otzaria/otzaria_icons
  file_picker: 12.0.0-beta.7
  provider: ^6.1.5+1
  multi_split_view: ^3.6.2
  updat: ^1.4.0
  printing: ^5.15.0
  pdf: ^3.13.0
  kosher_dart: ^2.0.20
  archive: ^4.0.9
  package_info_plus: ^10.2.1
  convert: ^3.1.2
  crypto: ^3.0.7
  path: ^1.9.1
  http: ^1.6.0
  zstandard: ^1.5.0
  zstandard_native: ^1.5.0
  ffi: ^2.2.0
  win32: ^6.3.0
  win32_registry: ^3.0.3
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3
  characters: ^1.4.1
  collection: ^1.19.1
  otzaria_search_engine: ^0.7.4
  seforim_library_updater:
    git:
      url: https://github.com/Otzaria/otzaria_library_updater
      ref: 1c842aedbbb90af8a60632636399909e43521f10
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  flutter_spinbox: ^0.13.1
  toggle_switch: ^2.3.0
  logging: ^1.3.0
  sqlite3: ^3.5.0
  super_clipboard: ^0.9.1
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_single_instance: ^1.7.0
  xml: ^7.0.1
  markdown: ^7.3.1
  flutter_markdown: ^0.7.7+1
  system_fonts: ^1.0.1
  flutter_quill: ^11.5.1
  flutter_inappwebview:
    git:
      url: https://github.com/Otzaria/flutter_inappwebview
      ref: master
      path: flutter_inappwebview
  # נדרש ישירות עבור WindowsFileDropManager (גרירת קבצים אל החלון).
  flutter_inappwebview_windows: any
  custom_mouse_cursor: ^1.1.3

dependency_overrides:
  matcher: ^0.12.20
  analyzer: ^12.1.0
  device_info_plus: ^13.2.0
  # הגרסה שב-pub.dev חסרה את תיקון גלילת הטאצ'פד.
  flutter_inappwebview_windows:
    git:
      url: https://github.com/Otzaria/flutter_inappwebview
      ref: master
      path: flutter_inappwebview_windows

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/iconnew.png"
  web:
    generate: true
    image_path: "assets/icon/iconnew.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
  remove_alpha_ios: true
  image_path: "assets/icon/iconnew.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  windows:
    generate: true
    image_path: "assets/icon/iconnew.png"
    icon_size: 256 # min:48, max:256, default: 48

dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  # מחולל spec.json של התוספים (tool/plugins) מפרסר AST של קוד המקור.
  # מוצמד ל-major: צורת ה-AST משתנה בין גרסאות ראשיות ושוברת את המחולל.
  analyzer: ^12.1.0
  # לטעינת ספריית המנוע הנייטיבית בטסטים (ExternalLibrary).
  flutter_rust_bridge: ^2.12.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.31.0
  build_runner: ^2.15.2
  bloc_test: ^10.0.0
  mockito: ^5.7.0
  mocktail: ^1.0.5
  hooks: ^2.0.2
  dart_pre_commit: ^6.1.3
  msix: ^3.18.0
  vm_service: ^15.2.0

flutter:
  # התוספים הנייטיביים (search_engine מבוסס cargokit, printing) לא תומכים ב-SPM.
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/
    - assets/logos/
    - assets/ca/
    - assets/icon/שמור וזכור מקור.png
    - assets/icon/שמור וזכור שחור ריק.png
    - assets/icon/shamor_zachor_with_v.png
    - assets/icon/iconnew.png
    - assets/icon/mount_sinai_tablets.svg
    - assets/icon/otzplugin_file_icon.png
    - assets/logo_books/
    - lib/migration/database/sql/
    - assets/dictionary.json
    - assets/Acronyms.json
    - assets/support_organizations.json

  fonts:
    - family: TaameyAshkenaz
      fonts:
        - asset: fonts/TaameyAshkenaz-Medium.ttf
    - family: FrankRuhlCLM
      fonts:
        - asset: fonts/FrankRuehlCLM-Medium.ttf
        - asset: fonts/FrankRuehlCLM-Bold.ttf
          weight: 700
    - family: Rubik
      fonts:
        - asset: fonts/Rubik-VariableFont_wght.ttf
    - family: NotoRashiHebrew
      fonts:
        - asset: fonts/NotoRashiHebrew-VariableFont_wght.ttf
    - family: TaameyDavidCLM
      fonts:
        - asset: fonts/TaameyDavidCLM-Medium.ttf
    - family: Shofar
      fonts:
        - asset: fonts/ShofarRegular.ttf
    - family: KeterYG
      fonts:
        - asset: fonts/KeterYG-Medium.ttf
    - family: Tinos
      fonts:
        - asset: fonts/Tinos-Regular.ttf
    - family: NotoSerifHebrew
      fonts:
        - asset: fonts/NotoSerifHebrew-VariableFont_wdth,wght.ttf

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: otzariaorg

# התקנת ההוק: dart run tool/install_git_hooks.dart
dart_pre_commit:
  exclude:
    - '^packages/'
    - '^build/'
    - '\.g\.dart$'
    - '\.freezed\.dart$'
    - '\.mocks\.dart$'
  format: true
  analyze: true
  # כבויים: תלויות רבות מוצמדות בכוונה, וזה היה חוסם כל קומיט.
  outdated: false
  pull-up-dependencies: false
