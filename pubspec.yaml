name: otzaria
description: "A Jewish books library."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

msix_config:
  display_name: "אוצריא"
  display_name_short: "אוצריא"
  publisher_display_name: "אוצריא"
  identity_name: F8854998.otzaria
  description: "ספריית ספרים יהודיים עם אפשרויות חיפוש חכם"
  msix_version: 0.9.94.0
  logo_path: assets/icon/iconnew.png
  publisher: CN=B3B520D1-500C-4859-986C-448583CC927B
  capabilities: "internetClient"
  sign_msix: false
  install_certificate: false
  app_installer:
    publish_folder_path: C:\dev\otzaria\build\windows\x64\runner\Release
    hours_between_update_checks: 24
    automatic_background_task: true
    update_blocks_activation: true
    show_prompt: true
    force_update_from_any_version: false


# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.9.94+90940

environment:
  sdk: ">=3.2.6 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  sentry_flutter: ^9.20.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.8
  flutter_localizations:
    sdk: flutter
  flutter_settings_screens: ^0.3.4
  hive_ce: ^2.19.3
  path_provider: ^2.1.5
  html: ^0.15.6
  pdfrx: ^2.4.3
  url_launcher: ^6.3.2
  flutter_widget_from_html: ^0.17.2
  scrollable_positioned_list: ^0.3.8
  fuzzywuzzy: ^1.2.0
  flutter_svg: ^2.3.0  
  fluentui_system_icons: ^1.1.273
  file_picker: ^11.0.2
  provider: ^6.1.5+1
  multi_split_view: ^3.6.2
  updat: ^1.4.0
  printing:
  pdf: ^3.12.0
  kosher_dart: ^2.0.20
  archive: ^4.0.9
  package_info_plus: ^9.0.1
  crypto: ^3.0.7
  path: ^1.9.1
  http: ^1.6.0
  zstandard: ^1.5.0
  zstandard_native: ^1.5.0
  ffi: ^2.2.0
  win32: ^5.15.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.2
  characters: ^1.4.1
  collection: ^1.19.1
  otzaria_search_engine: ^0.6.5
  window_manager: ^0.5.1
  flutter_spinbox: ^0.13.1
  toggle_switch: ^2.3.0
  logging: ^1.3.0
  sqlite3: ^3.3.3
  super_clipboard: ^0.9.1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  flutter_single_instance: ^1.7.0
  xml: ^7.0.1
  flutter_markdown: ^0.7.7
  system_fonts: ^1.0.1
  flutter_quill: ^11.5.1
  flutter_inappwebview:
    git:
      url: https://github.com/Otzaria/flutter_inappwebview
      path: flutter_inappwebview

dependency_overrides:
  #  it forces the version of the intl package to be 0.19.0 across all dependencies, even if some packages specify a different compatible version.
  matcher: ^0.12.18
  analyzer: any
  # win32 5.10.1 הסיר את הקבוע הגלובלי GMEM_MOVEABLE שעליו מסתמך
  # quill_native_bridge_windows 0.0.2, מה ששבר את בניית Windows.
  # 5.15.0 מחזירה את הקבוע. ראה quill_native_bridge_windows.dart:138.
  win32: ^5.15.0

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/iconnew.png"
  web:
    generate: true
    image_path: "assets/icon/iconnew.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
  remove_alpha_ios: true
  image_path: "assets/icon/iconnew.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  windows:
    generate: true
    image_path: "assets/icon/iconnew.png"
    icon_size: 256 # min:48, max:256, default: 48

dev_dependencies:
  sentry_dart_plugin: ^3.3.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  test: ^1.30.1
  build_runner: ^2.15.0
  bloc_test: ^10.0.0
  mockito: ^5.6.4
  mocktail: ^1.0.5
  hooks: ^2.0.2
  dart_pre_commit: ^6.1.3
  msix: ^3.16.13
  markdown: ^7.3.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # כיבוי Swift Package Manager: התוספים הנייטיביים (search_engine מבוסס Rust/
  # cargokit, printing וכו') עדיין לא תומכים ב-SPM, ו-cargokit ננטש (archived).
  # נשארים על CocoaPods עד שיתייצב Dart Native Assets ב-flutter_rust_bridge.
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/logos/
    - assets/ca/
    - assets/icon/שמור וזכור מקור.png
    - assets/icon/שמור וזכור שחור ריק.png
    - assets/icon/shamor_zachor_with_v.png
    - assets/icon/iconnew.png
    - assets/icon/mount_sinai_tablets.svg
    - assets/icon/otzplugin_file_icon.png
    - lib/migration/database/sql/
    - assets/dictionary.json
    - assets/Acronyms.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For

  fonts:
    - family: TaameyAshkenaz
      fonts:
        - asset: fonts/TaameyAshkenaz-Medium.ttf
    - family: FrankRuhlCLM
      fonts:
        - asset: fonts/FrankRuehlCLM-Medium.ttf
    - family: Rubik
      fonts:
        - asset: fonts/Rubik-VariableFont_wght.ttf
    - family: NotoRashiHebrew
      fonts:
        - asset: fonts/NotoRashiHebrew-VariableFont_wght.ttf
    - family: TaameyDavidCLM
      fonts:
        - asset: fonts/TaameyDavidCLM-Medium.ttf
    - family: Shofar
      fonts:
        - asset: fonts/ShofarRegular.ttf
    - family: KeterYG
      fonts:
        - asset: fonts/KeterYG-Medium.ttf
    - family: Tinos
      fonts:
        - asset: fonts/Tinos-Regular.ttf
    - family: NotoSerifHebrew
      fonts:
        - asset: fonts/NotoSerifHebrew-VariableFont_wdth,wght.ttf

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: otzariaorg

# Pre-commit hook configuration (https://pub.dev/packages/dart_pre_commit)
# Runs `dart format` and `dart analyze` automatically on staged files before
# every commit. To install the hook locally run:
#     dart run tool/install_git_hooks.dart
dart_pre_commit:
  exclude:
    - '^packages/'
    - '^build/'
    - '\.g\.dart$'
    - '\.freezed\.dart$'
    - '\.mocks\.dart$'
  # format runs always – uses dart default line length
  format: true
  # analyze runs always – reject on any lint/info level issue
  analyze: true
  # Disabled: many transitive packages are intentionally pinned and would
  # block every commit. Run `flutter pub outdated` manually when needed.
  outdated: false
  # Disabled: would block commits unrelated to dependency changes. Run
  # `flutter pub upgrade` manually when dependency tightening is desired.
  pull-up-dependencies: false
