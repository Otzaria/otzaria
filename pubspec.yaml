name: otzaria
description: "A Jewish books library."
publish_to: "none"

msix_config:
  display_name: "אוצריא"
  display_name_short: "אוצריא"
  publisher_display_name: "אוצריא"
  identity_name: F8854998.otzaria
  description: "ספריית ספרים יהודיים עם אפשרויות חיפוש חכם"
  msix_version: 0.9.98.2
  logo_path: assets/icon/icon.png
  publisher: CN=B3B520D1-500C-4859-986C-448583CC927B
  capabilities: "internetClient"
  sign_msix: false
  install_certificate: false
  app_installer:
    publish_folder_path: C:\dev\otzaria\build\windows\x64\runner\Release
    hours_between_update_checks: 24
    automatic_background_task: true
    update_blocks_activation: true
    show_prompt: true
    force_update_from_any_version: false


version: 0.9.98+99802

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  sentry_flutter: ^9.30.1
  flutter:
    sdk: flutter
  otzaria_context_menu:
    path: packages/otzaria_context_menu
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  flutter_localizations:
    sdk: flutter
  # נסיגת ההגדרות כשפתיחת Hive נכשלת (SharePreferenceCache).
  shared_preferences: ^2.5.6
  hive_ce: ^2.22.0
  path_provider: ^2.1.6
  # RAM פיזי לגודל ה-cache של SQLite בעדכון הספרייה ב-mobile.
  device_info_plus: ^13.3.0
  html: ^0.15.7
  pdfrx: ^2.11.0
  # FPDF_ImportNPagesToOne: הדפסת כמה עמודים בגיליון נשארת וקטורית.
  pdfium_dart: ^0.4.0
  url_launcher: ^6.3.3
  # ליבה בלבד: החבילה המורחבת רושמת בעלייה plugins של וידאו/אודיו/WebView.
  flutter_widget_from_html_core: ^0.17.4
  # פרסר ה-CSS של fwfh: מסלול הספאנים מפרש את style בדיוק כמוהו.
  csslib: ^1.0.2
  fwfh_svg: ^0.16.1
  fwfh_url_launcher: ^0.16.1
  positioned_sliver_list: ^0.2.4
  flutter_svg: ^2.3.0  
  fluentui_system_icons: ^1.1.273
  # בעדכון ה-ref יש לרענן את רשימת האייקונים לתוספים
  # לפי הפקודה שב-docs/plugin-sdk/ICONS.md.
  otzaria_icons:
    git:
      url: https://github.com/Otzaria/otzaria_icons
      ref: 483fec355339f54f9e094994a106dad9a63b82e3
  file_picker_darwin: ^2.4.0
  file_picker: ^13.1.0
  # FilePickerWindowsOptions: בעלים מפורש לדיאלוג (חלון Dart ולא החלון שבחזית).
  windows_file_picker: ^2.0.1
  provider: ^6.1.5+1
  printing: ^5.15.1
  pdf: ^3.13.1
  # OpenType shaping, so nikud and te'amim reach a PDF as vector text
  # rather than as an image of text.
  opentype_shaper: ^0.3.1
  # The Unicode bidi algorithm, used to order the runs of a mixed line before
  # they are placed. Already in the graph through `pdf`; declared for direct use.
  bidi: ^2.0.13
  kosher_dart: ^2.0.20
  archive: ^4.5.2
  posix: ^6.5.2
  package_info_plus: ^10.2.2
  convert: ^3.1.2
  crypto: ^3.0.7
  # גופן הסת"ם של "תיקון קוראים"; הגרסה ננעלת ב-pubspec.lock.
  otzaria_ashurit:
    git:
      url: https://github.com/palmoni5/otzaria-ashurit.git
      ref: v1.005
      path: package
  # ed25519 לאימות עדכוני מסדים מצורפים — Dart טהור, בלי תלויות.
  pinenacl: ^0.6.0
  path: ^1.9.1
  http: ^1.6.0
  zstandard: ^1.5.0
  zstandard_native: ^1.5.0
  ffi: ^2.2.0
  win32: ^6.4.0
  win32_registry: ^3.0.3
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.4
  characters: ^1.4.1
  collection: ^1.19.1
  otzaria_search_engine:
    git:
      url: https://github.com/Otzaria/otzaria_search_engine.git
      ref: d8ebace9d55f73a6e0baa2f794d55a97efd95e28
  # חוזה הדיווחים מול השרת, משותף עם "עדכוני אוצריא" (Dart טהור).
  otzaria_report_contract:
    path: packages/otzaria_report_contract
  seforim_library_updater:
    git:
      url: https://github.com/Otzaria/otzaria_library_updater
      ref: a9257039324cf98c8be0648b35675b3be9ba3494
  # הפורק מסנן הודעות חלון לפי HWND, כדי שמצב החלון הראשי לא יחול על חלונות
  # נוספים, ומקבע את קצוות שינוי הגודל לפי המסך תחת RTL (#3187). ב-master של
  # upstream הקוד הזה הוסר (שכתוב לקראת 0.6.0, שטרם שוחרר).
  # TODO: לחזור לגרסה הרשמית מ-pub.dev אחרי שחרור 0.6.0 (תמיכה בריבוי חלונות).
  window_manager:
    git:
      url: https://github.com/Otzaria/window_manager
      ref: 4f37655288ce8b803a9bd50294c5d6983850f622
      path: packages/window_manager
  screen_retriever: ^0.2.2
  flutter_spinbox: ^0.13.1
  logging: ^1.3.0
  sqlite3: ^3.7.1
  super_clipboard: ^0.9.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  xml: ^7.0.1
  markdown: ^7.3.1
  flutter_markdown: ^0.7.7+1
  flutter_quill: ^11.6.0
  # הפורק Otzaria/flutter_inappwebview מתוחזק אצלנו (upstream אינו פעיל).
  # כל ה-overrides מוצמדים לאותו קומיט.
  flutter_inappwebview:
    git:
      url: https://github.com/Otzaria/flutter_inappwebview
      ref: 4a4e082eb9d7e8078fc0878ff4e028e121663b10
      path: flutter_inappwebview
  # נדרש ישירות עבור WindowsFileDropManager (גרירת קבצים אל החלון).
  flutter_inappwebview_windows: any
  # נדרש ישירות עבור LinuxWebViewHostWindow (WebView בחלונות נוספים).
  flutter_inappwebview_linux: any
  wakelock_plus: ^1.8.1

dependency_overrides:
  # TODO: להחזיר ל-pub.dev כשיתמזג וישוחרר MaikuB/flutter_local_notifications#2826
  # (קריאות WinRT ב-thread ייעודי, כולל תיקון ה-deadlock ב-invoke). עד אז הפורק
  # Otzaria, מוצמד לקומיט.
  # בהסרה: למחוק גם את core.longpaths מ-workflows של Windows - הוא נדרש
  # רק בגלל הנתיב העמוק במונורפו הזה.
  flutter_local_notifications_windows:
    git:
      url: https://github.com/Otzaria/flutter_local_notifications
      ref: 77e31035890167e782bccfd4982e0d1309f9e2e0
      path: flutter_local_notifications_windows
  # TODO: להחזיר ל-pub.dev כשימוזגו וישוחררו getsentry/sentry-dart#4094 ו-#4126 (ה-backport ל-9.x בענף
  # fix/9.x-windows-scope-sync-worker: טעינת sentry.dll, sentry_init ועדכוני ה-scope ב-isolate עזר ב-Windows).
  sentry_flutter:
    git:
      url: https://github.com/Otzaria/sentry-dart
      ref: 93e7398355e80557a342666f98b23cc9bb832848
      path: packages/flutter
  # TODO: לחזור ל-pub.dev אחרי שחרור DavBfr/dart_pdf#1984, #1985, #1986, #1987, #1988, #1993, #1994, #1995, #1996
  # (הדפסה ב-Windows ב-thread נפרד, PDFium עצל ופרטי, השלמת עבודה שנכשלה ב-Linux, בעלי הדיאלוג בריבוי חלונות, בעלים מפורש לכל עבודה). קומיט שילוב.
  printing:
    git:
      url: https://github.com/Otzaria/dart_pdf
      ref: 3cb90fb3025553f3e9f48638c79ccf93efb326af
      path: printing
  # TODO: לחזור ל-pub.dev אחרי מיזוג ושחרור daohoangson/flutter_widget_from_html#1658, #1659,
  # #1660, #1661, #1662, #1663 (מטמון CSS, מיזוג margins, מחרוזות debug עצלות, Flattener,
  # FutureBuilder, צבע hex פגום).
  flutter_widget_from_html_core:
    git:
      url: https://github.com/Otzaria/flutter_widget_from_html
      ref: 57080495ee8b89aeee156a4440b6de1c5e0f7ef2
      path: packages/core
  matcher: ^0.12.20
  analyzer: ^14.5.0
  device_info_plus: ^13.3.0
  # הגרסה שב-pub.dev חסרה את תיקון גלילת הטאצ'פד.
  flutter_inappwebview_windows:
    git:
      url: https://github.com/Otzaria/flutter_inappwebview
      ref: 4a4e082eb9d7e8078fc0878ff4e028e121663b10
      path: flutter_inappwebview_windows
  flutter_inappwebview_platform_interface:
    git:
      url: https://github.com/Otzaria/flutter_inappwebview
      ref: 4a4e082eb9d7e8078fc0878ff4e028e121663b10
      path: flutter_inappwebview_platform_interface
  flutter_inappwebview_ios:
    git:
      url: https://github.com/Otzaria/flutter_inappwebview
      ref: 4a4e082eb9d7e8078fc0878ff4e028e121663b10
      path: flutter_inappwebview_ios
  flutter_inappwebview_macos:
    git:
      url: https://github.com/Otzaria/flutter_inappwebview
      ref: 4a4e082eb9d7e8078fc0878ff4e028e121663b10
      path: flutter_inappwebview_macos
  flutter_inappwebview_linux:
    git:
      url: https://github.com/Otzaria/flutter_inappwebview
      ref: 4a4e082eb9d7e8078fc0878ff4e028e121663b10
      path: flutter_inappwebview_linux
  # הגרסה שב-pub.dev קוראת ל-setStatusBarColor שהוצא משימוש ב-Android 15.
  flutter_inappwebview_android:
    git:
      url: https://github.com/Otzaria/flutter_inappwebview
      ref: 4a4e082eb9d7e8078fc0878ff4e028e121663b10
      path: flutter_inappwebview_android

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256 # min:48, max:256, default: 48

dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  # מחולל spec.json של התוספים (tool/plugins) מפרסר AST של קוד המקור.
  # מוצמד ל-major: צורת ה-AST משתנה בין גרסאות ראשיות ושוברת את המחולל.
  analyzer: ^14.5.0
  # לטעינת ספריית המנוע הנייטיבית בטסטים (ExternalLibrary).
  flutter_rust_bridge: ^2.13.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.31.1
  yaml: ^3.1.4
  build_runner: ^2.16.2
  bloc_test: ^10.0.0
  mockito: ^5.8.1
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.3
  hooks: ^2.2.0
  dart_pre_commit: ^6.1.5
  msix: ^3.18.0
  vm_service: ^15.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/bio/
    - assets/logos/
    - assets/ca/
    - assets/icon/icon.png
    - assets/icon/icon_256.png
    - assets/icon/otzplugin_file_icon.png
    - assets/logo_books/
    # ארכיוני התוספים המצורפים למובייל — מאוכלסת רק ב-CI (docs/bundled_plugins.md)
    - assets/bundled_plugins/
    - lib/migration/database/sql/
    - assets/dictionary.json
    - assets/Acronyms.json
    - assets/support_organizations.json
    # זהות המודל הסמנטי (model.json מ-otzaria-semantic-search)
    - assets/semantic/meivin-round2-onnx/
    - assets/semantic/meivin-round2-windows-onnx/

  fonts:
    # החבילה מספקת את הגופן אך אינה מצהירה עליו, ולכן שני אייקוני ה-light
    # שבמפת התוספים היו נטענים כריבוע ריק.
    - family: FluentSystemIcons-Light
      fonts:
        - asset: packages/fluentui_system_icons/fonts/FluentSystemIcons-Light.ttf
    - family: TaameyAshkenaz
      fonts:
        - asset: fonts/TaameyAshkenaz-Medium.ttf
    - family: FrankRuhlCLM
      fonts:
        - asset: fonts/FrankRuehlCLM-Medium.ttf
        - asset: fonts/FrankRuehlCLM-Bold.ttf
          weight: 700
    - family: Rubik
      fonts:
        - asset: fonts/Rubik-VariableFont_wght.ttf
    - family: NotoRashiHebrew
      fonts:
        - asset: fonts/NotoRashiHebrew-VariableFont_wght.ttf
    - family: TaameyDavidCLM
      fonts:
        - asset: fonts/TaameyDavidCLM-Medium.ttf
    - family: Shofar
      fonts:
        - asset: fonts/ShofarRegular.ttf
    - family: KeterYG
      fonts:
        - asset: fonts/KeterYG-Medium.ttf
    - family: Tinos
      fonts:
        - asset: fonts/Tinos-Regular.ttf
    - family: NotoSerifHebrew
      fonts:
        - asset: fonts/NotoSerifHebrew-VariableFont_wdth,wght.ttf
    - family: OtzariaAshurit
      fonts:
        - asset: packages/otzaria_ashurit/OtzariaAshurit-Regular.otf
        - asset: packages/otzaria_ashurit/OtzariaAshurit-Bold.otf
          weight: 700
    - family: OtzariaAshuritNikud
      fonts:
        - asset: packages/otzaria_ashurit/OtzariaAshuritNikud-Regular.otf
        - asset: packages/otzaria_ashurit/OtzariaAshuritNikud-Bold.otf
          weight: 700
    - family: AshkenaziStam
      fonts:
        - asset: fonts/tikkun_korim/Ashkenazi-Stam.ttf
    - family: SefardiStam
      fonts:
        - asset: fonts/tikkun_korim/Sefardi-Stam.ttf

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: otzariaorg

# התקנת ההוק: dart run tool/install_git_hooks.dart
dart_pre_commit:
  exclude:
    - '^packages/'
    - '^build/'
    - '\.g\.dart$'
    - '\.freezed\.dart$'
    - '\.mocks\.dart$'
  format: true
  analyze: true
  # כבויים: תלויות רבות מוצמדות בכוונה, וזה היה חוסם כל קומיט.
  outdated: false
  pull-up-dependencies: false
