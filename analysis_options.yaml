include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Unchanged upstream Dart is checked by tool/verify_vendored_packages.py.
    - packages/irondash_engine_context/**
    - packages/super_native_extensions/**
    - otzaria_search_engine/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# גרסת שפה 3.12 מפעילה את הפורמטר החדש (tall style) שמפרמט מחדש קבצים שלמים.
# preserve משאיר את הפסיקים הנגררים הקיימים — וכך את הסגנון הנוכחי של הקוד —
# ומונע דיפים של אלפי שורות בכל commit שנוגע בקובץ ישן.
formatter:
  trailing_commas: preserve
