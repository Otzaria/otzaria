include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - otzaria_search_engine/**
    # לכל חבילה ב-packages/ יש pubspec ו-CI משלה; בלי pub get שם הניתוח מהשורש נכשל.
    - packages/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# גרסת שפה 3.12 מפעילה את הפורמטר החדש (tall style) שמפרמט מחדש קבצים שלמים.
# preserve משאיר את הפסיקים הנגררים הקיימים — וכך את הסגנון הנוכחי של הקוד —
# ומונע דיפים של אלפי שורות בכל commit שנוגע בקובץ ישן.
formatter:
  trailing_commas: preserve
