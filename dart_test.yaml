# תצורת הרצת הבדיקות.
#
# התגית `live` מסמנת בדיקות שאינן בדיקות אלא **כלי מדידה ידניים**:
# הן פותחות תוכנה חיצונית, סורקות אותה דקות ארוכות, וכותבות לקטלוג
# האמיתי של המשתמש. הן מדולגות כברירת מחדל ורצות רק במפורש:
#
#     flutter test --tags live test/external_catalog/live_open_sample_test.dart
tags:
  live:
    skip: "כלי מדידה ידני — דורש התקנה חיה של בר אילן. הרצה: --tags live"
