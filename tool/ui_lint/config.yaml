# החרגות ui_lint לפי נתיב. לכל החרגה נדרש reason.
# החרגה של צומת בודד נכתבת בקוד: // ui-lint: allow UIL-xxx — נימוק
# הפירוט: docs/design-system/CI_ENFORCEMENT.md §3.5–3.6.

exclude:
  - path: "**/*.g.dart"
    reason: קוד שנוצר אוטומטית
  - path: lib/plugins/utils/fluent_icon_resolver.dart
    reason: מפת אייקונים שנוצרת אוטומטית

rules:
  UIL-001:
    exclude:
      - path: lib/widgets/dialogs/**
        reason: הרכיבים המשותפים שבונים את הדיאלוגים

  UIL-006:
    exclude:
      - path: lib/widgets/misc/rtl_icon.dart
        reason: הרכיב עצמו מחזיק את הרשימה ומהפך בה

  UIL-011:
    exclude:
      - path: lib/widgets/text/rtl_text_field.dart
        reason: העטיפה שבונה את השדה ומוסיפה לו RTL

  UIL-014:
    exclude:
      - path: lib/widgets/misc/**
        reason: מערכת התפריטים המשותפת (app_popup_menu) עצמה

  UIL-015:
    exclude:
      - path: lib/theme/**
        reason: שכבת הטוקנים
      - path: lib/printing/**
        reason: פלט נייר
      - path: lib/tools/tikkun_korim/export/**
        reason: פלט נייר
      - path: lib/tools/calendar/helpers/calendar_print_helpers.dart
        reason: פלט נייר
      - path: lib/core/windowing/**
        reason: כפתורי החלון מחקים את מערכת ההפעלה
      - path: lib/pdf_book/utils/pdf_color_filter.dart
        reason: צבע הנייר ומסנן ההיפוך של עמוד PDF (תוכן)
      - path: lib/widgets/misc/app_cursors.dart
        reason: ציור תמונת סמן העכבר, חיקוי של סמן המערכת
      - path: lib/widgets/smart_text/**
        reason: צבעי CSS של תוכן הספר
      - path: lib/text_book/view/widgets/continuous_reading_paragraph.dart
        reason: צבעי CSS של תוכן הספר

  UIL-017:
    exclude:
      - path: lib/theme/**
        reason: שכבת הטוקנים
      - path: lib/text_book/view/reader_line/**
        reason: טיפוגרפיית תוכן הספר לפי הגדרות המשתמש
      - path: lib/widgets/smart_text/**
        reason: טיפוגרפיית תוכן הספר לפי הגדרות המשתמש
      - path: lib/text_book/view/widgets/continuous_reading_paragraph.dart
        reason: טיפוגרפיית תוכן הספר לפי הגדרות המשתמש
      - path: lib/widgets/commentary/links_list_view.dart
        reason: גדלים יחסיים לגופן התוכן
      - path: lib/printing/**
        reason: פלט נייר
      - path: lib/tools/tikkun_korim/export/**
        reason: פלט נייר

  UIL-019:
    exclude:
      - path: lib/theme/**
        reason: שכבת הטוקנים
      - path: lib/printing/**
        reason: פלט נייר
