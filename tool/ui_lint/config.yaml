# החרגות ui_lint לפי נתיב. לכל החרגה נדרש reason.
# החרגה של צומת בודד נכתבת בקוד: // ui-lint: allow UIL-xxx — נימוק
# הפירוט: docs/design-system/CI_ENFORCEMENT.md §3.5–3.6.
#
# strict: true נועל כלל שהחוב שלו נגמר (CI_ENFORCEMENT.md §6, רמה 4): כל
# חריגה בו חוסמת, בכל שלב, ו־--allow-growth לא כותב לו רשומות baseline.
# ui_lint_test דורש strict לכל כלל שאין לו רשומות baseline.

# max_allows: תקרת הערות allow לכל כלל ב־lib (§3.5). כלל שלא מופיע כאן: 0.
# ui_lint_test נכשל כשיש יותר הערות מהתקרה, וגם כשיש פחות (להוריד את התקרה),
# כך שכל allow חדש מופיע ב־diff של הקובץ הזה.
max_allows:
  UIL-003: 1
  UIL-010: 5
  UIL-015: 5
  UIL-017: 3
  UIL-019: 1
  UIL-021: 26
  UIL-026: 1
  UIL-030: 2
  UIL-031: 2
  UIL-040: 1

# כל החרגת נתיב חייבת להשתיק לפחות ממצא אחד (ui_lint_test, "החרגה שלא משתיקה
# כלום"). היוצאים מן הכלל: lib/theme/** ב־UIL-021/023/029, מדיניות "שכבת
# הטוקנים פטורה מכללי הטוקנים" שנבדקת ב־ui_lint_test.
exclude:
  - path: "**/*.g.dart"
    reason: קוד שנוצר אוטומטית
  - path: lib/plugins/utils/fluent_icon_resolver.dart
    reason: מפת אייקונים שנוצרת אוטומטית

rules:
  UIL-004:
    strict: true

  UIL-005:
    strict: true

  UIL-009:
    strict: true

  UIL-022:
    strict: true

  UIL-032:
    strict: true

  UIL-027:
    exclude:
      - path: lib/theme/**
        reason: שכבת הטוקנים בונה את הצבעים לכל בהירות
      - path: lib/core/windowing/caption_button_colors.dart
        reason: כפתורי החלון מחקים את מערכת ההפעלה (JX-06)
      - path: lib/pdf_book/utils/pdf_color_filter.dart
        reason: צבע הנייר ומסנן ההיפוך של עמוד PDF (JX-05)

  UIL-033:
    strict: true

  UIL-001:
    strict: true
    exclude:
      - path: lib/widgets/dialogs/**
        reason: הרכיבים המשותפים שבונים את הדיאלוגים

  UIL-002:
    strict: true
    exclude:
      - path: lib/widgets/controls/**
        reason: רכיבי הכפתור המשותפים (ActionButton ועוד) בונים את כפתורי Material
      - path: lib/widgets/misc/app_dropdown_field.dart
        reason: הכפתור של AppDropdownField הוא FilledButton.tonal בצבעי השדה (DESIGN_SYSTEM §3.3)

  UIL-006:
    strict: true

  UIL-007:
    strict: true
    exclude:
      - path: lib/theme/**
        reason: ערכת הנושא מגדירה את צבעי המצב
      - path: packages/otzaria_context_menu/lib/src/menu_rows.dart
        reason: סגנון פריט התפריט עצמו (hover/pressed של M3) בחבילה שאינה תלויה בערכת הנושא של האפליקציה

  UIL-011:
    strict: true
    exclude:
      - path: lib/widgets/text/rtl_text_field.dart
        reason: העטיפה שבונה את השדה ומוסיפה לו RTL

  UIL-015:
    strict: true
    exclude:
      - path: lib/theme/**
        reason: שכבת הטוקנים
      - path: lib/tools/tikkun_korim/export/**
        reason: פלט נייר
      - path: lib/core/windowing/caption_button_colors.dart
        reason: כפתורי החלון מחקים את מערכת ההפעלה
      - path: lib/pdf_book/utils/pdf_color_filter.dart
        reason: צבע הנייר ומסנן ההיפוך של עמוד PDF (תוכן)
      - path: lib/widgets/misc/app_cursors.dart
        reason: ציור תמונת סמן העכבר, חיקוי של סמן המערכת
      - path: lib/widgets/smart_text/**
        reason: צבעי CSS של תוכן הספר
      - path: lib/text_book/view/widgets/continuous_reading_paragraph.dart
        reason: צבעי CSS של תוכן הספר

  UIL-017:
    exclude:
      - path: lib/theme/**
        reason: שכבת הטוקנים
      - path: lib/tools/tikkun_korim/export/**
        reason: פלט נייר

  UIL-018:
    strict: true

  UIL-019:
    strict: true
    exclude:
      - path: lib/theme/**
        reason: שכבת הטוקנים

  UIL-031:
    strict: true
    exclude:
      - path: lib/widgets/feedback/app_scrollbar.dart
        reason: AppScrollbar עצמו, שבונה את הפס בצד הקבוע ואת הרצועה

  UIL-030:
    exclude:
      - path: lib/theme/**
        reason: שכבת הטוקנים

  UIL-016:
    exclude:
      - path: packages/otzaria_context_menu/lib/src/menu_rows.dart
        reason: שקיפויות המצב של פריט התפריט (מושבת, hover, לחיצה) לפי M3, בחבילה שאין לה AppSurfaces
      - path: lib/theme/**
        reason: שכבת הטוקנים
      - path: lib/core/windowing/caption_button_colors.dart
        reason: כפתורי החלון מחקים את מערכת ההפעלה
      - path: lib/core/windowing/tab_drag_preview.dart
        reason: תצוגת הגרירה של כרטיסייה בין חלונות, חלק מכרום החלון (כמו כפתורי החלון)

  UIL-020:
    exclude:
      - path: lib/theme/**
        reason: שכבת הטוקנים
      - path: lib/tools/tikkun_korim/export/**
        reason: פלט נייר

  UIL-021:
    exclude:
      - path: lib/theme/**
        reason: שכבת הטוקנים
      - path: packages/otzaria_context_menu/lib/src/context_menu_region.dart
        reason: מיקום התפריט בקואורדינטות מסך גלובליות (Positioned ו-MenuStyle.alignment פיזיים בכוונה)
      - path: packages/otzaria_context_menu/lib/src/submenu_button.dart
        reason: כיוון פתיחת תת־תפריט נקבע פיזית לפי המקום שנותר במסך (openToRight)

  UIL-023:
    strict: true
    exclude:
      - path: lib/theme/**
        reason: שכבת הטוקנים

  UIL-029:
    exclude:
      - path: lib/theme/**
        reason: שכבת הטוקנים

  UIL-008:
    strict: true

  UIL-010:
    strict: true


  UIL-012:
    strict: true


  UIL-014:
    exclude:
      - path: packages/otzaria_context_menu/lib/src/context_menu_rows.dart
        reason: תפריט ההקשר של החבילה עצמה, שהוא התשתית של AppPopupMenuButton (MenuAnchor לניווט במקלדת ולתתי־תפריטים)

  UIL-013:
    exclude:
      - path: lib/widgets/feedback/**
        reason: רכיבי המשוב המשותפים (LoadingIndicator)
      - path: lib/widgets/controls/action_buttons.dart
        reason: מצב הטעינה של ActionButton (isLoading)


  UIL-025:
    strict: true


  UIL-026:
    strict: true
    exclude:
      - path: packages/otzaria_context_menu/lib/src/menu_rows.dart
        reason: מדידת רוחב התפריט; ברירת המחדל של הפרמטר היא בלי הגדלה, והקוראים מעבירים את ההגדלה של המערכת


  UIL-028:
    strict: true

  UIL-039:
    strict: true
    exclude:
      - path: lib/widgets/controls/segmented_control.dart
        reason: AppSegmentedControl עצמו, שעוטף את SegmentedButton של Material

  UIL-040:
    strict: true
    exclude:
      - path: lib/text_book/view/reader_line/**
        reason: תוכן הספר, בכיוון התוכן ולא בכיוון הכרום
      - path: lib/widgets/smart_text/**
