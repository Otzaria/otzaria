plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def androidStartupProbe = providers.gradleProperty('otzariaStartupProbe').orNull == 'true'
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
} else {
    // Fallback for CI environments that inject signing via env vars.
    def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    if (keystorePath != null) {
        keystoreProperties['storeFile'] = keystorePath
        keystoreProperties['storePassword'] = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ""
        keystoreProperties['keyAlias'] = System.getenv('ANDROID_KEY_ALIAS') ?: ""
        keystoreProperties['keyPassword'] = System.getenv('ANDROID_KEY_PASSWORD') ?: ""
    }
}

android {
    namespace "org.otzaria.otzaria"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // The opt-in probe must never install over the user's application.
        applicationId = androidStartupProbe ? "org.otzaria.otzaria.startupprobe" : "org.otzaria.otzaria"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    flavorDimensions 'distribution'
    productFlavors {
        direct { dimension 'distribution' }
        play { dimension 'distribution' }
    }



   
    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                storeFile file(keystoreProperties['storeFile'])
            }
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    packagingOptions {
        jniLibs {
            // שני פלאגיני Rust אורזים את אותו runtime של C++; נדרש עותק יחיד לכל ABI.
            pickFirsts += ['**/libc++_shared.so']
            // אריזה לא-דחוסה שברה טעינת ספריות נייטיביות במכשירים מסוימים
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            if (providers.gradleProperty('otzariaInstalledProbe').orNull == 'true') {
                applicationIdSuffix ".installedprobe"
            }
        }
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    playImplementation 'com.google.android.play:app-update:2.1.0'
    testImplementation 'junit:junit:4.13.2'
}
